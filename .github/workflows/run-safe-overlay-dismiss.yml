name: Run safe overlay dismissal patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-safe-overlay-dismiss.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply safe overlay dismissal patch
        run: python3 .github/scripts/safe_overlay_dismiss.py

      - name: Validate patch and JavaScript syntax
        run: |
          grep -q 'SAFE-OVERLAY-DISMISS-V1' index.html
          grep -q 'data-operation-menu-backdrop' index.html
          grep -q 'function closeOperationMenus()' index.html
          grep -q '20260916-safe-overlay-dismiss-v1' index.html
          python3 -c 'from pathlib import Path; import re; h=Path("index.html").read_text(encoding="utf-8"); s=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",h,flags=re.S); Path("/tmp/app-inline.js").write_text(s[-1],encoding="utf-8") if s else (_ for _ in ()).throw(SystemExit("No inline script found"))'
          node --check /tmp/app-inline.js

      - name: Ensure main did not move during patch
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix: close overlays safely on outside interaction"
          git push origin main
