name: Restructure fixed charges and account navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-fixed-account-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: python3 .github/scripts/restructure_fixed_account_nav.py
      - name: Commit app changes
        run: |
          rm -f .github/workflows/restructure-fixed-account-nav.yml
          rm -f .github/scripts/restructure_fixed_account_nav.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure fixed charges and account navigation"
          git push origin main
