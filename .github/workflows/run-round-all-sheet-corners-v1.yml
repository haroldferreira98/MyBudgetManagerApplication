name: Apply rounded modal corners

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-round-all-sheet-corners-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source fix
        run: python3 .github/scripts/round_all_sheet_corners_v1.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-rounded-sheet-corners-v1' index.html
          grep -q 'background-clip: padding-box;' index.html
          grep -q 'overflow: hidden;' index.html
          grep -q '.sheet-body { min-height: 0; overflow-y: auto;' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'background-clip: padding-box;' in html
          assert '    .sheet-body { min-height: 0; overflow-y: auto; padding: 8px 18px 20px; }' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if scripts:
              Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          if [ -f /tmp/app-inline.js ]; then node --check /tmp/app-inline.js; fi
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-round-all-sheet-corners-v1.yml
          rm .github/scripts/round_all_sheet_corners_v1.py
          git add index.html .github/workflows/run-round-all-sheet-corners-v1.yml .github/scripts/round_all_sheet_corners_v1.py
          git diff --cached --check
          git commit -m "fix: round all modal sheet corners"
          git push origin main
