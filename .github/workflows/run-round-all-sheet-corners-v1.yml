name: Apply rounded modal corners fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-round-all-sheet-corners-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply rounded modal corners fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r'<meta name="app-build" content="[^"]+"\s*/>',
              '<meta name="app-build" content="20260917-rounded-sheet-corners-v1" />',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('App build marker not found')

          old = '''    .sheet {
      width: min(100%, 748px);
      max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 20px);
      background: var(--surface-container-low);
      border-radius: var(--radius-sheet);
      box-shadow: 0 -20px 50px var(--shadow);
      display: flex;
      flex-direction: column;
      animation: sheetUp .25s cubic-bezier(.2,.8,.2,1);
    }'''
          new = '''    .sheet {
      width: min(100%, 748px);
      max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 20px);
      background: var(--surface-container-low);
      border-radius: var(--radius-sheet);
      background-clip: padding-box;
      overflow: hidden;
      box-shadow: 0 -20px 50px var(--shadow);
      display: flex;
      flex-direction: column;
      animation: sheetUp .25s cubic-bezier(.2,.8,.2,1);
    }'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one base .sheet block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old_body = '    .sheet-body { overflow-y: auto; padding: 8px 18px 20px; }'
          new_body = '    .sheet-body { min-height: 0; overflow-y: auto; padding: 8px 18px 20px; }'
          if text.count(old_body) != 1:
              raise SystemExit(f'Expected one .sheet-body rule, found {text.count(old_body)}')
          text = text.replace(old_body, new_body, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate final source
        shell: bash
        run: |
          grep -q '20260917-rounded-sheet-corners-v1' index.html
          grep -q 'background-clip: padding-box;' index.html
          grep -q 'overflow: hidden;' index.html
          grep -q '.sheet-body { min-height: 0; overflow-y: auto;' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('background-clip: padding-box;') >= 1
          assert html.count('    .sheet {') >= 1
          assert '    .sheet-body { min-height: 0; overflow-y: auto; padding: 8px 18px 20px; }' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if scripts:
              Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          if [ -f /tmp/app-inline.js ]; then node --check /tmp/app-inline.js; fi
          git diff --check

      - name: Ensure main did not move during patch
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit final fix and clean temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-round-all-sheet-corners-v1.yml
          git add index.html
          git diff --cached --check
          git commit -m "fix: round all modal sheet corners"
          git push origin main
