name: Refine numeric and list UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-numeric-fixed-expense-ui.yml'

permissions:
  contents: write

jobs:
  patch_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # 1) Operation labels: expenses are regular weight only inside category groups;
          # fixed-charge operation names are always regular weight.
          anchor_css = '''    .expense-category-items { display: grid; gap: 7px; padding: 0 8px 8px; }\n'''
          replacement_css = '''    .expense-category-items { display: grid; gap: 7px; padding: 0 8px 8px; }\n    .expense-category-items .expense-list-item .list-title,\n    .fixed-charge-row .list-title { font-weight: 400; }\n'''
          if anchor_css not in text:
            raise SystemExit('CSS anchor not found')
          text = text.replace(anchor_css, replacement_css, 1)

          # 2) Make number fields behave like payment-terminal inputs visually and on mobile.
          field_css = '''    .field input[type="date"] { min-width: 0; max-width: 100%; font-size: 16px; }\n'''
          field_css_new = '''    .field input[type="date"] { min-width: 0; max-width: 100%; font-size: 16px; }\n    .field input[type="number"] {\n      text-align: right;\n      font-variant-numeric: tabular-nums;\n      -moz-appearance: textfield;\n    }\n    .field input[type="number"]::-webkit-inner-spin-button,\n    .field input[type="number"]::-webkit-outer-spin-button {\n      -webkit-appearance: none;\n      margin: 0;\n    }\n'''
          if field_css not in text:
            raise SystemExit('Number CSS anchor not found')
          text = text.replace(field_css, field_css_new, 1)

          # 3) Remove category/day subtitle from every fixed-charge row.
          fixed_row_old = '''            <div class="list-main">\n              <div class="list-title">${escapeHtml(charge.label)}</div>\n              <div class="list-sub">${escapeHtml(category)} · Jour ${safeNumber(charge.day, 1)}</div>\n            </div>'''
          fixed_row_new = '''            <div class="list-main">\n              <div class="list-title">${escapeHtml(charge.label)}</div>\n            </div>'''
          if fixed_row_old not in text:
            raise SystemExit('Fixed row block not found')
          text = text.replace(fixed_row_old, fixed_row_new, 1)

          # Remove now-unused local category variable in fixed rows.
          text = text.replace('''        const category = charge.category || "Charge fixe";\n        return `''', '''        return `''', 1)

          # 4) Fixed charge day becomes a 1..31 dropdown, never a keyboard number field.
          day_old = '''            <div class="field"><label>Jour de prélèvement</label><input name="day" type="number" min="1" max="31" required value="${data.day ?? new Date().getDate()}"></div>'''
          day_new = '''            <div class="field"><label>Jour de prélèvement</label><select name="day" required>${optionTags(Array.from({ length: 31 }, (_, i) => String(i + 1)), String(data.day ?? new Date().getDate()))}</select></div>'''
          if day_old not in text:
            raise SystemExit('Fixed day input not found')
          text = text.replace(day_old, day_new, 1)

          # 5) Add one reusable enhancer for all numeric fields rendered in entity forms.
          option_block = '''    function optionTags(options, selected) {\n      return options.map(opt => {\n        const value = typeof opt === "string" ? opt : opt.value;\n        const label = typeof opt === "string" ? opt : opt.label;\n        return `<option value="${escapeHtml(value)}" ${String(selected) === String(value) ? "selected" : ""}>${escapeHtml(label)}</option>`;\n      }).join("");\n    }\n'''
          enhanced_block = option_block + '''\n    function enhanceNumericInputs(root) {\n      root.querySelectorAll('input[type="number"]').forEach(input => {\n        const step = String(input.getAttribute("step") || "1");\n        const integerInput = step === "1";\n        input.inputMode = integerInput ? "numeric" : "decimal";\n        input.setAttribute("enterkeyhint", "done");\n\n        input.addEventListener("focus", () => {\n          if (input.disabled || input.readOnly) return;\n          input.dataset.focusOriginalValue = input.value;\n          if (input.value !== "") {\n            input.value = "";\n            input.dataset.clearedOnFocus = "true";\n          } else {\n            delete input.dataset.clearedOnFocus;\n          }\n        });\n\n        input.addEventListener("blur", () => {\n          if (input.value === "" && input.dataset.clearedOnFocus === "true") {\n            input.value = input.dataset.focusOriginalValue || "";\n          }\n          delete input.dataset.clearedOnFocus;\n          delete input.dataset.focusOriginalValue;\n        });\n      });\n    }\n'''
          if option_block not in text:
            raise SystemExit('optionTags block not found')
          text = text.replace(option_block, enhanced_block, 1)

          # 6) Enhance every freshly rendered entity form. Existing explicit inputmode attrs remain harmless.
          inner_html_anchor = '''      target.innerHTML = `${fields}<div class="modal-actions">${deleteButton}<button class="btn primary" type="submit"><span class="material-symbols-outlined">save</span>${editing ? "Enregistrer" : "Ajouter"}</button></div>`;\n\n      if (type === "credit") {'''
          inner_html_new = '''      target.innerHTML = `${fields}<div class="modal-actions">${deleteButton}<button class="btn primary" type="submit"><span class="material-symbols-outlined">save</span>${editing ? "Enregistrer" : "Ajouter"}</button></div>`;\n      enhanceNumericInputs(target);\n\n      if (type === "credit") {'''
          if inner_html_anchor not in text:
            raise SystemExit('Form render anchor not found')
          text = text.replace(inner_html_anchor, inner_html_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit app change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine expense and fixed charge entry UI"
          git push origin main

      - name: Deploy app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
