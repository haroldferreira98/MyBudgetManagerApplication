name: Refine UI credit and cloud sync

on:
  push:
    paths:
      - '.github/workflows/refine-ui-credit-cloud.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          # Google Pixel inspired pastel blue palette.
          color_map = {
              '--primary: #6750a4;':'--primary: #0b57d0;',
              '--primary-container: #eaddff;':'--primary-container: #d3e3fd;',
              '--on-primary-container: #21005d;':'--on-primary-container: #041e49;',
              '--secondary: #625b71;':'--secondary: #44546f;',
              '--secondary-container: #e8def8;':'--secondary-container: #dce3f2;',
              '--on-secondary-container: #1d192b;':'--on-secondary-container: #111c2f;',
              '--tertiary: #7d5260;':'--tertiary: #3f6379;',
              '--tertiary-container: #ffd8e4;':'--tertiary-container: #cbe6f5;',
              '--on-tertiary-container: #31111d;':'--on-tertiary-container: #071e2b;',
              '--surface: #fff7ff;':'--surface: #f8fafd;',
              '--surface-dim: #ded8e1;':'--surface-dim: #d9dce2;',
              '--surface-bright: #fff7ff;':'--surface-bright: #f8fafd;',
              '--surface-container-low: #f7f2fa;':'--surface-container-low: #f3f6fb;',
              '--surface-container: #f3edf7;':'--surface-container: #edf1f7;',
              '--surface-container-high: #ece6f0;':'--surface-container-high: #e7ebf2;',
              '--surface-container-highest: #e6e0e9;':'--surface-container-highest: #e0e5ec;',
              '--on-surface: #1d1b20;':'--on-surface: #1b1b1f;',
              '--on-surface-variant: #49454f;':'--on-surface-variant: #44474e;',
              '--outline: #79747e;':'--outline: #74777f;',
              '--outline-variant: #cac4d0;':'--outline-variant: #c4c7cf;',
              '--primary: #d0bcff;':'--primary: #a8c7fa;',
              '--on-primary: #381e72;':'--on-primary: #062e6f;',
              '--primary-container: #4f378b;':'--primary-container: #0842a0;',
              '--on-primary-container: #eaddff;':'--on-primary-container: #d3e3fd;',
              '--secondary: #ccc2dc;':'--secondary: #bcc7dc;',
              '--on-secondary: #332d41;':'--on-secondary: #263141;',
              '--secondary-container: #4a4458;':'--secondary-container: #3c4858;',
              '--on-secondary-container: #e8def8;':'--on-secondary-container: #dce3f2;',
              '--tertiary: #efb8c8;':'--tertiary: #afcbe0;',
              '--tertiary-container: #633b48;':'--tertiary-container: #294c60;',
              '--on-tertiary-container: #ffd8e4;':'--on-tertiary-container: #cbe6f5;',
              '--surface: #141218;':'--surface: #111318;',
              '--surface-dim: #141218;':'--surface-dim: #111318;',
              '--surface-bright: #3b383e;':'--surface-bright: #37393e;',
              '--surface-container-lowest: #0f0d13;':'--surface-container-lowest: #0c0e12;',
              '--surface-container-low: #1d1b20;':'--surface-container-low: #191c20;',
              '--surface-container: #211f26;':'--surface-container: #1d2024;',
              '--surface-container-high: #2b2930;':'--surface-container-high: #272a2f;',
              '--surface-container-highest: #36343b;':'--surface-container-highest: #32353a;',
              '--on-surface: #e6e0e9;':'--on-surface: #e2e2e9;',
              '--on-surface-variant: #cac4d0;':'--on-surface-variant: #c4c7cf;',
              '--outline: #938f99;':'--outline: #8e9199;',
              '--outline-variant: #49454f;':'--outline-variant: #44474e;'
          }
          for old, new in color_map.items():
              if old in text:
                  text = text.replace(old, new, 1)

          text = text.replace('<meta name="theme-color" content="#f7f2fa" />', '<meta name="theme-color" content="#f8fafd" />', 1)
          text = text.replace('effective === "dark" ? "#141218" : "#fff7ff"', 'effective === "dark" ? "#111318" : "#f8fafd"', 1)

          # Bottom navigation: flush to the bottom, safe-area handled inside the bar.
          replace_once('''    .nav-wrap {\n      position: fixed;\n      z-index: 40;\n      left: 50%;\n      bottom: calc(12px + var(--safe-bottom));\n      transform: translateX(-50%);\n      width: min(calc(100% - 24px), 720px);\n      pointer-events: none;\n    }\n    .bottom-nav {\n      height: var(--nav-height);\n      padding: 8px 10px;\n      border-radius: var(--pill);''', '''    .nav-wrap {\n      position: fixed;\n      z-index: 40;\n      left: 50%;\n      bottom: 0;\n      transform: translateX(-50%);\n      width: min(calc(100% - 16px), 720px);\n      pointer-events: none;\n    }\n    .bottom-nav {\n      min-height: calc(var(--nav-height) + var(--safe-bottom));\n      height: auto;\n      padding: 8px 10px calc(8px + var(--safe-bottom));\n      border-radius: 30px 30px 0 0;''', 'bottom navigation')

          # Modal spacing on mobile, including safe area.
          replace_once('''    .sheet-backdrop {\n      position: fixed;\n      inset: 0;\n      z-index: 70;\n      background: var(--scrim);\n      display: none;\n      align-items: flex-end;\n      justify-content: center;\n      padding-top: calc(24px + var(--safe-top));\n    }''', '''    .sheet-backdrop {\n      position: fixed;\n      inset: 0;\n      z-index: 70;\n      background: var(--scrim);\n      display: none;\n      align-items: flex-end;\n      justify-content: center;\n      padding: calc(8px + var(--safe-top)) 6px calc(6px + var(--safe-bottom));\n    }''', 'sheet backdrop')
          replace_once('''    .sheet {\n      width: min(100%, 760px);\n      max-height: min(92dvh, 920px);\n      background: var(--surface-container-low);\n      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;''', '''    .sheet {\n      width: min(100%, 748px);\n      max-height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 20px);\n      background: var(--surface-container-low);\n      border-radius: var(--radius-sheet);''', 'sheet')
          text = text.replace('.sheet-body { overflow-y: auto; padding: 8px 18px calc(20px + var(--safe-bottom)); }', '.sheet-body { overflow-y: auto; padding: 8px 18px 20px; }', 1)

          # Inputs/date rendering on iOS and wider one-column breakpoint.
          insert_after = '''    .field textarea { min-height: 92px; resize: vertical; }\n'''
          addition = '''    .field input[type="date"] { min-width: 0; max-width: 100%; font-size: 16px; }\n    .field input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }\n    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }\n'''
          if addition not in text:
              replace_once(insert_after, insert_after + addition, 'date input styles')
          text = text.replace('@media (max-width: 390px) {', '@media (max-width: 560px) {', 1)

          # Remove the “Revenus vs engagé” card.
          text = re.sub(r'''\n          <div class="card" style="margin-top:12px">\n            <div class="balance-head"><strong>Revenus vs engagé</strong><span>\$\{s\.income > 0 \? `\$\{Math\.min\(999, \(s\.engaged / s\.income\) \* 100\)\.toFixed\(0\)\}%` : \(s\.engaged > 0 \? "—" : "0%"\)\}</span></div>\n            <div class="progress-track"><div class="progress-fill \$\{s\.engaged > s\.income && s\.income > 0 \? "error" : ""\}" style="width:\$\{incomeProgress\}%"></div></div>\n          </div>''', '', text, count=1)
          text = text.replace('      const incomeProgress = s.income > 0 ? clamp((s.engaged / s.income) * 100, 0, 100) : (s.engaged > 0 ? 100 : 0);\n', '', 1)

          # Credit helpers for mid-loan onboarding.
          credit_helpers = '''\n    function estimateRemainingBalance(principal, annualRate, monthlyPayment, monthsPaid) {\n      let balance = Math.max(0, safeNumber(principal));\n      const payment = Math.max(0, safeNumber(monthlyPayment));\n      const paid = Math.max(0, Math.round(safeNumber(monthsPaid)));\n      const monthlyRate = Math.max(0, safeNumber(annualRate)) / 100 / 12;\n      if (!payment || !paid) return balance;\n      for (let i = 0; i < paid && balance > 0.005; i += 1) {\n        const interest = balance * monthlyRate;\n        const principalPaid = Math.max(0, payment - interest);\n        if (principalPaid <= 0) break;\n        balance -= Math.min(balance, principalPaid);\n      }\n      return Math.max(0, balance);\n    }\n\n    function creditProgress(credit) {\n      const durationMonths = Math.max(0, Math.round(safeNumber(credit.durationMonths)));\n      const monthsPaid = durationMonths > 0\n        ? clamp(Math.round(safeNumber(credit.monthsPaid)), 0, durationMonths)\n        : Math.max(0, Math.round(safeNumber(credit.monthsPaid)));\n      const remainingPayments = durationMonths > 0 ? Math.max(0, durationMonths - monthsPaid) : null;\n      const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);\n      const calculatedBalance = durationMonths > 0\n        ? estimateRemainingBalance(credit.principal, rate, credit.monthlyPayment, monthsPaid)\n        : safeNumber(credit.balance);\n      return { durationMonths, monthsPaid, remainingPayments, calculatedBalance };\n    }\n'''
          marker = '    function renderProfile() {\n'
          if 'function creditProgress(credit)' not in text:
              replace_once(marker, credit_helpers + '\n' + marker, 'credit helpers')

          # Credit card presentation.
          old_credit_card = '''      const creditsHtml = state.credits.length ? state.credits.map(credit => {\n        const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);\n        return `\n          <div class="card">\n            <div class="section-header" style="margin:0 0 8px">\n              <div><h3 class="section-title" style="font-size:16px">${escapeHtml(credit.name)}</h3><p class="section-subtitle">${rate.toFixed(2)}% · mensualité <span class="money">${formatMoney(credit.monthlyPayment)}</span></p></div>\n              <button class="mini-btn" data-edit-type="credit" data-edit-id="${credit.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>\n            </div>\n            <div class="grid-2">\n              <div><div class="tiny">Capital restant</div><strong class="money">${formatMoney(credit.balance)}</strong></div>\n              <div><div class="tiny">Capital initial</div><strong class="money">${formatMoney(credit.principal)}</strong></div>\n            </div>\n            <div class="spacer-12"></div>\n            <button class="btn outlined full" data-sim-credit="${credit.id}"><span class="material-symbols-outlined">calculate</span>Simuler un remboursement anticipé</button>\n          </div>`;\n      }).join("") : emptyState("credit_card", "Aucun crédit", "Ajoute un crédit pour suivre sa mensualité et simuler un surplus de remboursement.");'''
          new_credit_card = '''      const creditsHtml = state.credits.length ? state.credits.map(credit => {\n        const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);\n        const progress = creditProgress(credit);\n        const durationText = progress.durationMonths > 0 ? `${progress.monthsPaid}/${progress.durationMonths} mensualités remboursées` : "Durée à compléter";\n        return `\n          <div class="card">\n            <div class="section-header" style="margin:0 0 8px">\n              <div><h3 class="section-title" style="font-size:16px">${escapeHtml(credit.name)}</h3><p class="section-subtitle">${rate.toFixed(2)}% · ${durationText}</p></div>\n              <button class="mini-btn" data-edit-type="credit" data-edit-id="${credit.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>\n            </div>\n            <div class="grid-2">\n              <div><div class="tiny">Capital restant estimé</div><strong class="money">${formatMoney(progress.calculatedBalance)}</strong></div>\n              <div><div class="tiny">Mensualités restantes</div><strong>${progress.remainingPayments ?? "—"}</strong></div>\n            </div>\n            <div class="tiny" style="margin-top:10px">Mensualité : <span class="money">${formatMoney(credit.monthlyPayment)}</span> · Capital initial : <span class="money">${formatMoney(credit.principal)}</span></div>\n            <div class="spacer-12"></div>\n            <button class="btn outlined full" data-sim-credit="${credit.id}"><span class="material-symbols-outlined">calculate</span>Simuler un remboursement anticipé</button>\n          </div>`;\n      }).join("") : emptyState("credit_card", "Aucun crédit", "Ajoute un crédit pour suivre sa mensualité et simuler un surplus de remboursement.");'''
          replace_once(old_credit_card, new_credit_card, 'credit card')

          # Credit form: duration and months already paid; remaining balance calculated automatically.
          old_credit_fields = '''        fields = `\n          <div class="field"><label>Nom du crédit</label><input name="name" required maxlength="80" value="${escapeHtml(data.name || "")}" placeholder="Ex. Crédit auto"></div>\n          <div class="field-row">\n            <div class="field"><label>Capital initial (€)</label><input name="principal" type="number" min="0" step="0.01" required value="${data.principal ?? ""}"></div>\n            <div class="field"><label>Capital restant (€)</label><input name="balance" type="number" min="0" step="0.01" value="${data.balance ?? data.principal ?? ""}"></div>\n          </div>\n          <label class="checkbox-row"><input id="zeroRateInput" name="zeroRate" type="checkbox" ${zero ? "checked" : ""}><span>Prêt à taux zéro (0%)</span></label>\n          <div class="field-row">\n            <div class="field"><label>Taux annuel (%)</label><input id="annualRateInput" name="annualRate" type="number" min="0" step="0.01" value="${zero ? 0 : (data.annualRate ?? "")}" ${zero ? "disabled" : ""}></div>\n            <div class="field"><label>Mensualité (€)</label><input name="monthlyPayment" type="number" min="0" step="0.01" required value="${data.monthlyPayment ?? ""}"></div>\n          </div>\n          <label class="checkbox-row"><input name="active" type="checkbox" ${data.active !== false ? "checked" : ""}><span>Crédit actif</span></label>`;'''
          new_credit_fields = '''        fields = `\n          <div class="field"><label>Nom du crédit</label><input name="name" required maxlength="80" value="${escapeHtml(data.name || "")}" placeholder="Ex. Crédit auto"></div>\n          <div class="field-row">\n            <div class="field"><label>Capital initial (€)</label><input name="principal" type="number" min="0" step="0.01" required value="${data.principal ?? ""}"></div>\n            <div class="field"><label>Mensualité (€)</label><input name="monthlyPayment" type="number" min="0" step="0.01" required value="${data.monthlyPayment ?? ""}"></div>\n          </div>\n          <div class="field-row">\n            <div class="field"><label>Durée totale (mois)</label><input name="durationMonths" type="number" min="1" max="600" step="1" required value="${data.durationMonths ?? ""}"></div>\n            <div class="field"><label>Mois déjà remboursés</label><input name="monthsPaid" type="number" min="0" max="600" step="1" required value="${data.monthsPaid ?? 0}"></div>\n          </div>\n          <label class="checkbox-row"><input id="zeroRateInput" name="zeroRate" type="checkbox" ${zero ? "checked" : ""}><span>Prêt à taux zéro (0%)</span></label>\n          <div class="field"><label>Taux annuel (%)</label><input id="annualRateInput" name="annualRate" type="number" min="0" step="0.01" value="${zero ? 0 : (data.annualRate ?? "")}" ${zero ? "disabled" : ""}></div>\n          <div class="tiny" style="margin:6px 4px 14px">Le capital restant et le nombre de mensualités restantes sont calculés automatiquement à partir de ces informations.</div>\n          <label class="checkbox-row"><input name="active" type="checkbox" ${data.active !== false ? "checked" : ""}><span>Crédit actif</span></label>`;'''
          replace_once(old_credit_fields, new_credit_fields, 'credit form')

          old_credit_submit = '''      } else if (type === "credit") {\n        const zeroRate = fd.get("zeroRate") === "on";\n        const principal = safeNumber(fd.get("principal"));\n        const balanceRaw = fd.get("balance");\n        item = {\n          id: id || uid("crd"), name: String(fd.get("name") || "").trim(), principal,\n          balance: balanceRaw === "" || balanceRaw == null ? principal : safeNumber(balanceRaw),\n          zeroRate, annualRate: zeroRate ? 0 : safeNumber(fd.get("annualRate")), monthlyPayment: safeNumber(fd.get("monthlyPayment")), active: fd.get("active") === "on"\n        };'''
          new_credit_submit = '''      } else if (type === "credit") {\n        const zeroRate = fd.get("zeroRate") === "on";\n        const principal = safeNumber(fd.get("principal"));\n        const monthlyPayment = safeNumber(fd.get("monthlyPayment"));\n        const durationMonths = clamp(Math.round(safeNumber(fd.get("durationMonths"), 1)), 1, 600);\n        const monthsPaid = clamp(Math.round(safeNumber(fd.get("monthsPaid"), 0)), 0, durationMonths);\n        const annualRate = zeroRate ? 0 : safeNumber(fd.get("annualRate"));\n        const balance = estimateRemainingBalance(principal, annualRate, monthlyPayment, monthsPaid);\n        item = {\n          id: id || uid("crd"), name: String(fd.get("name") || "").trim(), principal, balance,\n          durationMonths, monthsPaid, zeroRate, annualRate, monthlyPayment, active: fd.get("active") === "on"\n        };'''
          replace_once(old_credit_submit, new_credit_submit, 'credit save')

          # Firebase config is loaded separately so the public web config can be added without touching app logic.
          if '<script src="firebase-config.js"></script>' not in text:
              replace_once('  <script>\n    "use strict";', '  <script src="firebase-config.js"></script>\n  <script>\n    "use strict";', 'firebase config script')

          # Cloud state globals.
          replace_once('''    let snackbarTimer = null;\n    let recognition = null;''', '''    let snackbarTimer = null;\n    let recognition = null;\n    let cloud = null;\n    let cloudUser = null;\n    let cloudSaveTimer = null;\n    let applyingCloudState = false;''', 'cloud globals')

          # Save locally first, then sync cloud if connected.
          replace_once('''    function saveState(message = "") {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n      if (message) showSnackbar(message);\n      renderAll();\n    }''', '''    function saveState(message = "") {\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n      if (!applyingCloudState) scheduleCloudSave();\n      if (message) showSnackbar(message);\n      renderAll();\n    }''', 'saveState cloud hook')

          cloud_functions = '''\n    function isFirebaseConfigured() {\n      const cfg = window.BUDGET_FIREBASE_CONFIG;\n      return !!(cfg && cfg.apiKey && cfg.authDomain && cfg.projectId && cfg.appId);\n    }\n\n    function hasMeaningfulData(candidate) {\n      if (!candidate) return false;\n      return ["incomes", "expenses", "fixedCharges", "credits", "projects", "envelopes"]\n        .some(key => Array.isArray(candidate[key]) && candidate[key].length > 0);\n    }\n\n    async function initCloudSync() {\n      if (!isFirebaseConfigured()) {\n        renderProfile();\n        return;\n      }\n      try {\n        const [appMod, authMod, storeMod] = await Promise.all([\n          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),\n          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),\n          import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")\n        ]);\n        const app = appMod.initializeApp(window.BUDGET_FIREBASE_CONFIG);\n        const auth = authMod.getAuth(app);\n        const db = storeMod.getFirestore(app);\n        const provider = new authMod.GoogleAuthProvider();\n        cloud = { auth, db, provider, authMod, storeMod };\n\n        authMod.onAuthStateChanged(auth, async user => {\n          cloudUser = user || null;\n          renderProfile();\n          if (cloudUser) await reconcileCloudState();\n        });\n        await authMod.getRedirectResult(auth);\n      } catch (error) {\n        console.error("Initialisation Firebase impossible", error);\n        showSnackbar("Connexion cloud indisponible pour le moment.");\n      }\n    }\n\n    function scheduleCloudSave() {\n      if (!cloud || !cloudUser) return;\n      clearTimeout(cloudSaveTimer);\n      cloudSaveTimer = setTimeout(() => writeCloudState().catch(error => {\n        console.error("Synchronisation cloud impossible", error);\n        showSnackbar("La sauvegarde cloud a échoué. Les données locales sont conservées.");\n      }), 450);\n    }\n\n    async function writeCloudState() {\n      if (!cloud || !cloudUser) return;\n      const { doc, setDoc, serverTimestamp } = cloud.storeMod;\n      await setDoc(doc(cloud.db, "budgetUsers", cloudUser.uid), {\n        state,\n        schemaVersion: STATE_VERSION,\n        updatedAt: serverTimestamp()\n      }, { merge: true });\n    }\n\n    async function reconcileCloudState() {\n      if (!cloud || !cloudUser) return;\n      const { doc, getDoc } = cloud.storeMod;\n      const ref = doc(cloud.db, "budgetUsers", cloudUser.uid);\n      const snap = await getDoc(ref);\n      if (!snap.exists() || !snap.data()?.state) {\n        await writeCloudState();\n        showSnackbar("Compte Google connecté. Les données locales sont sauvegardées en ligne.");\n        return;\n      }\n\n      const remote = migrateState(snap.data().state);\n      const localHasData = hasMeaningfulData(state);\n      const remoteHasData = hasMeaningfulData(remote);\n      const differs = JSON.stringify(state) !== JSON.stringify(remote);\n\n      if (localHasData && remoteHasData && differs) {\n        const loadCloud = confirm("Des données différentes existent déjà dans votre compte Google. OK pour charger la version cloud, Annuler pour conserver cet appareil et remplacer la version cloud.");\n        if (!loadCloud) {\n          await writeCloudState();\n          showSnackbar("Les données de cet appareil ont été envoyées dans le cloud.");\n          return;\n        }\n      }\n\n      applyingCloudState = true;\n      state = remote;\n      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n      applyingCloudState = false;\n      renderAll();\n      showSnackbar("Données cloud chargées.");\n    }\n\n    async function signInWithGoogle() {\n      if (!cloud) {\n        showSnackbar("Firebase doit d'abord être configuré.");\n        return;\n      }\n      await cloud.authMod.signInWithRedirect(cloud.auth, cloud.provider);\n    }\n\n    async function signOutGoogle() {\n      if (!cloud) return;\n      await cloud.authMod.signOut(cloud.auth);\n      cloudUser = null;\n      renderProfile();\n      showSnackbar("Compte Google déconnecté. Les données locales restent sur cet appareil.");\n    }\n'''
          marker = '    function applyTheme() {\n'
          if 'async function initCloudSync()' not in text:
              replace_once(marker, cloud_functions + '\n' + marker, 'cloud functions')

          # Cloud account section in profile.
          cloud_section = '''\n        <div class="section">\n          <div class="section-header"><div><h2 class="section-title">Compte & synchronisation</h2><p class="section-subtitle">Sauvegarde en ligne avec votre compte Google.</p></div></div>\n          <div class="card">\n            <div class="list-item" style="padding:12px 0;background:transparent;border:0">\n              <div class="list-icon"><span class="material-symbols-outlined">cloud</span></div>\n              <div class="list-main">\n                <div class="list-title">${cloudUser ? escapeHtml(cloudUser.email || "Compte Google") : (isFirebaseConfigured() ? "Non connecté" : "Configuration Firebase requise")}</div>\n                <div class="list-sub">${cloudUser ? "Synchronisation automatique activée" : (isFirebaseConfigured() ? "Connectez-vous pour sauvegarder et retrouver vos données" : "La partie Google est prête dans le code, il reste à ajouter la configuration Firebase")}</div>\n              </div>\n            </div>\n            <div class="button-row" style="margin-top:10px">\n              <button class="btn primary" id="googleSignInBtn" ${(!isFirebaseConfigured() || cloudUser) ? "disabled" : ""}><span class="material-symbols-outlined">login</span>Se connecter avec Google</button>\n              <button class="btn outlined ${cloudUser ? "" : "hidden"}" id="googleSignOutBtn"><span class="material-symbols-outlined">logout</span>Se déconnecter</button>\n            </div>\n          </div>\n        </div>\n'''
          marker = '''        <div class="section">\n          <div class="section-header"><div><h2 class="section-title">Sauvegarde & données</h2>'''
          if 'Compte & synchronisation' not in text:
              replace_once(marker, cloud_section + '\n' + marker, 'cloud profile section')

          # Click handlers for Google account buttons.
          click_marker = '''      if (event.target.id === "resetBtn" || event.target.closest("#resetBtn")) resetAllData();\n'''
          click_add = '''      if (event.target.id === "googleSignInBtn" || event.target.closest("#googleSignInBtn")) signInWithGoogle().catch(error => { console.error(error); showSnackbar("Connexion Google impossible."); });\n      if (event.target.id === "googleSignOutBtn" || event.target.closest("#googleSignOutBtn")) signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });\n'''
          if 'signInWithGoogle().catch' not in text:
              replace_once(click_marker, click_marker + click_add, 'cloud click handlers')

          # Start cloud after local UI is ready.
          replace_once('''    renderAll();\n  </script>''', '''    renderAll();\n    initCloudSync();\n  </script>''', 'cloud init')

          path.write_text(text, encoding='utf-8')

          cfg = Path('firebase-config.js')
          if not cfg.exists():
              cfg.write_text('''// Configuration publique de l\'application Web Firebase.\n// Remplacez null par l\'objet firebaseConfig fourni par la console Firebase.\nwindow.BUDGET_FIREBASE_CONFIG = null;\n''', encoding='utf-8')
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html firebase-config.js
          git commit -m "Refine mobile UI and credit tracking"
          git push
