name: Refine budget header and settings

on:
  push:
    paths:
      - '.github/workflows/refine-budget-header-settings.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and budget allocation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          # Header: Google account on the left, settings on the right.
          replace_once('''    .brand { min-width: 0; }''', '''    .brand { min-width: 0; flex: 1; }\n    .top-account-btn {\n      width: 46px;\n      height: 46px;\n      flex: 0 0 46px;\n      border: 1px solid color-mix(in srgb, var(--outline-variant) 65%, transparent);\n      border-radius: 50%;\n      padding: 0;\n      display: grid;\n      place-items: center;\n      overflow: hidden;\n      background: var(--surface-container-lowest);\n      color: var(--primary);\n      cursor: pointer;\n      box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 35%, transparent);\n    }\n    .top-account-btn:active { transform: scale(.94); }\n    .top-account-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }\n    .account-letter { font-size: 21px; font-weight: 700; font-family: Arial, sans-serif; }''', 'brand/account css')

          replace_once('''    .hero-card::after {\n      content: "";\n      position: absolute;\n      width: 190px;\n      height: 190px;\n      border-radius: 50%;\n      right: -92px;\n      top: -112px;\n      background: color-mix(in srgb, var(--primary) 11%, transparent);\n    }''', '''    .hero-card::after {\n      content: "";\n      position: absolute;\n      width: 190px;\n      height: 190px;\n      border-radius: 50%;\n      right: -92px;\n      top: -112px;\n      background: color-mix(in srgb, var(--primary) 11%, transparent);\n      pointer-events: none;\n    }\n    .hero-card > * { position: relative; z-index: 1; }\n    .hero-privacy-btn {\n      position: absolute;\n      top: 14px;\n      right: 14px;\n      z-index: 2;\n      width: 42px;\n      height: 42px;\n      background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent);\n      color: var(--on-primary-container);\n    }''', 'hero privacy css')

          old_header = '''    <header class="topbar">\n      <div class="brand">\n        <p class="brand-eyebrow">Budget personnel</p>\n        <h1 class="brand-title" id="screenTitle">Accueil</h1>\n      </div>\n      <div class="top-actions">\n        <button class="icon-btn" id="privacyBtn" aria-label="Masquer les montants" title="Masquer les montants">\n          <span class="material-symbols-outlined" id="privacyIcon">visibility</span>\n        </button>\n      </div>\n    </header>'''
          new_header = '''    <header class="topbar">\n      <button class="top-account-btn" id="accountBtn" type="button" aria-label="Se connecter avec Google" title="Se connecter avec Google">\n        <span class="account-letter">G</span>\n      </button>\n      <div class="brand">\n        <p class="brand-eyebrow">Budget personnel</p>\n        <h1 class="brand-title" id="screenTitle">Accueil</h1>\n      </div>\n      <div class="top-actions">\n        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Paramètres" title="Paramètres">\n          <span class="material-symbols-outlined">settings</span>\n        </button>\n      </div>\n    </header>'''
          replace_once(old_header, new_header, 'header markup')

          # Add settings bottom sheet.
          settings_modal = '''\n  <div class="sheet-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">\n    <div class="sheet">\n      <div class="sheet-handle"></div>\n      <div class="sheet-head">\n        <h2 class="sheet-title" id="settingsTitle">Paramètres</h2>\n        <button class="icon-btn" data-close-modal="settingsModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>\n      </div>\n      <div class="sheet-body">\n        <div class="section" style="margin-top:4px">\n          <div class="section-header"><div><h3 class="section-title">Apparence</h3><p class="section-subtitle">Le mode Automatique suit le thème de l’iPhone.</p></div></div>\n          <div class="segmented" id="settingsThemeSegment">\n            <button data-theme-choice="light">Clair</button>\n            <button data-theme-choice="dark">Sombre</button>\n            <button data-theme-choice="auto">Automatique</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n'''
          marker = '''  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden>'''
          if 'id="settingsModal"' not in text:
              replace_once(marker, settings_modal + '\n' + marker, 'settings modal')

          # 50/30/20 now has an unambiguous meaning.
          old_snapshot = '''      const needsExpenses = sum(currentMonthExpenses().filter(x => (x.bucket || defaultBucketForCategory(x.category)) === "needs"), x => x.amount);\n      const wantsExpenses = sum(currentMonthExpenses().filter(x => (x.bucket || defaultBucketForCategory(x.category)) === "wants"), x => x.amount);\n      const needsFixed = sum(activeFixedCharges().filter(x => (x.bucket || "needs") === "needs"), x => x.amount);\n      const wantsFixed = sum(activeFixedCharges().filter(x => x.bucket === "wants"), x => x.amount);\n      const savingsExpense = sum(currentMonthExpenses().filter(x => x.bucket === "savings"), x => x.amount);\n      const savingsFixed = sum(activeFixedCharges().filter(x => x.bucket === "savings"), x => x.amount);\n\n      return {\n        income, expenses, fixed, credits, projects, engaged, remaining, daily,\n        buckets: {\n          needs: needsExpenses + needsFixed,\n          wants: wantsExpenses + wantsFixed,\n          savings: savingsExpense + savingsFixed + credits + projects\n        }\n      };'''
          new_snapshot = '''      return {\n        income, expenses, fixed, credits, projects, engaged, remaining, daily,\n        buckets: {\n          needs: fixed,\n          wants: expenses,\n          savings: projects\n        }\n      };'''
          replace_once(old_snapshot, new_snapshot, '503020 calculation')

          replace_once('''      const bucketCards = [\n        { key: "needs", label: "Besoins", target: 50, value: s.buckets.needs },\n        { key: "wants", label: "Envies", target: 30, value: s.buckets.wants },\n        { key: "savings", label: "Épargne / Crédit", target: 20, value: s.buckets.savings }\n      ].map(item => {''', '''      const bucketCards = [\n        { key: "needs", label: "Charges fixes", target: 50, value: s.buckets.needs },\n        { key: "wants", label: "Dépenses courantes", target: 30, value: s.buckets.wants },\n        { key: "savings", label: "Épargne", target: 20, value: s.buckets.savings }\n      ].map(item => {''', '503020 labels')

          text = text.replace('''<div class="section-header"><div><h2 class="section-title">Équilibre 50 / 30 / 20</h2><p class="section-subtitle">Répartition réelle par rapport aux revenus du mois.</p></div></div>''', '''<div class="section-header"><div><h2 class="section-title">Équilibre 50 / 30 / 20</h2><p class="section-subtitle">50 % charges fixes · 30 % dépenses courantes · 20 % épargne.</p></div></div>''', 1)

          # Eye button is now part of the Reste à vivre card.
          replace_once('''          <div class="card hero-card">\n            <div class="hero-label">Reste à vivre ce mois-ci</div>''', '''          <div class="card hero-card">\n            <button class="icon-btn hero-privacy-btn" id="privacyBtn" type="button" aria-label="Masquer les montants" title="Masquer les montants"><span class="material-symbols-outlined" id="privacyIcon">visibility</span></button>\n            <div class="hero-label">Reste à vivre ce mois-ci</div>''', 'hero privacy markup')

          # Remove old per-item bucket selectors: category type determines the 50/30/20 group now.
          replace_once('''          <div class="field-row">\n            <div class="field"><label>Catégorie</label><select name="category">${optionTags(EXPENSE_CATEGORIES, data.category || "Autre")}</select></div>\n            <div class="field"><label>Affectation 50/30/20</label><select name="bucket">${optionTags(BUDGET_BUCKETS, data.bucket || defaultBucketForCategory(data.category || "Autre"))}</select></div>\n          </div>`;''', '''          <div class="field"><label>Catégorie</label><select name="category">${optionTags(EXPENSE_CATEGORIES, data.category || "Autre")}</select></div>`;''', 'expense bucket selector')

          replace_once('''          </div>\n          <div class="field"><label>Affectation 50/30/20</label><select name="bucket">${optionTags(BUDGET_BUCKETS, commonBucket)}</select></div>\n          <label class="checkbox-row"><input name="active" type="checkbox" ${data.active !== false ? "checked" : ""}><span>Charge active</span></label>`;''', '''          </div>\n          <label class="checkbox-row"><input name="active" type="checkbox" ${data.active !== false ? "checked" : ""}><span>Charge active</span></label>`;''', 'fixed bucket selector')

          text = text.replace('''date: fd.get("date") || todayISO(), category: fd.get("category") || "Autre", bucket: fd.get("bucket") || "needs"''', '''date: fd.get("date") || todayISO(), category: fd.get("category") || "Autre", bucket: "wants"''', 1)
          text = text.replace('''day: clamp(Math.round(safeNumber(fd.get("day"), 1)), 1, 31), bucket: fd.get("bucket") || "needs", active: fd.get("active") === "on",''', '''day: clamp(Math.round(safeNumber(fd.get("day"), 1)), 1, 31), bucket: "needs", active: fd.get("active") === "on",''', 1)

          # Remove Appearance and Google login cards from Profile: both are now in the header/settings.
          appearance_pattern = re.compile(r'''\n        <div class="section">\n          <div class="section-header"><div><h2 class="section-title">Apparence</h2><p class="section-subtitle">Le mode Automatique suit le thème du système\.</p></div></div>\n          <div class="segmented" id="themeSegment">\n            <button data-theme-choice="light" class="\$\{state\.settings\.theme === "light" \? "active" : ""\}">Clair</button>\n            <button data-theme-choice="dark" class="\$\{state\.settings\.theme === "dark" \? "active" : ""\}">Sombre</button>\n            <button data-theme-choice="auto" class="\$\{state\.settings\.theme === "auto" \? "active" : ""\}">Automatique</button>\n          </div>\n        </div>\n''')
          text, n = appearance_pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit('Could not remove appearance profile section')

          account_pattern = re.compile(r'''\n\n        <div class="section">\n          <div class="section-header"><div><h2 class="section-title">Compte & synchronisation</h2><p class="section-subtitle">Sauvegarde en ligne avec votre compte Google\.</p></div></div>\n          <div class="card">.*?\n          </div>\n        </div>\n''', re.S)
          text, n = account_pattern.subn('\n', text, count=1)
          if n != 1:
              raise SystemExit('Could not remove account profile section')

          # Privacy now lives in a dynamic Home card, so make the updater null-safe.
          replace_once('''    function applyPrivacy() {\n      document.body.classList.toggle("privacy", !!state.settings.privacy);\n      const icon = document.getElementById("privacyIcon");\n      const btn = document.getElementById("privacyBtn");\n      icon.textContent = state.settings.privacy ? "visibility_off" : "visibility";\n      btn.setAttribute("aria-label", state.settings.privacy ? "Afficher les montants" : "Masquer les montants");\n      btn.title = state.settings.privacy ? "Afficher les montants" : "Masquer les montants";\n    }''', '''    function applyPrivacy() {\n      document.body.classList.toggle("privacy", !!state.settings.privacy);\n      const icon = document.getElementById("privacyIcon");\n      const btn = document.getElementById("privacyBtn");\n      if (icon) icon.textContent = state.settings.privacy ? "visibility_off" : "visibility";\n      if (btn) {\n        btn.setAttribute("aria-label", state.settings.privacy ? "Afficher les montants" : "Masquer les montants");\n        btn.title = state.settings.privacy ? "Afficher les montants" : "Masquer les montants";\n      }\n    }\n\n    function updateTopAccountButton() {\n      const btn = document.getElementById("accountBtn");\n      if (!btn) return;\n      if (cloudUser) {\n        const photo = cloudUser.photoURL ? escapeHtml(cloudUser.photoURL) : "";\n        btn.innerHTML = photo ? `<img src="${photo}" alt="">` : `<span class="material-symbols-outlined">account_circle</span>`;\n        const who = cloudUser.displayName || cloudUser.email || "Compte Google";\n        btn.setAttribute("aria-label", `${who} — se déconnecter`);\n        btn.title = `${who} — se déconnecter`;\n      } else {\n        btn.innerHTML = `<span class="account-letter">G</span>`;\n        btn.setAttribute("aria-label", "Se connecter avec Google");\n        btn.title = "Se connecter avec Google";\n      }\n    }\n\n    function updateSettingsUI() {\n      document.querySelectorAll('#settingsModal [data-theme-choice]').forEach(btn => {\n        btn.classList.toggle("active", btn.dataset.themeChoice === (state.settings.theme || "auto"));\n      });\n    }''', 'privacy/account/settings funcs')

          # Auth state should immediately refresh the top-left avatar.
          replace_once('''        authMod.onAuthStateChanged(auth, async user => {\n          cloudUser = user || null;\n          renderProfile();\n          if (cloudUser) await reconcileCloudState();\n        });''', '''        authMod.onAuthStateChanged(auth, async user => {\n          cloudUser = user || null;\n          renderProfile();\n          updateTopAccountButton();\n          if (cloudUser) await reconcileCloudState();\n        });''', 'auth state avatar')

          replace_once('''      cloudUser = null;\n      renderProfile();\n      showSnackbar("Compte Google déconnecté. Les données locales restent sur cet appareil.");''', '''      cloudUser = null;\n      renderProfile();\n      updateTopAccountButton();\n      showSnackbar("Compte Google déconnecté. Les données locales restent sur cet appareil.");''', 'signout avatar')

          replace_once('''    function renderAll() {\n      applyTheme();\n      applyPrivacy();\n      renderHome();\n      renderIncome();\n      renderExpenses();\n      renderProfile();\n      setCurrentScreen(currentScreen, false);\n    }''', '''    function renderAll() {\n      applyTheme();\n      renderHome();\n      renderIncome();\n      renderExpenses();\n      renderProfile();\n      applyPrivacy();\n      updateTopAccountButton();\n      updateSettingsUI();\n      setCurrentScreen(currentScreen, false);\n    }''', 'renderAll order')

          # Remove the old static privacy listener and handle the new dynamic button through delegation.
          old_priv_listener = '''    document.getElementById("privacyBtn").addEventListener("click", () => {\n      state.settings.privacy = !state.settings.privacy;\n      saveState();\n    });\n\n'''
          replace_once(old_priv_listener, '', 'old privacy listener')

          event_marker = '''    document.addEventListener("click", event => {\n      const nav = event.target.closest("[data-screen]");'''
          event_replacement = '''    document.addEventListener("click", event => {\n      const privacy = event.target.closest("#privacyBtn");\n      if (privacy) {\n        state.settings.privacy = !state.settings.privacy;\n        saveState();\n        return;\n      }\n\n      const settings = event.target.closest("#settingsBtn");\n      if (settings) { updateSettingsUI(); openModal("settingsModal"); return; }\n\n      const account = event.target.closest("#accountBtn");\n      if (account) {\n        if (cloudUser) {\n          if (confirm("Se déconnecter de ce compte Google ?")) signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });\n        } else {\n          signInWithGoogle();\n        }\n        return;\n      }\n\n      const nav = event.target.closest("[data-screen]");'''
          replace_once(event_marker, event_replacement, 'delegated controls')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: git diff --check
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine 50-30-20 header and settings"
          git push
