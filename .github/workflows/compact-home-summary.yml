name: Compact home summary

on:
  push:
    paths:
      - '.github/workflows/compact-home-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home summary and nav position
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode('').decode())
          PY
      - name: Validate
        run: git diff --check
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compact home financial summary and lower nav"
          git push
