name: Change credit total to monthly payments

on:
  push:
    paths:
      - '.github/workflows/change-credit-total-to-monthly.yml'
      - '.github/scripts/change_credit_total_to_monthly.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile
        run: python .github/scripts/change_credit_total_to_monthly.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show total monthly credit payments"
          git push
