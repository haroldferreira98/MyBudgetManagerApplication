name: Clean up voice feature

on:
  push:
    paths:
      - '.github/workflows/cleanup-voice-feature.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy voice UI and interactions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Remove the legacy voice HUD markup entirely.
          hud_start = text.find('  <div class="voice-hud" id="voiceHud"')
          if hud_start >= 0:
              hud_end_marker = '\n  <div class="sheet-backdrop" id="entityModal"'
              hud_end = text.find(hud_end_marker, hud_start)
              if hud_end < 0:
                  raise SystemExit('Could not locate end of voice HUD markup')
              text = text[:hud_start] + text[hud_end:]

          # Replace long-press voice behaviour on the central + with a normal tap.
          fab_start = text.find('    const fabAdd = document.getElementById("fabAdd");')
          form_listener = '    document.getElementById("entityForm").addEventListener("submit", handleEntitySubmit);'
          fab_end = text.find(form_listener, fab_start)
          if fab_start < 0 or fab_end < 0:
              raise SystemExit('Could not locate FAB interaction block')
          fab_replacement = '''    const fabAdd = document.getElementById("fabAdd");\n    fabAdd?.addEventListener("click", () => openEntityModal("expense"));\n'''
          text = text[:fab_start] + fab_replacement + text[fab_end:]

          # Remove now-unused voice action listeners.
          text = re.sub(r'\n\s*document\.getElementById\("voiceCancelBtn"\).*?;\n', '\n', text, count=1)
          text = re.sub(r'\n\s*document\.getElementById\("voiceValidateBtn"\).*?;\n', '\n', text, count=1)

          # Remove voice-only global runtime state.
          voice_globals = '''    let recognition = null;\n    let voiceSessionActive = false;\n    let voiceFinalTranscript = "";\n    let voiceInterimTranscript = "";\n    let voicePendingParsed = null;\n    let voiceRestartTimer = null;\n    let voiceStartWatchdog = null;\n    let voiceLastReleaseAt = 0;\n    let voiceCycleSerial = 0;\n'''
          text = text.replace(voice_globals, '', 1)

          # Remove base voice HUD styles, keeping the surrounding mobile layout fixes.
          css_start = text.find('    .voice-hud {')
          css_end = text.find('    /* SEARCH-BG-LOWER-PILL-V3 */', css_start)
          if css_start >= 0 and css_end >= 0:
              text = text[:css_start] + text[css_end:]

          # Remove one-line voice cancel CSS if still present.
          text = re.sub(r'\n\s*/\* VOICE-CANCEL-SILENT-V1 \*/\n\s*\.voice-hud-card\{.*?\}\n', '\n', text, count=1)

          # Remove persistent voice composer CSS at the end of the stylesheet.
          persistent_start = text.find('    /* PERSISTENT-VOICE-COMPOSER-V2 */')
          if persistent_start >= 0:
              style_end = text.find('</style>', persistent_start)
              if style_end < 0:
                  raise SystemExit('Could not locate stylesheet end')
              text = text[:persistent_start] + text[style_end:]

          # Remove the inactive speech-recognition engine and parsers. It begins at
          # normalizeVoice and ends immediately before exportJSON.
          voice_js_start = text.find('    function normalizeVoice(')
          if voice_js_start >= 0:
              export_start = text.find('    function exportJSON()', voice_js_start)
              if export_start < 0:
                  raise SystemExit('Could not locate end of voice JavaScript section')
              text = text[:voice_js_start] + text[export_start:]

          text = text.replace('    /* MOBILE-UX-VOICE-V2 */', '    /* MOBILE-UX-V2 */', 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove voice input UI and microphone logic"
          git push
