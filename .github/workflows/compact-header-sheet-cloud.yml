name: Compact header sheet and cloud UX

on:
  push:
    paths:
      - '.github/workflows/compact-header-sheet-cloud.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('      showSnackbar("Données cloud chargées.");\n', '')
          s = s.replace('padding: calc(12px + var(--safe-top)) 18px 12px;', 'padding: calc(8px + var(--safe-top)) 18px 8px;', 1)
          s = s.replace('width: 46px;\n      height: 46px;\n      flex: 0 0 46px;', 'width: 42px;\n      height: 42px;\n      flex: 0 0 42px;', 1)
          s = s.replace('margin: 0 0 2px;', 'margin: 0;', 1)
          s = s.replace('font-size: 12px;\n      font-weight: 600;\n      letter-spacing: .07em;', 'font-size: 11px;\n      font-weight: 600;\n      letter-spacing: .07em;', 1)
          s = s.replace('font-size: clamp(24px, 7vw, 32px);', 'font-size: clamp(23px, 6.7vw, 30px);', 1)
          s = s.replace('min-height: 56px;', 'min-height: 50px;', 1)
          s = s.replace('margin: -10px -16px 14px;\n      padding: 8px 16px 14px;', 'margin: -8px -16px 10px;\n      padding: 4px 16px 10px;', 1)
          s = s.replace('height: min(52dvh, 500px);\n      max-height: min(52dvh, 500px);', 'height: auto;\n      max-height: min(52dvh, 610px);', 1)
          s = s.replace('flex: 1; min-height: 0; padding-top: 2px; padding-bottom: 10px;', 'flex: 0 1 auto; min-height: 0; padding-top: 2px; padding-bottom: 8px;', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Compact home header and expense sheet"
          git push
