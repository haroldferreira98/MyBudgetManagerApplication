name: Update personal and home care categories

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-personal-care-home-care-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/update_personal_care_categories_v1.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-personal-care-home-care-v1' index.html
          grep -q '"Beauté & soins"' index.html
          grep -q '"Entretien maison"' index.html
          grep -q '"Hygiène corporelle"' index.html
          grep -q 'category === "Hygiène" ? "Hygiène corporelle"' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('      "Beauté & soins",') == 1
          assert html.count('      "Entretien maison",') == 1
          assert html.count('      "Hygiène corporelle",') == 1
          assert '        "Beauté & soins": "spa",' in html
          assert '        "Entretien maison": "cleaning_services",' in html
          assert '        "Hygiène corporelle": "soap",' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if scripts:
              Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          if [ -f /tmp/app-inline.js ]; then node --check /tmp/app-inline.js; fi
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-personal-care-home-care-v1.yml
          rm .github/scripts/update_personal_care_categories_v1.py
          git add index.html .github/workflows/run-personal-care-home-care-v1.yml .github/scripts/update_personal_care_categories_v1.py
          git diff --cached --check
          git commit -m "feat: refine personal and home care categories"
          git push origin main
