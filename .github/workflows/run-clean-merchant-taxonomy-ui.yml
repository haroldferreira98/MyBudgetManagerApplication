name: Clean merchant taxonomy UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-clean-merchant-taxonomy-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply UI cleanup
        run: python3 .github/scripts/clean_merchant_taxonomy_ui.py

      - name: Validate app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert '20260918-merchant-clean-hidden-taxonomy-v1' in html
          assert 'data-spending-category-field hidden' in html
          assert 'data-spending-subcategory-field hidden' in html
          block = re.search(r'function merchantSuggestionMarkup\(rule\) \{.*?\n    \}', html, re.S)
          assert block
          suggestion = block.group(0)
          assert 'choix ponctuel' not in suggestion
          assert 'mémorisé' not in suggestion
          assert '<span class="merchant-suggestion-meta">${escapeHtml(classification)}</span>' in suggestion
          helper = re.search(r'const setTaxonomyFieldsVisible = \(\) => \{.*?\n      \};', html, re.S)
          assert helper and 'hidden = true' in helper.group(0)
          assert 'Libellé libre : choisis la catégorie et la sous-catégorie.' not in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          assert scripts
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/clean_merchant_taxonomy_ui.py
          rm .github/workflows/run-clean-merchant-taxonomy-ui.yml
          git add index.html .github/scripts/clean_merchant_taxonomy_ui.py .github/workflows/run-clean-merchant-taxonomy-ui.yml
          git diff --cached --check
          git commit -m "feat: simplify merchant classification UI"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
