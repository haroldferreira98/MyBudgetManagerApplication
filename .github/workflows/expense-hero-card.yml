name: Expense hero card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expense-hero-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match expenses page to fixed charges style
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    function renderExpenses() {
      const container = document.getElementById("screen-expenses");
      const normalizedSearch = expenseSearch.trim().toLowerCase();
      const filtered = [...currentMonthExpenses()]
        .filter(item => expenseFilter === "Toutes" || item.category === expenseFilter)
        .filter(item => !normalizedSearch || `${item.label} ${item.category}`.toLowerCase().includes(normalizedSearch))
        .sort((a,b) => String(b.date).localeCompare(String(a.date)));
'''
          new = '''    function renderExpenses() {
      const container = document.getElementById("screen-expenses");
      const monthItems = [...currentMonthExpenses()];
      const currentTotal = sum(monthItems, x => x.amount);
      const normalizedSearch = expenseSearch.trim().toLowerCase();
      const filtered = monthItems
        .filter(item => expenseFilter === "Toutes" || item.category === expenseFilter)
        .filter(item => !normalizedSearch || `${item.label} ${item.category}`.toLowerCase().includes(normalizedSearch))
        .sort((a,b) => String(b.date).localeCompare(String(a.date)));
'''
          if old not in s:
              raise SystemExit('renderExpenses header not found')
          s = s.replace(old, new, 1)

          old2 = '''      container.innerHTML = `
        ${renderMonthSwitcher()}
        <div class="section">
          <div class="search-shell">
'''
          new2 = '''      container.innerHTML = `
        ${renderMonthSwitcher()}
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Dépenses du mois</div>
            <div class="hero-value money">${formatMoney(currentTotal)}</div>
            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">receipt_long</span>${monthItems.length} dépense${monthItems.length > 1 ? "s" : ""}</span></div>
          </div>
        </div>
        <div class="section">
          <div class="search-shell">
'''
          if old2 not in s:
              raise SystemExit('renderExpenses content anchor not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match expenses summary to fixed charges style'
          git push
      - name: Deploy updated app to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
