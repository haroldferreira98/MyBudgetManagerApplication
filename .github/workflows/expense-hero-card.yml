name: Expense hero card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expense-hero-card.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match expenses page to fixed charges style
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '      const normalizedSearch = expenseSearch.trim().toLowerCase();'
          insert = '      const monthItems = [...currentMonthExpenses()];\n      const currentTotal = sum(monthItems, x => x.amount);\n'
          if 'const monthItems = [...currentMonthExpenses()]' not in s:
              if anchor not in s:
                  raise SystemExit('expense header anchor not found')
              s = s.replace(anchor, insert + anchor, 1)
              s = s.replace('      const filtered = [...currentMonthExpenses()]', '      const filtered = monthItems', 1)
          anchor2 = '        ${renderMonthSwitcher()}\n        <div class="section">\n          <div class="search-shell">'
          hero = '        ${renderMonthSwitcher()}\n        <div class="section">\n          <div class="card hero-card">\n            <div class="hero-label">Dépenses du mois</div>\n            <div class="hero-value money">${formatMoney(currentTotal)}</div>\n            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">receipt_long</span>${monthItems.length} dépense${monthItems.length > 1 ? "s" : ""}</span></div>\n          </div>\n        </div>\n        <div class="section">\n          <div class="search-shell">'
          if '<div class="hero-label">Dépenses du mois</div>' not in s:
              if anchor2 not in s:
                  raise SystemExit('expense content anchor not found')
              s = s.replace(anchor2, hero, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Match expenses summary to fixed charges style'
            git push
          fi
      - name: Deploy updated app to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
