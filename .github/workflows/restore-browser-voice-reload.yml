name: Restore browser voice with reload workaround

on:
  push:
    paths:
      - '.github/workflows/restore-browser-voice-reload.yml'
      - '.github/scripts/restore_voice_reload.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch voice system
        run: python .github/scripts/restore_voice_reload.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore browser voice and reload after validation"
          git push
