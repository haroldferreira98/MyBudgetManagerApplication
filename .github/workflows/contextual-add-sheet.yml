name: Contextual add sheet

on:
  push:
    paths:
      - '.github/workflows/contextual-add-sheet.yml'
      - '.github/scripts/contextual_add.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contextual add sheet
        run: python .github/scripts/contextual_add.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make add sheet context-aware"
          git push
