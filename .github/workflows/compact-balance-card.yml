name: Compact balance card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-balance-card.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact 50 30 20 card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<div class="card">${bucketCards}</div>', '<div class="card balance-card">${bucketCards}</div>', 1)
          marker = '/* BALANCE-CARD-COMPACT-V1 */'
          if marker not in s:
              css = '''\n    /* BALANCE-CARD-COMPACT-V1 */\n    .balance-card { padding-top: 12px; padding-bottom: 12px; }\n    .balance-card .balance-row { margin: 10px 0; }\n    .balance-card .balance-row:first-child { margin-top: 2px; }\n    .balance-card .balance-row:last-child { margin-bottom: 2px; }\n    .balance-card .balance-head { margin-bottom: 6px; }\n'''
              s = s.replace('</style>', css + '  </style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Compact 50 30 20 card spacing'
            git push
          fi
      - name: Deploy updated app to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
