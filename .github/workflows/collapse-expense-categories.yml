name: Collapse expense category summaries
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collapse-expense-categories.yml
permissions:
  contents: write
jobs:
  patch_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch expense category UI
        env:
          PATCH_SCRIPT_B64: 
        run: |
          echo "$PATCH_SCRIPT_B64" | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Collapse expense categories with summaries"
          git push origin main
      - name: Deploy app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}
          channelId: live
          projectId: mybudgetmanagerapplication
