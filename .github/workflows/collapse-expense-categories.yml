name: Collapse expense category summaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collapse-expense-categories.yml'

permissions:
  contents: write

jobs:
  patch_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make expense category groups collapsible
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''    .expense-category-group { display: grid; gap: 7px; }
    .expense-category-group + .expense-category-group { margin-top: 18px; }
    .expense-category-label {
      margin: 0 4px 1px;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }
'''
          new_css = '''    .expense-category-group {
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      border-radius: var(--radius-small);
      background: var(--surface-container-low);
      overflow: hidden;
    }
    .expense-category-group + .expense-category-group { margin-top: 12px; }
    .expense-category-summary {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .expense-category-summary::-webkit-details-marker { display: none; }
    .expense-category-summary:active { opacity: .82; }
    .expense-category-label {
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .expense-category-meta {
      margin-top: 2px;
      color: var(--on-surface-variant);
      font-size: 11px;
    }
    .expense-category-total {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      text-align: right;
    }
    .expense-category-chevron {
      font-size: 22px;
      color: var(--on-surface-variant);
      transition: transform .18s ease;
    }
    .expense-category-group[open] .expense-category-chevron { transform: rotate(180deg); }
    .expense-category-items {
      display: grid;
      gap: 7px;
      padding: 0 8px 8px;
    }
'''

          old_state = '''    let expenseSort = "category";
    let globalSearch = "";'''
          new_state = '''    let expenseSort = "category";
    const expandedExpenseCategories = new Set();
    let globalSearch = "";'''

          old_groups = '''        listHtml = [...groups.entries()].map(([category, items]) => `
          <div class="expense-category-group">
            <div class="expense-category-label">${escapeHtml(category)}</div>
            ${items.map(renderExpenseRow).join("")}
          </div>`).join("");'''
          new_groups = '''        listHtml = [...groups.entries()].map(([category, items]) => `
          <details class="expense-category-group" data-expense-category="${escapeHtml(category)}" ${expandedExpenseCategories.has(category) ? "open" : ""}>
            <summary class="expense-category-summary">
              <div>
                <div class="expense-category-label">${escapeHtml(category)}</div>
                <div class="expense-category-meta">${items.length} opération${items.length > 1 ? "s" : ""}</div>
              </div>
              <div class="expense-category-total money negative">−${formatMoney(sum(items, x => x.amount))}</div>
              <span class="material-symbols-outlined expense-category-chevron">expand_more</span>
            </summary>
            <div class="expense-category-items">${items.map(renderExpenseRow).join("")}</div>
          </details>`).join("");'''

          old_listener = '''      if (input) {
        input.addEventListener("input", e => {
          expenseSearch = e.target.value;
          renderExpenses();
          requestAnimationFrame(() => {
            const next = document.getElementById("expenseSearch");
            if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
          });
        });
      }
    }
'''
          new_listener = '''      if (input) {
        input.addEventListener("input", e => {
          expenseSearch = e.target.value;
          renderExpenses();
          requestAnimationFrame(() => {
            const next = document.getElementById("expenseSearch");
            if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
          });
        });
      }

      container.querySelectorAll("details[data-expense-category]").forEach(group => {
        group.addEventListener("toggle", () => {
          const category = group.dataset.expenseCategory;
          if (!category) return;
          if (group.open) expandedExpenseCategories.add(category);
          else expandedExpenseCategories.delete(category);
        });
      });
    }
'''

          replacements = [
            (old_css, new_css),
            (old_state, new_state),
            (old_groups, new_groups),
            (old_listener, new_listener),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit('Expected block not found: ' + old[:120].replace('\n', ' | '))
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Collapse expense categories with summaries"
          git push origin main

      - name: Deploy patched app to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
