name: Diagnose live hosting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare known live URLs
        run: |
          set +e
          for base in \
            'https://mybudgetmanagerapplication.web.app/' \
            'https://mybudgetmanagerapplication.firebaseapp.com/' \
            'https://haroldferreira98.github.io/MyBudgetManagerApplication/' \
            'https://my-budget-manager-application.vercel.app/'
          do
            echo "=== $base ==="
            file=$(echo "$base" | sed 's#https://##; s#[/:]#_#g').html
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -o "$file" -w '%{http_code} %{url_effective}' "${base}?diag=$(date +%s)")
            echo "HTTP $code"
            if [ -s "$file" ]; then
              echo 'APP BUILD:'
              grep -o 'meta name="app-build" content="[^"]*"' "$file" | head -1 || true
              echo 'TOP SETTINGS:'
              grep -o 'id="settingsBtn"' "$file" | wc -l
              echo 'BOTTOM SETTINGS:'
              grep -o 'data-screen="settings"' "$file" | wc -l
              echo 'FIXED NAV:'
              grep -o 'data-screen="fixed"' "$file" | wc -l
              echo 'ACCOUNT PROFILE MARKER:'
              grep -o 'account-profile-content' "$file" | wc -l
              echo 'SHA256:'
              sha256sum "$file"
            fi
          done
