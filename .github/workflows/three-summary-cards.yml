name: Add three home summary cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/three-summary-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch home summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 8px;\n      margin-top: 14px;\n      padding-top: 12px;\n      border-top: 1px solid color-mix(in srgb, var(--on-primary-container) 14%, transparent);', '      grid-template-columns: repeat(3, minmax(0, 1fr));\n      gap: 6px;\n      margin-top: 14px;\n      padding-top: 12px;\n      border-top: 1px solid color-mix(in srgb, var(--on-primary-container) 14%, transparent);', 1)
          s = s.replace('      padding: 10px 12px;\n      border-radius: 16px;\n      background: color-mix(in srgb, var(--surface-container-lowest) 58%, transparent);', '      padding: 10px 8px;\n      border-radius: 16px;\n      background: color-mix(in srgb, var(--surface-container-lowest) 58%, transparent);\n      overflow: visible;', 1)
          s = s.replace('    .summary-mini-label { color: var(--on-surface-variant); font-size: 11px; font-weight: 600; }', '    .summary-mini-label { display:block; color:var(--on-surface-variant); font-size:clamp(9px,2.8vw,11px); font-weight:600; white-space:nowrap; letter-spacing:-.01em; }', 1)
          s = s.replace('    .summary-mini-value { display: block; margin-top: 3px; color: var(--on-primary-container); font-size: 19px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }', '    .summary-mini-value { display:block; margin-top:3px; color:var(--on-primary-container); font-size:clamp(13px,4vw,19px); font-weight:700; line-height:1.15; letter-spacing:-.035em; white-space:nowrap; }', 1)
          s = s.replace('    .summary-mini-note { margin-top: 2px; color: var(--on-surface-variant); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }', '    .summary-mini-note { margin-top:3px; color:var(--on-surface-variant); font-size:clamp(8px,2.35vw,10px); line-height:1.1; white-space:nowrap; letter-spacing:-.01em; }', 1)
          old = '              <div class="summary-mini">\n                <span class="summary-mini-label">Dépenses</span>\n                <strong class="summary-mini-value money">${formatMoney(s.engaged)}</strong>\n                <div class="summary-mini-note">Total du mois</div>\n              </div>\n            </div>'
          new = '              <div class="summary-mini">\n                <span class="summary-mini-label">Dépenses</span>\n                <strong class="summary-mini-value money">${formatMoney(s.engaged)}</strong>\n                <div class="summary-mini-note">Total du mois</div>\n              </div>\n              <div class="summary-mini">\n                <span class="summary-mini-label">Charges fixes</span>\n                <strong class="summary-mini-value money">${formatMoney(s.fixed + s.credits)}</strong>\n                <div class="summary-mini-note">Ce mois</div>\n              </div>\n            </div>'
          if old not in s:
              raise SystemExit('summary html block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/three-summary-cards.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show revenue expenses and fixed charges summary"
          git push origin main