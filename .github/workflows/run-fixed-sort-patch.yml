name: Run fixed charge sort patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-fixed-sort-patch.yml'

permissions:
  contents: write

jobs:
  patch_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          B64=$(python3 -c "import re; t=open('.github/workflows/add-fixed-charge-sort.yml', encoding='utf-8').read(); print(re.search(r\"echo '([^']+)'\", t).group(1))")
          echo "$B64" | base64 --decode | sed 's/closess/closest/g' | python3

      - name: Commit app change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add sorting to fixed charges"
          git push origin main

      - name: Deploy app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
