name: Refine cloud account and search

on:
  push:
    paths:
      - '.github/workflows/refine-cloud-account-search.yml'

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected block: {label}')
              text = text.replace(old, new, 1)

          # Add lightweight styles for account modal and global search results.
          css_marker = '''    .top-account-btn:active { transform: scale(.94); }\n    .top-account-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }\n    .account-letter { font-size: 21px; font-weight: 700; font-family: Arial, sans-serif; }\n'''
          css_add = '''    .top-account-btn:active { transform: scale(.94); }\n    .top-account-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }\n    .account-letter { font-size: 21px; font-weight: 700; font-family: Arial, sans-serif; }\n    .account-modal-profile { display:flex; align-items:center; gap:14px; padding:8px 2px 18px; }\n    .account-modal-avatar { width:58px; height:58px; flex:0 0 58px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--primary-container); color:var(--on-primary-container); font-size:24px; font-weight:700; }\n    .account-modal-avatar img { width:100%; height:100%; object-fit:cover; display:block; }\n    .account-modal-name { font-weight:700; font-size:17px; }\n    .account-modal-email { margin-top:3px; color:var(--on-surface-variant); font-size:13px; overflow-wrap:anywhere; }\n    .cloud-status { display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:18px; background:var(--surface-container); color:var(--on-surface-variant); font-size:13px; margin-bottom:14px; }\n    .home-search-wrap { margin: 2px 0 18px; }\n    .home-search-results { display:grid; gap:10px; margin-top:10px; }\n    .search-result-type { font-size:11px; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }\n'''
          replace_once(css_marker, css_add, 'account/search css')

          # Add a custom account modal next to settings.
          html_marker = '''  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden>\n'''
          account_modal = '''  <div class="sheet-backdrop" id="accountModal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">\n    <div class="sheet">\n      <div class="sheet-handle"></div>\n      <div class="sheet-head">\n        <h2 class="sheet-title" id="accountModalTitle">Compte Google</h2>\n        <button class="icon-btn" data-close-modal="accountModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>\n      </div>\n      <div class="sheet-body" id="accountModalBody"></div>\n    </div>\n  </div>\n\n  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden>\n'''
          replace_once(html_marker, account_modal, 'account modal')

          # Keep the user's search query while Home rerenders.
          replace_once('''    let expenseFilter = "Toutes";\n    let expenseSearch = "";\n''', '''    let expenseFilter = "Toutes";\n    let expenseSearch = "";\n    let globalSearch = "";\n''', 'global search state')

          # Cloud is authoritative whenever it already has data: no native conflict prompt.
          old_reconcile = '''      const remote = migrateState(snap.data().state);\n      const localHasData = hasMeaningfulData(state);\n      const remoteHasData = hasMeaningfulData(remote);\n      const differs = JSON.stringify(state) !== JSON.stringify(remote);\n\n      if (localHasData && remoteHasData && differs) {\n        const loadCloud = confirm("Des données différentes existent déjà dans votre compte Google. OK pour charger la version cloud, Annuler pour conserver cet appareil et remplacer la version cloud.");\n        if (!loadCloud) {\n          await writeCloudState();\n          showSnackbar("Les données de cet appareil ont été envoyées dans le cloud.");\n          return;\n        }\n      }\n\n      applyingCloudState = true;\n      state = remote;\n'''
          new_reconcile = '''      const remote = migrateState(snap.data().state);\n\n      // Dès qu'une sauvegarde Firebase existe, elle devient la source de vérité.\n      // Aucun dialogue de conflit : les données cloud sont chargées automatiquement.\n      applyingCloudState = true;\n      state = remote;\n'''
          replace_once(old_reconcile, new_reconcile, 'silent cloud reconciliation')

          # Account modal renderer, entirely styled by the app.
          marker = '''    function updateSettingsUI() {\n      document.querySelectorAll('#settingsModal [data-theme-choice]').forEach(btn => {\n        btn.classList.toggle("active", btn.dataset.themeChoice === (state.settings.theme || "auto"));\n      });\n    }\n\n'''
          account_fn = '''    function updateSettingsUI() {\n      document.querySelectorAll('#settingsModal [data-theme-choice]').forEach(btn => {\n        btn.classList.toggle("active", btn.dataset.themeChoice === (state.settings.theme || "auto"));\n      });\n    }\n\n    function renderAccountModal() {\n      const body = document.getElementById("accountModalBody");\n      if (!body) return;\n      if (cloudUser) {\n        const photo = cloudUser.photoURL ? `<img src="${escapeHtml(cloudUser.photoURL)}" alt="">` : `<span class="material-symbols-outlined">person</span>`;\n        const name = escapeHtml(cloudUser.displayName || "Compte Google");\n        const email = escapeHtml(cloudUser.email || "");\n        body.innerHTML = `\n          <div class="account-modal-profile">\n            <div class="account-modal-avatar">${photo}</div>\n            <div><div class="account-modal-name">${name}</div><div class="account-modal-email">${email}</div></div>\n          </div>\n          <div class="cloud-status"><span class="material-symbols-outlined">cloud_done</span><span>Synchronisation Firebase active. Les données du cloud sont chargées automatiquement.</span></div>\n          <button class="btn outlined full" id="accountSignOutBtn"><span class="material-symbols-outlined">logout</span>Se déconnecter</button>`;\n      } else {\n        body.innerHTML = `\n          <div class="account-modal-profile">\n            <div class="account-modal-avatar"><span class="account-letter">G</span></div>\n            <div><div class="account-modal-name">Compte Google</div><div class="account-modal-email">Connecte-toi pour retrouver automatiquement tes données Firebase.</div></div>\n          </div>\n          <button class="btn primary full" id="accountSignInBtn"><span class="material-symbols-outlined">login</span>Se connecter avec Google</button>`;\n      }\n    }\n\n'''
          replace_once(marker, account_fn, 'account modal renderer')

          # 20% now represents money still available after all current commitments, not project allocations.
          replace_once('''        buckets: {\n          needs: fixed,\n          wants: expenses,\n          savings: projects\n        }\n''', '''        buckets: {\n          needs: fixed,\n          wants: expenses,\n          savings: Math.max(0, remaining)\n        }\n''', 'savings bucket')

          replace_once('''        { key: "savings", label: "Épargne", target: 20, value: s.buckets.savings }\n''', '''        { key: "savings", label: "Épargne / investissement disponible", target: 20, value: s.buckets.savings }\n''', 'savings label')

          # Global search helpers: categories, labels, amounts, dates and operation types.
          home_marker = '''    function renderHome() {\n'''
          search_helpers = '''    function normalizeSearch(value) {\n      return String(value ?? "")\n        .normalize("NFD")\n        .replace(/[\\u0300-\\u036f]/g, "")\n        .toLowerCase()\n        .trim();\n    }\n\n    function globalSearchResults(query) {\n      const q = normalizeSearch(query);\n      if (!q) return [];\n      const amountTokens = value => {\n        const n = safeNumber(value);\n        return [String(n), n.toFixed(2), String(n).replace(".", ","), n.toFixed(2).replace(".", ","), formatMoney(n)];\n      };\n      const rows = [];\n      state.expenses.forEach(item => rows.push({\n        type: "expense", id: item.id, icon: categoryIcon(item.category), kind: "Dépense", title: item.label,\n        subtitle: `${item.category} · ${formatDate(item.date)}`, amount: -safeNumber(item.amount),\n        haystack: [item.label, item.category, item.date, "dépense", "depense", ...amountTokens(item.amount)].join(" ")\n      }));\n      state.incomes.forEach(item => rows.push({\n        type: "income", id: item.id, icon: "payments", kind: "Revenu", title: item.label,\n        subtitle: formatDate(item.date), amount: safeNumber(item.amount),\n        haystack: [item.label, item.date, "revenu", ...amountTokens(item.amount)].join(" ")\n      }));\n      state.fixedCharges.forEach(item => rows.push({\n        type: "fixed", id: item.id, icon: "event_repeat", kind: "Charge fixe", title: item.label,\n        subtitle: `Jour ${safeNumber(item.day, 1)}`, amount: -safeNumber(item.amount),\n        haystack: [item.label, "charge fixe", "charges fixes", item.day, ...amountTokens(item.amount)].join(" ")\n      }));\n      state.credits.forEach(item => rows.push({\n        type: "credit", id: item.id, icon: "credit_card", kind: "Crédit", title: item.name,\n        subtitle: `Mensualité ${formatMoney(item.monthlyPayment)}`, amount: -safeNumber(item.monthlyPayment),\n        haystack: [item.name, "crédit", "credit", "mensualité", "mensualite", ...amountTokens(item.monthlyPayment)].join(" ")\n      }));\n      return rows.filter(row => normalizeSearch(row.haystack).includes(q)).slice(0, 50);\n    }\n\n    function renderGlobalSearchResults(query) {\n      const results = globalSearchResults(query);\n      if (!normalizeSearch(query)) return "";\n      if (!results.length) return `<div class="empty-state" style="margin-top:10px"><span class="material-symbols-outlined">search_off</span><strong>Aucun résultat</strong><span>Essaie un libellé, une catégorie ou un montant.</span></div>`;\n      return `<div class="home-search-results">${results.map(row => `\n        <button class="list-item" data-edit-type="${row.type}" data-edit-id="${row.id}" style="width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer">\n          <div class="list-icon"><span class="material-symbols-outlined">${row.icon}</span></div>\n          <div class="list-main"><div class="search-result-type">${row.kind}</div><div class="list-title">${escapeHtml(row.title)}</div><div class="list-sub">${escapeHtml(row.subtitle)}</div></div>\n          <div class="list-side"><div class="list-amount money ${row.amount < 0 ? "negative" : "positive"}">${row.amount < 0 ? "−" : "+"}${formatMoney(Math.abs(row.amount))}</div></div>\n        </button>`).join("")}</div>`;\n    }\n\n'''
          replace_once(home_marker, search_helpers + home_marker, 'global search helpers')

          # Search bar is the first item under the page header on Home.
          old_home_start = '''      container.innerHTML = `\n        <div class="section">\n          <div class="card hero-card">\n'''
          new_home_start = '''      container.innerHTML = `\n        <div class="home-search-wrap">\n          <div class="search-shell">\n            <span class="material-symbols-outlined">search</span>\n            <input id="globalSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="Rechercher catégorie, opération, montant…" value="${escapeHtml(globalSearch)}">\n            <button class="icon-btn ${globalSearch ? "" : "hidden"}" id="globalSearchClear" type="button" aria-label="Effacer la recherche"><span class="material-symbols-outlined">close</span></button>\n          </div>\n          ${renderGlobalSearchResults(globalSearch)}\n        </div>\n\n        <div class="section">\n          <div class="card hero-card">\n'''
          replace_once(old_home_start, new_home_start, 'home search bar')

          # Bind the search input after rendering Home.
          home_end = '''          <div class="list">${chargesHtml}</div>\n        </div>`;\n    }\n\n    function renderIncome() {\n'''
          home_end_new = '''          <div class="list">${chargesHtml}</div>\n        </div>`;\n\n      const searchInput = document.getElementById("globalSearchInput");\n      if (searchInput) {\n        searchInput.addEventListener("input", event => {\n          globalSearch = event.target.value;\n          renderHome();\n          applyPrivacy();\n          requestAnimationFrame(() => {\n            const next = document.getElementById("globalSearchInput");\n            if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }\n          });\n        });\n      }\n      document.getElementById("globalSearchClear")?.addEventListener("click", () => { globalSearch = ""; renderHome(); applyPrivacy(); });\n    }\n\n    function renderIncome() {\n'''
          replace_once(home_end, home_end_new, 'home search binding')

          # Opening account control uses custom app modal, never native confirm.
          old_account_click = '''      const account = event.target.closest("#accountBtn");\n      if (account) {\n        if (cloudUser) {\n          if (confirm("Se déconnecter de ce compte Google ?")) signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });\n        } else {\n          signInWithGoogle();\n        }\n        return;\n      }\n'''
          new_account_click = '''      const account = event.target.closest("#accountBtn");\n      if (account) { renderAccountModal(); openModal("accountModal"); return; }\n\n      const accountSignIn = event.target.closest("#accountSignInBtn");\n      if (accountSignIn) {\n        closeModal("accountModal");\n        signInWithGoogle();\n        return;\n      }\n\n      const accountSignOut = event.target.closest("#accountSignOutBtn");\n      if (accountSignOut) {\n        closeModal("accountModal");\n        signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });\n        return;\n      }\n'''
          replace_once(old_account_click, new_account_click, 'custom account click')

          # Keep modal content in sync with auth changes.
          replace_once('''          renderProfile();\n          updateTopAccountButton();\n          if (cloudUser) await reconcileCloudState();\n''', '''          renderProfile();\n          updateTopAccountButton();\n          renderAccountModal();\n          if (cloudUser) await reconcileCloudState();\n''', 'auth state modal sync')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: git diff --check

      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Firebase sync account modal and global search"
          git push
