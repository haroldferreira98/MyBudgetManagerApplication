name: Replace operation filter with quick tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-operation-filter-tabs-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/operation_filter_tabs_v1.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260918-operation-filter-tabs-v1' index.html
          grep -q 'OPERATION-FILTER-TABS-V1' index.html
          grep -q 'class="operation-filter-tabs"' index.html
          grep -q 'class="operation-filter-tab' index.html
          if grep -q 'data-operation-filter-toggle' index.html; then
            echo 'Old filter toggle is still present' >&2
            exit 1
          fi
          if grep -q 'data-operation-filter-menu' index.html; then
            echo 'Old filter menu is still present' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('OPERATION-FILTER-TABS-V1') == 1
          assert html.count('class="operation-filter-tabs"') == 1
          assert 'data-operation-type="${value}" role="tab"' in html
          assert 'data-operation-add-toggle' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/operation_filter_tabs_v1.py
          rm .github/workflows/run-operation-filter-tabs-v1.yml
          git add index.html .github/scripts/operation_filter_tabs_v1.py .github/workflows/run-operation-filter-tabs-v1.yml
          git diff --cached --check
          git commit -m "feat: replace operation filter with quick tabs"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
