name: Local Whisper voice input

on:
  push:
    paths:
      - '.github/workflows/local-whisper-voice.yml'
      - '.github/scripts/local_whisper_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch local Whisper voice input
        run: python .github/scripts/local_whisper_patch.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use local Whisper for reliable voice expenses"
          git push
