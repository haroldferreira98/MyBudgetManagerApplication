name: Hard voice reload

on:
  push:
    paths:
      - '.github/workflows/hard-voice-reload.yml'
      - '.github/scripts/hard_voice_reload.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hard reload
        run: python .github/scripts/hard_voice_reload.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Force fresh page context after voice validation"
          git push
