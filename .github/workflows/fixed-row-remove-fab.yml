name: Fixed charge row and remove FAB

on:
  push:
    paths:
      - '.github/workflows/fixed-row-remove-fab.yml'
      - '.github/scripts/fixed_row_remove_fab.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python .github/scripts/fixed_row_remove_fab.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place fixed charge fields side by side and remove nav add button"
          git push
