name: Disable pinch zoom

on:
  push:
    paths:
      - '.github/workflows/disable-pinch-zoom.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Disable pinch zoom in index.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_viewport = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />'
          new_viewport = '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />'

          if old_viewport in text:
              text = text.replace(old_viewport, new_viewport, 1)
          elif new_viewport not in text:
              raise SystemExit("Viewport meta tag not found in expected form")

          marker = '    "use strict";\n'
          anti_zoom_block = (
              '\n\n'
              '    // Désactive le zoom par pincement sur mobile sans bloquer le défilement à un doigt.\n'
              '    const preventZoomGesture = event => event.preventDefault();\n'
              '    ["gesturestart", "gesturechange", "gestureend"].forEach(type => {\n'
              '      document.addEventListener(type, preventZoomGesture, { passive: false });\n'
              '    });\n'
              '    document.addEventListener("touchmove", event => {\n'
              '      if (event.touches.length > 1) event.preventDefault();\n'
              '    }, { passive: false });\n'
          )

          if "const preventZoomGesture" not in text:
              if marker not in text:
                  raise SystemExit("Script marker not found")
              text = text.replace(marker, marker + anti_zoom_block, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Disable pinch zoom on mobile"
          git push
