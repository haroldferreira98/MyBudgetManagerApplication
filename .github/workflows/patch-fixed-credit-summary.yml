name: Patch fixed charges credit summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fixed-credit-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Include credits in fixed charges summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_totals = '''      const charges = [...activeFixedCharges()].sort((a,b) => safeNumber(a.day, 1) - safeNumber(b.day, 1));
      const total = sum(charges, x => x.amount);'''
          new_totals = '''      const charges = [...activeFixedCharges()].sort((a,b) => safeNumber(a.day, 1) - safeNumber(b.day, 1));
      const credits = activeCredits();
      const creditTotal = sum(credits, x => x.monthlyPayment);
      const total = sum(charges, x => x.amount) + creditTotal;'''

          old_meta = '''            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">event_repeat</span>${charges.length} prélèvement${charges.length > 1 ? "s" : ""}</span></div>'''
          new_meta = '''            <div class="hero-meta">
              <span class="daily-pill"><span class="material-symbols-outlined">event_repeat</span>${charges.length} prélèvement${charges.length > 1 ? "s" : ""}</span>
              <span class="daily-pill"><span class="material-symbols-outlined">credit_card</span>${credits.length} crédit${credits.length === 1 ? "" : "s"}</span>
            </div>'''

          if old_totals not in text:
              raise SystemExit('Expected fixed charges totals block not found')
          if old_meta not in text:
              raise SystemExit('Expected fixed charges hero meta block not found')

          text = text.replace(old_totals, new_totals, 1)
          text = text.replace(old_meta, new_meta, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include credit payments in fixed charges summary"
          git push origin main
