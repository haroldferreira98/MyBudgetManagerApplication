name: Patch fixed charges credit summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-fixed-credit-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Include credits in fixed charges summary
        shell: bash
        run: echo '' | base64 -d | python

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include credit payments in fixed charges summary"
          git push origin main
