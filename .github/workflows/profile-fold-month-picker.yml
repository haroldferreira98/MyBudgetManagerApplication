name: Profile fold and month picker

on:
  push:
    paths:
      - '.github/workflows/profile-fold-month-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile cards and month picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected block: {label}')
              s = s.replace(old, new, 1)

          once('''    let applyingCloudState = false;\n    let selectedMonth = monthKey();''', '''    let applyingCloudState = false;\n    let selectedMonth = monthKey();\n    let monthPickerYear = Number(selectedMonth.slice(0, 4));\n    const expandedProfileItems = new Set();''', 'globals')

          once('''          <button class="month-current" type="button" data-month-today aria-label="Revenir au mois actuel"><span class="material-symbols-outlined">calendar_month</span><span>${escapeHtml(selectedMonthLabel())}</span></button>''', '''          <button class="month-current" type="button" data-month-picker aria-label="Choisir un mois"><span class="material-symbols-outlined">calendar_month</span><span>${escapeHtml(selectedMonthLabel())}</span></button>''', 'month trigger')

          month_helpers = '''\n    function openMonthPicker() {\n      const [year] = selectedMonth.split("-").map(Number);\n      monthPickerYear = year || new Date().getFullYear();\n      let modal = document.getElementById("monthPickerModal");\n      if (!modal) {\n        document.body.insertAdjacentHTML("beforeend", `\n          <div class="sheet-backdrop" id="monthPickerModal" role="dialog" aria-modal="true" aria-labelledby="monthPickerTitle">\n            <div class="sheet month-picker-sheet">\n              <div class="sheet-handle"></div>\n              <div class="sheet-head">\n                <h2 class="sheet-title" id="monthPickerTitle">Choisir un mois</h2>\n                <button class="icon-btn" data-close-modal="monthPickerModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>\n              </div>\n              <div class="sheet-body" id="monthPickerBody"></div>\n            </div>\n          </div>`);\n        modal = document.getElementById("monthPickerModal");\n      }\n      renderMonthPicker();\n      modal.classList.add("open");\n    }\n\n    function renderMonthPicker() {\n      const body = document.getElementById("monthPickerBody");\n      if (!body) return;\n      const currentMonthIndex = Number(selectedMonth.slice(5, 7)) - 1;\n      const selectedYear = Number(selectedMonth.slice(0, 4));\n      const labels = Array.from({ length: 12 }, (_, index) => new Intl.DateTimeFormat("fr-FR", { month: "long" }).format(new Date(2026, index, 1)));\n      body.innerHTML = `\n        <div class="month-picker-year-row">\n          <button class="month-picker-year-btn" data-picker-year="-1" aria-label="Année précédente"><span class="material-symbols-outlined">chevron_left</span></button>\n          <strong>${monthPickerYear}</strong>\n          <button class="month-picker-year-btn" data-picker-year="1" aria-label="Année suivante"><span class="material-symbols-outlined">chevron_right</span></button>\n        </div>\n        <div class="month-picker-grid">\n          ${labels.map((label, index) => {\n            const active = monthPickerYear === selectedYear && index === currentMonthIndex;\n            return `<button class="month-picker-option ${active ? "active" : ""}" data-picker-month="${index}">${escapeHtml(label)}</button>`;\n          }).join("")}\n        </div>`;\n    }\n'''
          once('''    function formatMoney(value) {''', month_helpers + '\n    function formatMoney(value) {', 'month helpers')

          credit_block = '''      const creditsHtml = state.credits.length ? state.credits.map(credit => {\n        const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);\n        const progress = creditProgress(credit);\n        const durationText = progress.durationMonths > 0 ? `${progress.monthsPaid}/${progress.durationMonths} mensualités remboursées` : "Durée à compléter";\n        const foldKey = `credit:${credit.id}`;\n        const collapsed = state.credits.length > 1 && !expandedProfileItems.has(foldKey);\n        return `\n          <div class="card profile-fold ${collapsed ? "collapsed" : ""}">\n            <div class="section-header" style="margin:0 0 8px">\n              <div class="profile-fold-heading"><h3 class="section-title" style="font-size:16px">${escapeHtml(credit.name)}</h3><p class="section-subtitle">${rate.toFixed(2)}% · ${durationText}</p></div>\n              <div class="profile-fold-actions">\n                <button class="mini-btn" data-edit-type="credit" data-edit-id="${credit.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>\n                ${state.credits.length > 1 ? `<button class="mini-btn" data-toggle-profile-fold="${foldKey}" aria-label="${collapsed ? "Déplier" : "Replier"}"><span class="material-symbols-outlined">${collapsed ? "expand_more" : "expand_less"}</span></button>` : ""}\n              </div>\n            </div>\n            <div class="profile-fold-summary grid-2">\n              <div><div class="tiny">Capital restant estimé</div><strong class="money">${formatMoney(progress.calculatedBalance)}</strong></div>\n              <div><div class="tiny">Mensualités restantes</div><strong>${progress.remainingPayments ?? "—"}</strong></div>\n            </div>\n            <div class="profile-fold-detail">\n              <div class="tiny" style="margin-top:10px">Mensualité : <span class="money">${formatMoney(credit.monthlyPayment)}</span> · Capital initial : <span class="money">${formatMoney(credit.principal)}</span></div>\n              <div class="spacer-12"></div>\n              <button class="btn outlined full" data-sim-credit="${credit.id}"><span class="material-symbols-outlined">calculate</span>Simuler un remboursement anticipé</button>\n            </div>\n          </div>`;\n      }).join("") : emptyState("credit_card", "Aucun crédit", "Ajoute un crédit pour suivre sa mensualité et simuler un surplus de remboursement.");'''

          s, n = re.subn(r'      const creditsHtml = state\.credits\.length \? state\.credits\.map\(credit => \{.*?\n      \}\)\.join\(""\) : emptyState\("credit_card", "Aucun crédit", "Ajoute un crédit pour suivre sa mensualité et simuler un surplus de remboursement\."\);', credit_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace credits block')

          project_block = '''      const projectsHtml = state.projects.length ? state.projects.map(project => {\n        const target = safeNumber(project.target);\n        const current = safeNumber(project.current);\n        const pct = target > 0 ? (current / target) * 100 : 0;\n        const foldKey = `project:${project.id}`;\n        const collapsed = state.projects.length > 1 && !expandedProfileItems.has(foldKey);\n        return `\n          <div class="card profile-fold ${collapsed ? "collapsed" : ""}">\n            <div class="section-header" style="margin:0 0 10px">\n              <div class="profile-fold-heading"><h3 class="section-title" style="font-size:16px">${escapeHtml(project.name)}</h3><p class="section-subtitle">Allocation <span class="money">${formatMoney(project.monthlyAllocation)}</span>/mois</p></div>\n              <div class="profile-fold-actions">\n                <button class="mini-btn" data-edit-type="project" data-edit-id="${project.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>\n                ${state.projects.length > 1 ? `<button class="mini-btn" data-toggle-profile-fold="${foldKey}" aria-label="${collapsed ? "Déplier" : "Replier"}"><span class="material-symbols-outlined">${collapsed ? "expand_more" : "expand_less"}</span></button>` : ""}\n              </div>\n            </div>\n            <div class="profile-fold-summary project-fold-summary">\n              <span><strong class="money">${formatMoney(current)}</strong> / <span class="money">${formatMoney(target)}</span></span>\n              <span>${target > 0 ? `${pct.toFixed(0)}%` : "Objectif à définir"}</span>\n            </div>\n            <div class="profile-fold-detail">\n              <div class="progress-track"><div class="progress-fill success" style="width:${clamp(pct,0,100)}%"></div></div>\n              <div class="tiny" style="margin-top:7px">${target > 0 ? `${pct.toFixed(0)}% de l'objectif` : "Objectif à définir"}</div>\n            </div>\n          </div>`;\n      }).join("") : emptyState("savings", "Aucun projet d'épargne", "Ajoute un objectif. Son allocation mensuelle sera automatiquement déduite du reste à vivre.");'''

          s, n = re.subn(r'      const projectsHtml = state\.projects\.length \? state\.projects\.map\(project => \{.*?\n      \}\)\.join\(""\) : emptyState\("savings", "Aucun projet d\'épargne", "Ajoute un objectif\. Son allocation mensuelle sera automatiquement déduite du reste à vivre\."\);', project_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not replace projects block')

          old_click = '''      const monthShift = event.target.closest("[data-month-shift]");\n      if (monthShift) { shiftSelectedMonth(safeNumber(monthShift.dataset.monthShift)); return; }\n\n      const monthToday = event.target.closest("[data-month-today]");\n      if (monthToday) { selectedMonth = monthKey(); renderAll(); return; }'''
          new_click = '''      const monthShift = event.target.closest("[data-month-shift]");\n      if (monthShift) { shiftSelectedMonth(safeNumber(monthShift.dataset.monthShift)); return; }\n\n      const monthPicker = event.target.closest("[data-month-picker]");\n      if (monthPicker) { openMonthPicker(); return; }\n\n      const pickerYear = event.target.closest("[data-picker-year]");\n      if (pickerYear) { monthPickerYear += safeNumber(pickerYear.dataset.pickerYear); renderMonthPicker(); return; }\n\n      const pickerMonth = event.target.closest("[data-picker-month]");\n      if (pickerMonth) {\n        selectedMonth = `${monthPickerYear}-${String(safeNumber(pickerMonth.dataset.pickerMonth) + 1).padStart(2, "0")}`;\n        closeModal("monthPickerModal");\n        renderAll();\n        return;\n      }\n\n      const foldToggle = event.target.closest("[data-toggle-profile-fold]");\n      if (foldToggle) {\n        const key = foldToggle.dataset.toggleProfileFold;\n        if (expandedProfileItems.has(key)) expandedProfileItems.delete(key);\n        else expandedProfileItems.add(key);\n        renderProfile();\n        return;\n      }'''
          once(old_click, new_click, 'month/fold click handler')

          css = '''\n\n    /* PROFILE-FOLD-MONTH-PICKER-V1 */\n    .profile-fold { overflow: hidden; }\n    .profile-fold .section-header { align-items: flex-start; gap: 8px; }\n    .profile-fold-heading { min-width: 0; flex: 1; }\n    .profile-fold .section-title,\n    .profile-fold .section-subtitle {\n      white-space: normal !important;\n      overflow: visible !important;\n      text-overflow: clip !important;\n      overflow-wrap: anywhere;\n    }\n    .profile-fold .section-subtitle { line-height: 1.35; }\n    .profile-fold-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }\n    .profile-fold-summary { margin-top: 6px; }\n    .profile-fold .profile-fold-summary.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 12px; }\n    .profile-fold-summary > * { min-width: 0; }\n    .profile-fold-summary strong { overflow-wrap: anywhere; }\n    .project-fold-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--on-surface-variant); font-size: 13px; }\n    .project-fold-summary strong { color: var(--on-surface); }\n    .profile-fold-detail { margin-top: 10px; }\n    .profile-fold.collapsed .profile-fold-detail { display: none; }\n    .profile-fold.collapsed { padding-bottom: 14px; }\n\n    .month-picker-sheet { width: min(calc(100% - 12px), 520px); }\n    .month-picker-year-row {\n      display: grid;\n      grid-template-columns: 44px 1fr 44px;\n      align-items: center;\n      gap: 8px;\n      margin-bottom: 12px;\n    }\n    .month-picker-year-row strong { text-align: center; font-size: 18px; }\n    .month-picker-year-btn {\n      width: 44px;\n      height: 44px;\n      border: 0;\n      border-radius: 50%;\n      background: var(--surface-container);\n      display: grid;\n      place-items: center;\n      cursor: pointer;\n    }\n    .month-picker-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }\n    .month-picker-option {\n      min-height: 46px;\n      border: 1px solid var(--outline-variant);\n      border-radius: 16px;\n      background: var(--surface-container-lowest);\n      color: var(--on-surface);\n      font-weight: 600;\n      text-transform: capitalize;\n      cursor: pointer;\n      padding: 8px 6px;\n    }\n    .month-picker-option.active { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }\n'''
          if '/* PROFILE-FOLD-MONTH-PICKER-V1 */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add collapsible profile cards and month picker"
          git push
