name: Compact operation filter tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-compact-operation-filter-tabs-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/compact_operation_filter_tabs_v2.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260918-operation-filter-tabs-v2' index.html
          grep -q 'OPERATION-FILTER-TABS-V2' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('OPERATION-FILTER-TABS-V2') == 1
          start = html.index('/* OPERATION-FILTER-TABS-V2 */')
          end = html.index('\n  </style>', start)
          css = html[start:end]
          assert 'text-overflow: ellipsis' not in css
          assert 'text-overflow: clip' in css
          assert 'overflow: visible' in css
          assert 'min-height: 32px' in css
          assert 'grid-template-columns: repeat(4, minmax(0, 1fr))' in css
          assert 'Charges fixes' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/compact_operation_filter_tabs_v2.py
          rm .github/workflows/run-compact-operation-filter-tabs-v2.yml
          git add index.html .github/scripts/compact_operation_filter_tabs_v2.py .github/workflows/run-compact-operation-filter-tabs-v2.yml
          git diff --cached --check
          git commit -m "fix: compact operation filters without truncation"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
