name: Lower pill nav and align search background

on:
  push:
    paths:
      - '.github/workflows/lower-pill-search-bg.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI overrides
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* SEARCH-BG-LOWER-PILL-V3 */'
          if marker not in text:
              css = '''\n    /* SEARCH-BG-LOWER-PILL-V3 */\n    #screen-home > .home-search-wrap {\n      background: var(--surface) !important;\n    }\n\n    .nav-wrap {\n      bottom: max(6px, calc(var(--safe-bottom) - 22px)) !important;\n    }\n    .bottom-nav {\n      height: calc(var(--nav-height) - 4px) !important;\n      min-height: 0 !important;\n      padding: 6px 10px !important;\n      border-radius: 32px !important;\n      overflow: visible !important;\n    }\n'''
              text = text.replace('</style>', css + '\n  </style>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align search background and lower pill navigation"
          git push
