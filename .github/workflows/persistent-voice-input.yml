name: Persistent voice input

on:
  push:
    paths:
      - '.github/workflows/persistent-voice-input.yml'
      - '.github/scripts/persistent_voice_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch persistent voice experience
        run: python .github/scripts/persistent_voice_patch.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No app changes needed."
            exit 0
          fi
          git commit -m "Make voice input persistent until confirmation"
          git push
