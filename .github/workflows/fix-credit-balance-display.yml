name: Fix credit monthly payments in 50 30 20 balance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-credit-balance-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch balance calculation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = '      const credits = sum(activeCredits(), x => x.monthlyPayment);'
          new1 = '      const credits = sum(state.credits, x => x.monthlyPayment);'
          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif new1 not in s:
              raise SystemExit('credit total line not found')

          old2 = '        { key: "needs", label: "Charges fixes", target: 50, value: s.buckets.needs },'
          new2 = '        { key: "needs", label: "Charges fixes", target: 50, value: s.fixed + sum(state.credits, x => x.monthlyPayment) },'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit('fixed bucket card line not found')

          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-credit-balance-display.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix credit monthly payments in 50 30 20 balance"
          git push origin main
