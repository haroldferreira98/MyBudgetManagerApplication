name: Add income categories

on:
  push:
    paths:
      - '.github/workflows/add-income-categories.yml'
      - '.github/scripts/add_income_categories.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch income categories
        run: python .github/scripts/add_income_categories.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add income categories"
          git push
