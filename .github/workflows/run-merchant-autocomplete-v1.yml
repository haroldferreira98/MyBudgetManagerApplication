name: Merchant autocomplete v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-merchant-autocomplete-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Build merchant dictionary and patch app
        run: python3 .github/scripts/merchant_autocomplete_v1.py

      - name: Validate source and dictionary
        shell: bash
        run: |
          grep -q '20260918-merchant-autocomplete-v1' index.html
          grep -q 'MERCHANT-AUTOCOMPLETE-V1' index.html
          grep -q 'data-merchant-input' index.html
          grep -q 'merchantPreferences' index.html
          grep -q 'loadMerchantDictionary' index.html
          python3 - <<'PY'
          from pathlib import Path
          import json, re, string, unicodedata
          payload = json.loads(Path('merchants.json').read_text(encoding='utf-8'))
          merchants = payload.get('merchants', [])
          assert len(merchants) >= 240, len(merchants)
          names = [str(x.get('name','')) for x in merchants]
          def key(s):
              return unicodedata.normalize('NFD', s).encode('ascii','ignore').decode().lower()
          assert names == sorted(names, key=key), 'merchants.json is not A-Z sorted'
          initials = {key(n)[:1] for n in names if key(n)}
          assert set(string.ascii_lowercase) <= initials, sorted(set(string.ascii_lowercase) - initials)
          assert any(x.get('name') == 'Intermarché' and x.get('category') == 'Alimentation' and x.get('subcategory') == 'Supermarchés & hypermarchés' for x in merchants)
          assert any(x.get('name') == 'Bolt' and x.get('category') == 'VTC & Taxi' and x.get('subcategory') == 'VTC' for x in merchants)
          assert any(x.get('name') == 'Amazon' and x.get('ambiguous') is True for x in merchants)
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('/* MERCHANT-AUTOCOMPLETE-V1 */') == 1
          assert html.count('// MERCHANT-AUTOCOMPLETE-V1') == 1
          assert html.count('data-merchant-input') >= 3
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          assert scripts
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/merchant_autocomplete_v1.py
          rm .github/workflows/run-merchant-autocomplete-v1.yml
          git add index.html merchants.json .github/scripts/merchant_autocomplete_v1.py .github/workflows/run-merchant-autocomplete-v1.yml
          git diff --cached --check
          git commit -m "feat: add merchant autocomplete and smart categories"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
