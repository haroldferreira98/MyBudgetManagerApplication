name: Add fixed charge sorting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-fixed-charge-sort.yml'

permissions:
  contents: write

jobs:
  patch_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch fixed charges sorting UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_state = '''    let expenseSort = "category";
    const expandedExpenseCategories = new Set();'''
          new_state = '''    let fixedSort = "date";
    const expandedFixedCategories = new Set();
    let expenseSort = "category";
    const expandedExpenseCategories = new Set();'''

          old_function = '''    function renderFixedCharges() {
      const container = document.getElementById("screen-fixed");
      if (!container) return;
      const charges = [...activeFixedCharges()].sort((a,b) => safeNumber(a.day, 1) - safeNumber(b.day, 1));
      const credits = activeCredits();
      const creditTotal = sum(credits, x => x.monthlyPayment);
      const total = sum(charges, x => x.amount) + creditTotal;
      container.innerHTML = `
        ${renderMonthSwitcher()}
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Charges fixes du mois</div>
            <div class="hero-value money">${formatMoney(total)}</div>
            <div class="hero-meta">
              <span class="daily-pill"><span class="material-symbols-outlined">event_repeat</span>${charges.length} prélèvement${charges.length > 1 ? "s" : ""}</span>
              <span class="daily-pill"><span class="material-symbols-outlined">credit_card</span>${credits.length} crédit${credits.length === 1 ? "" : "s"}</span>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Charges fixes</h2><p class="section-subtitle">Les prélèvements dont la date n'est pas encore arrivée sont affichés en attente.</p></div><button class="btn tonal small" data-add-type="fixed"><span class="material-symbols-outlined">add</span>Ajouter</button></div>
          <div class="list fixed-charge-list">${renderFixedChargeRows(charges)}</div>
        </div>`;
    }
'''

          new_function = '''    function renderFixedCharges() {
      const container = document.getElementById("screen-fixed");
      if (!container) return;
      const charges = [...activeFixedCharges()].sort((a, b) => {
        if (fixedSort === "category") {
          const categoryCompare = String(a.category || "Charge fixe").localeCompare(String(b.category || "Charge fixe"), "fr", { sensitivity: "base" });
          if (categoryCompare) return categoryCompare;
          return safeNumber(a.day, 1) - safeNumber(b.day, 1);
        }
        if (fixedSort === "amount") return safeNumber(b.amount) - safeNumber(a.amount);
        if (fixedSort === "alpha") return String(a.label || "").localeCompare(String(b.label || ""), "fr", { sensitivity: "base" });
        return safeNumber(a.day, 1) - safeNumber(b.day, 1);
      });
      const credits = activeCredits();
      const creditTotal = sum(credits, x => x.monthlyPayment);
      const total = sum(charges, x => x.amount) + creditTotal;

      let fixedListHtml;
      if (!charges.length) {
        fixedListHtml = renderFixedChargeRows(charges);
      } else if (fixedSort === "category") {
        const groups = new Map();
        charges.forEach(charge => {
          const category = charge.category || "Charge fixe";
          if (!groups.has(category)) groups.set(category, []);
          groups.get(category).push(charge);
        });
        fixedListHtml = [...groups.entries()].map(([category, items]) => `
          <details class="expense-category-group" data-fixed-category="${escapeHtml(category)}" ${expandedFixedCategories.has(category) ? "open" : ""}>
            <summary class="expense-category-summary">
              <div>
                <div class="expense-category-label">${escapeHtml(category)}</div>
                <div class="expense-category-meta">${items.length} prélèvement${items.length > 1 ? "s" : ""}</div>
              </div>
              <div class="expense-category-total money">${formatMoney(sum(items, x => x.amount))}</div>
              <span class="material-symbols-outlined expense-category-chevron">expand_more</span>
            </summary>
            <div class="expense-category-items">${renderFixedChargeRows(items)}</div>
          </details>`).join("");
      } else {
        fixedListHtml = renderFixedChargeRows(charges);
      }

      container.innerHTML = `
        ${renderMonthSwitcher()}
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Charges fixes du mois</div>
            <div class="hero-value money">${formatMoney(total)}</div>
            <div class="hero-meta">
              <span class="daily-pill"><span class="material-symbols-outlined">event_repeat</span>${charges.length} prélèvement${charges.length > 1 ? "s" : ""}</span>
              <span class="daily-pill"><span class="material-symbols-outlined">credit_card</span>${credits.length} crédit${credits.length === 1 ? "" : "s"}</span>
            </div>
          </div>
        </div>
        <div class="section">
          <div class="section-header">
            <div><h2 class="section-title">Charges fixes</h2></div>
            <div class="button-row">
              <div class="expense-sort">
                <button class="btn outlined small" type="button" data-fixed-sort-toggle aria-expanded="false"><span class="material-symbols-outlined">sort</span>Trier</button>
                <div class="expense-sort-menu" data-fixed-sort-menu hidden>
                  ${[["category", "Catégorie"], ["date", "Date"], ["amount", "Montant"], ["alpha", "Ordre alphabétique"]].map(([value, label]) => `<button class="expense-sort-option ${fixedSort === value ? "active" : ""}" type="button" data-fixed-sort="${value}"><span class="material-symbols-outlined">${fixedSort === value ? "check" : ""}</span>${label}</button>`).join("")}
                </div>
              </div>
              <button class="btn tonal small" data-add-type="fixed"><span class="material-symbols-outlined">add</span>Ajouter</button>
            </div>
          </div>
          <div class="list fixed-charge-list">${fixedListHtml}</div>
        </div>`;

      container.querySelectorAll("details[data-fixed-category]").forEach(group => {
        group.addEventListener("toggle", () => {
          const category = group.dataset.fixedCategory;
          if (!category) return;
          if (group.open) expandedFixedCategories.add(category);
          else expandedFixedCategories.delete(category);
        });
      });
    }
'''

          old_click_start = '''    document.addEventListener("click", event => {
      const sortToggle = event.target.closest("[data-expense-sort-toggle]");'''
          new_click_start = '''    document.addEventListener("click", event => {
      const fixedSortToggle = event.target.closest("[data-fixed-sort-toggle]");
      if (fixedSortToggle) {
        const menu = fixedSortToggle.parentElement.querySelector("[data-fixed-sort-menu]");
        const isHidden = menu?.hasAttribute("hidden");
        document.querySelectorAll("[data-fixed-sort-menu], [data-expense-sort-menu]").forEach(item => item.hidden = true);
        if (menu) menu.hidden = !isHidden;
        fixedSortToggle.setAttribute("aria-expanded", String(!!isHidden));
        return;
      }

      const fixedSortChoice = event.target.closest("[data-fixed-sort]");
      if (fixedSortChoice) {
        fixedSort = fixedSortChoice.dataset.fixedSort;
        renderFixedCharges();
        return;
      }

      const sortToggle = event.target.closest("[data-expense-sort-toggle]");'''

          old_outside = '''      if (!event.target.closest(".expense-sort")) {
        document.querySelectorAll("[data-expense-sort-menu]").forEach(menu => menu.hidden = true);
        document.querySelectorAll("[data-expense-sort-toggle]").forEach(button => button.setAttribute("aria-expanded", "false"));
      }'''
          new_outside = '''      if (!event.target.closest(".expense-sort")) {
        document.querySelectorAll("[data-expense-sort-menu], [data-fixed-sort-menu]").forEach(menu => menu.hidden = true);
        document.querySelectorAll("[data-expense-sort-toggle], [data-fixed-sort-toggle]").forEach(button => button.setAttribute("aria-expanded", "false"));
      }'''

          replacements = [
            (old_state, new_state),
            (old_function, new_function),
            (old_click_start, new_click_start),
            (old_outside, new_outside),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit('Expected block not found: ' + old[:140].replace('\n', ' | '))
            text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit app change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add sorting to fixed charges"
          git push origin main

      - name: Deploy app
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
