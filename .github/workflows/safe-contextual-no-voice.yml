name: Safe contextual no voice

on:
  push:
    paths:
      - '.github/workflows/safe-contextual-no-voice.yml'
      - '.github/scripts/safe_contextual_no_voice.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe patch
        run: python .github/scripts/safe_contextual_no_voice.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Firebase profile and keep voice disabled"
          git push
