name: Add health reimbursement tracking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-health-reimbursement-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply health reimbursement patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, zlib
          payload = ''''''
          Path('/tmp/health_patch.py').write_bytes(zlib.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/health_patch.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-health-reimbursement-v1' index.html
          grep -q 'Suivi de remboursement' index.html
          grep -q 'healthReimbursementOperationRows' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          income = html.split('const INCOME_CATEGORIES = [',1)[1].split('];',1)[0]
          assert 'Remboursement mutuelle' not in income
          assert 'Remboursement sécurité sociale' not in income
          assert html.count('"Remboursement mutuelle"') == 1
          assert html.count('"Remboursement sécurité sociale"') == 1
          assert 'healthSocialSecurityAmount' in html
          assert 'healthMutualAmount' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-health-reimbursement-v1.yml
          git add index.html .github/workflows/run-health-reimbursement-v1.yml
          git diff --cached --check
          git commit -m "feat: track health reimbursements"
          git push origin main
