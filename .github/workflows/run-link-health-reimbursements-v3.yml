name: Link health reimbursements to source expense

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-link-health-reimbursements-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/link_health_reimbursements_v3.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-health-reimbursement-linked-v3' index.html
          grep -q 'HEALTH-REIMBURSEMENT-LINKED-V3' index.html
          grep -q 'health-linked-refunds' index.html
          if grep -q 'filter(row => isCurrentMonth(row.sortDate))' index.html; then
            echo 'Standalone reimbursement chronology still present' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('HEALTH-REIMBURSEMENT-LINKED-V3') == 1
          assert html.count('class="health-linked-refunds"') == 1
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/link_health_reimbursements_v3.py
          rm .github/workflows/run-link-health-reimbursements-v3.yml
          git add index.html .github/scripts/link_health_reimbursements_v3.py .github/workflows/run-link-health-reimbursements-v3.yml
          git diff --cached --check
          git commit -m "fix: keep health reimbursements with source expense"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
