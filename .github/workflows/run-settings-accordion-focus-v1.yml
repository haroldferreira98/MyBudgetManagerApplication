name: Apply settings back and category accordion focus

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-settings-accordion-focus-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply requested UI behavior
        run: python3 .github/scripts/settings_accordion_focus_v1.py

      - name: Validate patch and JavaScript
        shell: bash
        run: |
          grep -q 'SETTINGS-ACCORDION-FOCUS-V1' index.html
          grep -q '20260917-settings-accordion-focus-v1' index.html
          grep -q 'settings-back-btn' index.html
          grep -q 'expandedOperationCategories.clear()' index.html
          grep -q 'has-open-category' index.html
          grep -q 'blur(8px)' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('SETTINGS-ACCORDION-FOCUS-V1') == 1
          assert html.count('class="btn outlined small settings-back-btn"') == 1
          assert html.count('expandedOperationCategories.clear()') == 1
          assert html.count('syncOperationCategoryFocus') >= 3
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move during patch
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-settings-accordion-focus-v1.yml
          rm .github/scripts/settings_accordion_focus_v1.py
          git add index.html .github/workflows/run-settings-accordion-focus-v1.yml .github/scripts/settings_accordion_focus_v1.py
          git diff --cached --check
          git commit -m "feat: add settings back button and category focus accordion"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
