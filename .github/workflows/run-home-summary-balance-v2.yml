name: Run home summary and balance refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-home-summary-balance-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply requested UI refinements
        run: python3 .github/scripts/home_summary_balance_v2.py

      - name: Validate change and JavaScript syntax
        shell: bash
        run: |
          grep -q 'HOME-SUMMARY-BALANCE-V2' index.html
          grep -q '20260916-home-summary-balance-v2' index.html
          grep -q 'summary-mini-label">Total<' index.html
          grep -q 'formatMoney(s.expenses)' index.html
          grep -q 'balance-progress-label' index.html
          grep -q 'grid-template-columns: repeat(4' index.html
          if grep -q 'target-badge">${item.target}%' index.html; then
            echo 'Target badge still present in balance markup' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('HOME-SUMMARY-BALANCE-V2') == 1
          assert html.count('summary-mini-label">Total<') == 1
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move during patch
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-home-summary-balance-v2.yml
          rm .github/scripts/home_summary_balance_v2.py
          git add index.html .github/workflows/run-home-summary-balance-v2.yml .github/scripts/home_summary_balance_v2.py
          git diff --cached --check
          git commit -m "ui: refine home summary balance and category spacing"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
