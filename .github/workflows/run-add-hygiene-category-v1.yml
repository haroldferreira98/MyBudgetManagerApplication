name: Add hygiene expense category

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-add-hygiene-category-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Add hygiene category
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if '"Hygiène"' in text:
              raise SystemExit('Hygiène already present')

          text, count = re.subn(
              r'<meta name="app-build" content="[^"]+"\s*/>',
              '<meta name="app-build" content="20260917-hygiene-category-v1" />',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('App build marker not found')

          category_anchor = '      "Impôts",\n      "Livraison de repas",'
          category_replacement = '      "Impôts",\n      "Hygiène",\n      "Livraison de repas",'
          if text.count(category_anchor) != 1:
              raise SystemExit(f'Expense category anchor count: {text.count(category_anchor)}')
          text = text.replace(category_anchor, category_replacement, 1)

          icon_anchor = '        "Carburant": "local_gas_station",\n        "Loisirs": "sports_esports",'
          icon_replacement = '        "Carburant": "local_gas_station",\n        "Hygiène": "soap",\n        "Loisirs": "sports_esports",'
          if text.count(icon_anchor) != 1:
              raise SystemExit(f'Category icon anchor count: {text.count(icon_anchor)}')
          text = text.replace(icon_anchor, icon_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-hygiene-category-v1' index.html
          grep -q '"Hygiène"' index.html
          grep -q '"Hygiène": "soap"' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('"Hygiène"') == 2
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if scripts:
              Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          if [ -f /tmp/app-inline.js ]; then node --check /tmp/app-inline.js; fi
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-add-hygiene-category-v1.yml
          git add index.html
          git diff --cached --check
          git commit -m "feat: add hygiene expense category"
          git push origin main
