name: Reimbursement swipe completion v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-reimbursement-swipe-complete-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/reimbursement_swipe_complete_v1.py

      - name: Normalize generated whitespace
        run: sed -i 's/[[:space:]]\+$//' index.html

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260918-reimbursement-swipe-complete-v1' index.html
          grep -q 'REIMBURSEMENT-SWIPE-COMPLETE-V1' index.html
          grep -q 'Glisser pour terminer' index.html
          grep -q 'data-reimbursement-swipe-handle' index.html
          grep -q 'completedAt: String(raw.completedAt || "")' index.html
          grep -q 'data-reimbursement-reopen' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('/* REIMBURSEMENT-SWIPE-COMPLETE-V1 */') == 1
          assert html.count('// REIMBURSEMENT-SWIPE-COMPLETE-V1') == 1
          assert 'reimbursement-tracking-card-completed' in html
          assert 'setHealthReimbursementCompleted' in html
          assert 'reimbursementSwipeGesture' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('no inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/reimbursement_swipe_complete_v1.py
          rm .github/workflows/run-reimbursement-swipe-complete-v1.yml
          git add index.html .github/scripts/reimbursement_swipe_complete_v1.py .github/workflows/run-reimbursement-swipe-complete-v1.yml
          git diff --cached --check
          git commit -m "feat: add swipe to finish reimbursement tracking"
          git push origin main

      - name: Deploy Firebase production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYBUDGETMANAGERAPPLICATION }}'
          channelId: live
          projectId: mybudgetmanagerapplication
