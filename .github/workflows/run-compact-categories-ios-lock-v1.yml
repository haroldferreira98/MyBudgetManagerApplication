name: Apply compact categories and iOS interaction lock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-compact-categories-ios-lock-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply patch
        run: python3 .github/scripts/compact_categories_ios_lock_v1.py

      - name: Validate UI patch and JavaScript
        shell: bash
        run: |
          grep -q 'COMPACT-CATEGORIES-IOS-LOCK-V1' index.html
          grep -q '20260916-compact-categories-ios-lock-v1' index.html
          grep -q 'margin-top: 0 !important' index.html
          grep -q 'border-radius: var(--radius-small) !important' index.html
          grep -q 'touch-action: pan-y' index.html
          grep -q 'document.addEventListener("touchstart", preventMultiTouchZoom' index.html
          grep -q 'document.addEventListener("selectstart"' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('COMPACT-CATEGORIES-IOS-LOCK-V1') == 1
          assert html.count('document.addEventListener("touchstart", preventMultiTouchZoom') == 1
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move during patch
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-compact-categories-ios-lock-v1.yml
          rm .github/scripts/compact_categories_ios_lock_v1.py
          git add index.html .github/workflows/run-compact-categories-ios-lock-v1.yml .github/scripts/compact_categories_ios_lock_v1.py
          git diff --cached --check
          git commit -m "ui: compact category rows and restore iOS interaction lock"
          git push origin main
