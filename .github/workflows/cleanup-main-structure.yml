name: One-time technical cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-main-structure.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate UI rules into index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          marker = '/* INCOME-AMOUNT-DATE-ROW-V1 */'
          if marker not in s:
              css = r'''
    /* INCOME-AMOUNT-DATE-ROW-V1
       Keep income amount and date side by side on iPhone. This belongs in the
       main UI stylesheet; firebase-config.js must never mutate the interface. */
    #entityModal[data-entity-type="income"] .field-row {
      display: grid !important;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr) !important;
      gap: 12px !important;
      width: 100% !important;
      min-width: 0 !important;
    }
    #entityModal[data-entity-type="income"] .field-row > .field {
      min-width: 0 !important;
      width: auto !important;
      max-width: 100% !important;
      contain: inline-size;
      overflow: hidden;
    }
    #entityModal[data-entity-type="income"] .field-row input {
      display: block !important;
      inline-size: 100% !important;
      width: 100% !important;
      min-inline-size: 0 !important;
      min-width: 0 !important;
      max-inline-size: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
    }
    #entityModal[data-entity-type="income"] input[type="date"] {
      -webkit-appearance: none !important;
      appearance: none !important;
      overflow: hidden !important;
      white-space: nowrap;
      padding-right: 10px !important;
    }
    #entityModal[data-entity-type="income"] input[type="date"]::-webkit-date-and-time-value {
      min-width: 0 !important;
      width: 100% !important;
      text-align: left !important;
    }
'''
              if '</style>' not in s:
                  raise SystemExit('main style closing tag not found')
              s = s.replace('</style>', css + '  </style>', 1)

          s = re.sub(
              r'<meta name="app-build" content="[^"]*"\s*/>',
              '<meta name="app-build" content="20260916-cleanup" />',
              s,
              count=1,
          )
          s = re.sub(
              r'<script src="firebase-config\.js\?v=[^"]+"></script>',
              '<script src="firebase-config.js?v=20260916-config-only"></script>',
              s,
              count=1,
          )

          path.write_text(s, encoding='utf-8')
          PY

          if git diff --quiet -- index.html; then
            echo 'No index changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Consolidate UI rules into main app'
          git push
