name: Refine voice cancellation and silent failures
on:
  push:
    paths: ['.github/workflows/refine-voice-cancel-silent.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch voice UX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          t=t.replace('''      <div class="voice-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>\n    </div>\n  </div>''','''      <div class="voice-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>\n      <button class="voice-cancel-btn" id="voiceCancelBtn" type="button" aria-label="Annuler la saisie vocale"><span class="material-symbols-outlined">close</span></button>\n    </div>\n  </div>''',1)
          if '/* VOICE-CANCEL-SILENT-V1 */' not in t:
            t=t.replace('</style>','''    /* VOICE-CANCEL-SILENT-V1 */\n    .voice-hud-card{position:relative}.voice-cancel-btn{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--surface-container-high);color:var(--on-surface);cursor:pointer;margin-left:4px}.voice-cancel-btn:active{transform:scale(.94)}\n  </style>''',1)
          t=t.replace('''        if (!parsed.ok) {\n          completed = true;\n          setVoiceHud(true, "Je n’ai pas compris", parsed.message);\n          showSnackbar(parsed.message);\n          setTimeout(() => setVoiceHud(false), 1600);\n          return;\n        }''','''        if (!parsed.ok) {\n          completed = true;\n          try { recognition?.abort(); } catch (_) {}\n          setVoiceHud(false);\n          return;\n        }''',1)
          t=t.replace('''      recognition.onerror = event => {\n        completed = true;\n        const map = { "not-allowed": "Autorisation du microphone refusée.", "no-speech": "Aucune parole détectée.", "network": "Le service vocal n’est pas disponible pour le moment.", "aborted": "Écoute arrêtée." };\n        const message = map[event.error] || "La reconnaissance vocale a échoué.";\n        setVoiceHud(true, "Écoute interrompue", message);\n        if (event.error !== "aborted") showSnackbar(message);\n        setTimeout(() => setVoiceHud(false), 1300);\n      };''','''      recognition.onerror = event => {\n        completed = true;\n        setVoiceHud(false);\n      };''',1)
          marker='    function startVoiceRecognition(options = {}) {'
          if 'function cancelVoiceRecognition()' not in t:
            t=t.replace(marker,'''    function cancelVoiceRecognition() {\n      try { recognition?.abort(); } catch (_) {}\n      recognition = null;\n      setVoiceHud(false);\n      document.getElementById("micBtn")?.classList.remove("listening");\n    }\n\n'''+marker,1)
          marker2='    document.getElementById("entityForm").addEventListener("submit", handleEntitySubmit);'
          if 'getElementById("voiceCancelBtn")?.addEventListener' not in t:
            t=t.replace(marker2,marker2+'''\n    document.getElementById("voiceCancelBtn")?.addEventListener("click", event => { event.preventDefault(); event.stopPropagation(); cancelVoiceRecognition(); });''',1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make voice input cancellable and silent on failures'
          git push
