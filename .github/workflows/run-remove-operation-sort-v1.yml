name: Apply fixed category sort

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-remove-operation-sort-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/remove_operation_sort_v1.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-fixed-category-sort-v1' index.html
          grep -q 'const operationSort = "category";' index.html
          ! grep -q 'data-operation-sort-toggle' index.html
          ! grep -q 'data-operation-sort-menu' index.html
          ! grep -q 'data-operation-sort=' index.html
          ! grep -q 'const sortOptions =' index.html
          ! grep -q 'operationSort = button.dataset.operationSort' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('const operationSort = "category";') == 1
          assert 'data-operation-filter-toggle' in html
          assert 'data-operation-add-toggle' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if scripts:
              Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          if [ -f /tmp/app-inline.js ]; then node --check /tmp/app-inline.js; fi
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-remove-operation-sort-v1.yml
          rm .github/scripts/remove_operation_sort_v1.py
          git add index.html .github/workflows/run-remove-operation-sort-v1.yml .github/scripts/remove_operation_sort_v1.py
          git diff --cached --check
          git commit -m "refactor: fix operations sorting to categories"
          git push origin main
