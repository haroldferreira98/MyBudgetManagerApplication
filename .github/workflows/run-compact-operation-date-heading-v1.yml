name: Compact operation date heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-compact-operation-date-heading-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/compact_operation_date_heading_v1.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-compact-operation-date-heading-v1' index.html
          grep -q '.operation-date-group + .operation-date-group { margin-top: 4px; }' index.html
          grep -q 'padding: 6px 12px 3px;' index.html
          grep -q 'font-size: 11px;' index.html
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push final change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-compact-operation-date-heading-v1.yml
          rm .github/scripts/compact_operation_date_heading_v1.py
          git add index.html .github/workflows/run-compact-operation-date-heading-v1.yml .github/scripts/compact_operation_date_heading_v1.py
          git diff --cached --check
          git commit -m "style: compact operation date headings"
          git push origin main
