name: Remove summary notes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-summary-notes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove summary note labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          ce_mois = '                <div class="summary-mini-note">Ce mois</div>\n'
          total_mois = '                <div class="summary-mini-note">Total du mois</div>\n'
          if s.count(ce_mois) < 2:
              raise SystemExit('Expected two Ce mois summary notes')
          if s.count(total_mois) < 1:
              raise SystemExit('Expected Total du mois summary note')
          s = s.replace(ce_mois, '', 2)
          s = s.replace(total_mois, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/remove-summary-notes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove notes under home summary cards"
          git push origin main
