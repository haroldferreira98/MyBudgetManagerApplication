name: Repair Google profile and remove voice safely

on:
  push:
    paths:
      - '.github/workflows/repair-google-profile-remove-voice.yml'
      - '.github/scripts/repair_google_profile_remove_voice.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair app safely
        run: python .github/scripts/repair_google_profile_remove_voice.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Google profile and remove voice safely"
          git push
