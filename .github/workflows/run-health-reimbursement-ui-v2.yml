name: Redesign health reimbursement UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-health-reimbursement-ui-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply source patch
        run: python3 .github/scripts/redesign_health_reimbursement_ui_v2.py

      - name: Validate source
        shell: bash
        run: |
          grep -q '20260917-health-reimbursement-ui-v2' index.html
          grep -q 'HEALTH-REIMBURSEMENT-TRACKING-V2' index.html
          grep -q 'health-switch-control' index.html
          grep -q 'health-reimbursement-available' index.html
          grep -q 'state.expenses.forEach(item => {' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('HEALTH-REIMBURSEMENT-TRACKING-V2') == 1
          assert html.count('Associer les remboursements à cette dépense santé') == 1
          assert 'healthReimbursementOperationRows(item)\n          .filter(row => isCurrentMonth(row.sortDate))' in html
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/app-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
          git diff --check

      - name: Ensure main did not move
        shell: bash
        run: |
          EXPECTED="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$EXPECTED" = "$REMOTE"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/run-health-reimbursement-ui-v2.yml
          rm .github/scripts/redesign_health_reimbursement_ui_v2.py
          git add index.html .github/workflows/run-health-reimbursement-ui-v2.yml .github/scripts/redesign_health_reimbursement_ui_v2.py
          git diff --cached --check
          git commit -m "fix: redesign health reimbursement tracking UI"
          git push origin main
