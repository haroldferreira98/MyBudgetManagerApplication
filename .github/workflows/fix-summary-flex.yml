name: Fix summary flex

on:
  push:
    paths:
      - '.github/workflows/fix-summary-flex.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix summary flex
        shell: bash
        run: |
          python - <<'PY'
          import base64
          exec(base64.b64decode('').decode())
          PY
      - name: Validate
        run: git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix compact summary metadata row"
          git push
