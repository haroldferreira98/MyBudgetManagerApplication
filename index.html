      state.expenses.forEach(x => rows.push(["depense",x.id,x.label,x.amount,x.date,x.category,x.bucket,"","","","","","","","","",""]));
      state.incomes.forEach(x => rows.push(["revenu",x.id,x.label,x.amount,x.date,x.category || "Salaire","","","","","","","","","","",""]));
      state.fixedCharges.forEach(x => rows.push(["charge_fixe",x.id,x.label,x.amount,"","",x.bucket,x.day,x.active !== false,"","","","","","","",""]));
      state.credits.forEach(x => rows.push(["credit",x.id,x.name,"","","","savings","",x.active !== false,x.principal,x.balance,x.zeroRate ? 0 : x.annualRate,x.monthlyPayment,"","","",""]));
      state.projects.forEach(x => rows.push(["projet_epargne",x.id,x.name,"","","","savings","",x.active !== false,"","","","",x.target,x.current,x.monthlyAllocation,""]));
      state.envelopes.forEach(x => rows.push(["enveloppe",x.id,x.name,"","",x.category,"","","","","","","","","","",x.limit]));
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(";")).join("\r\
");
      downloadBlob(`budget-${todayISO()}.csv`, `\uFEFF${csv}`, "text/csv;charset=utf-8");
      showSnackbar("Export CSV généré.");
    }

    function downloadBlob(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function isValidImportPayload(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return false;
      const collections = ["incomes", "expenses", "fixedCharges", "credits", "projects", "envelopes"];
      return collections.some(key => Array.isArray(value[key]));
    }

    async function importJSONFile(file) {
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        if (!isValidImportPayload(parsed)) {
          showSnackbar("Ce fichier ne contient pas une sauvegarde Budget valide.");
          return;
        }
        const migrated = migrateState(parsed);
        if (!confirm("Importer ce fichier remplacera les données du budget actuellement synchronisées avec ce compte. Continuer ?")) return;
        state = migrated;
        saveState("Sauvegarde JSON importée et synchronisée.");
      } catch (error) {
        console.error(error);
        showSnackbar("Fichier JSON invalide ou illisible.");
      } finally {
        document.getElementById("jsonImportInput").value = "";
      }
    }

    async function deleteAllCloudData() {
      if (!cloud || !cloudUser) {
        showSnackbar("Connecte-toi à Google pour supprimer les données du cloud.");
        return;
      }
      if (!confirm("Supprimer définitivement toutes les données de ce budget dans Firebase ?")) return;
      clearTimeout(cloudSaveTimer);
      applyingCloudState = true;
      try {
        state = EMPTY_STATE();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const { doc, setDoc, serverTimestamp } = cloud.storeMod;
        await setDoc(doc(cloud.db, "budgetUsers", cloudUser.uid), {
          state,
          schemaVersion: STATE_VERSION,
          updatedAt: serverTimestamp()
        }, { merge: false });
        renderAll();
        setCurrentScreen("home");
        showSnackbar("Toutes les données du budget ont été supprimées de Firebase.");
      } catch (error) {
        console.error("Suppression cloud impossible", error);
        showSnackbar("Suppression des données Firebase impossible.");
      } finally {
        applyingCloudState = false;
      }
    }

    document.getElementById("entityForm").addEventListener("submit", handleEntitySubmit);

    function resetReimbursementSwipe(track) {
      if (!track) return;
      track.classList.remove("dragging", "ready");
      track.style.setProperty("--swipe-x", "0px");
    }

    document.addEventListener("pointerdown", event => {
      const handle = event.target.closest?.("[data-reimbursement-swipe-handle]");
      if (!handle) return;
      const track = handle.closest("[data-reimbursement-swipe]");
      if (!track) return;
      event.preventDefault();
      event.stopPropagation();
      const trackRect = track.getBoundingClientRect();
      const handleRect = handle.getBoundingClientRect();
      const max = Math.max(0, trackRect.width - handleRect.width - 8);
      reimbursementSwipeGesture = { pointerId:event.pointerId, handle, track, id:track.dataset.reimbursementSwipe, startX:event.clientX, max, x:0 };
      track.classList.add("dragging");
      handle.setPointerCapture?.(event.pointerId);
    }, true);

    document.addEventListener("pointermove", event => {
      const gesture = reimbursementSwipeGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      event.preventDefault();
      const x = clamp(event.clientX - gesture.startX, 0, gesture.max);
      gesture.x = x;
      gesture.track.style.setProperty("--swipe-x", `${x}px`);
      gesture.track.classList.toggle("ready", gesture.max > 0 && x / gesture.max >= .82);
    }, true);

    const finishReimbursementSwipe = event => {
      const gesture = reimbursementSwipeGesture;
      if (!gesture || gesture.pointerId !== event.pointerId) return;
      event.preventDefault();
      event.stopPropagation();
      reimbursementSwipeGesture = null;
      const completed = gesture.max > 0 && gesture.x / gesture.max >= .82;
      if (completed) {
        gesture.track.classList.add("ready");
        gesture.track.style.setProperty("--swipe-x", `${gesture.max}px`);
        setTimeout(() => setHealthReimbursementCompleted(gesture.id, true), 120);
      } else {
        resetReimbursementSwipe(gesture.track);
      }
    };
    document.addEventListener("pointerup", finishReimbursementSwipe, true);
    document.addEventListener("pointercancel", finishReimbursementSwipe, true);

    document.addEventListener("click", event => {
      const reopen = event.target.closest?.("[data-reimbursement-reopen]");
      if (reopen) {
        event.preventDefault();
        event.stopPropagation();
        setHealthReimbursementCompleted(reopen.dataset.reimbursementReopen, false);
        return;
      }
      const swipe = event.target.closest?.("[data-reimbursement-swipe]");
      if (swipe) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }

      const fixedSortToggle = event.target.closest("[data-fixed-sort-toggle]");
      if (fixedSortToggle) {
        const menu = fixedSortToggle.parentElement.querySelector("[data-fixed-sort-menu]");
        const isHidden = menu?.hasAttribute("hidden");
        document.querySelectorAll("[data-fixed-sort-menu], [data-expense-sort-menu]").forEach(item => item.hidden = true);
        if (menu) menu.hidden = !isHidden;
        fixedSortToggle.setAttribute("aria-expanded", String(!!isHidden));
        return;
      }

      const fixedSortChoice = event.target.closest("[data-fixed-sort]");
      if (fixedSortChoice) {
        fixedSort = fixedSortChoice.dataset.fixedSort;
        renderFixedCharges();
        return;
      }

      const sortToggle = event.target.closest("[data-expense-sort-toggle]");
      if (sortToggle) {
        const menu = sortToggle.parentElement.querySelector("[data-expense-sort-menu]");
        const isHidden = menu?.hasAttribute("hidden");
        document.querySelectorAll("[data-expense-sort-menu]").forEach(item => item.hidden = true);
        if (menu) menu.hidden = !isHidden;
        sortToggle.setAttribute("aria-expanded", String(!!isHidden));
        return;
      }

      const sortChoice = event.target.closest("[data-expense-sort]");
      if (sortChoice) {
        expenseSort = sortChoice.dataset.expenseSort;
        renderExpenses();
        return;
      }

      const filterToggle = event.target.closest("[data-expense-filter-toggle]");
      if (filterToggle) {
        document.getElementById("expenseFilters")?.querySelector("[data-expense-filter]")?.focus();
        return;
      }

      if (!event.target.closest(".expense-sort")) {
        document.querySelectorAll("[data-expense-sort-menu], [data-fixed-sort-menu]").forEach(menu => menu.hidden = true);
        document.querySelectorAll("[data-expense-sort-toggle], [data-fixed-sort-toggle]").forEach(button => button.setAttribute("aria-expanded", "false"));
      }

      const privacy = event.target.closest("#privacyBtn");
      if (privacy) {
        state.settings.privacy = !state.settings.privacy;
        saveState();
        return;
      }

      const settings = event.target.closest("#settingsBtn");
      if (settings) { setCurrentScreen(currentScreen === "settings" ? "home" : "settings"); return; }

      const account = event.target.closest("#accountBtn");
      if (account) { checkForAppUpdate(); renderProfile(); renderAccountModal(); openModal("accountModal"); return; }

      const accountSignIn = event.target.closest("#accountSignInBtn");
      if (accountSignIn) {
        closeModal("accountModal");
        signInWithGoogle();
        return;
      }

      const accountSignOut = event.target.closest("#accountSignOutBtn");
      if (accountSignOut) {
        closeModal("accountModal");
        signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });
        return;
      }

      const monthShift = event.target.closest("[data-month-shift]");
      if (monthShift) { shiftSelectedMonth(safeNumber(monthShift.dataset.monthShift)); return; }

      const reimbursementMonthPicker = event.target.closest("[data-reimbursement-month-picker]");
      if (reimbursementMonthPicker) { openMonthPicker("reimbursement"); return; }

      const monthPicker = event.target.closest("[data-month-picker]");
      if (monthPicker) { openMonthPicker("budget"); return; }

      const pickerYear = event.target.closest("[data-picker-year]");
      if (pickerYear) { monthPickerYear += safeNumber(pickerYear.dataset.pickerYear); renderMonthPicker(); return; }

      const pickerMonth = event.target.closest("[data-picker-month]");
      if (pickerMonth) {
        const chosenMonth = `${monthPickerYear}-${String(safeNumber(pickerMonth.dataset.pickerMonth) + 1).padStart(2, "0")}`;
        closeModal("monthPickerModal");
        if (monthPickerContext === "reimbursement") {
          reimbursementTrackingMonth = chosenMonth;
          renderProfile();
          renderAccountModal();
        } else {
          selectedMonth = chosenMonth;
          renderAll();
        }
        return;
      }

      const foldToggle = event.target.closest("[data-toggle-profile-fold]");
      if (foldToggle) {
        const key = foldToggle.dataset.toggleProfileFold;
        if (expandedProfileItems.has(key)) expandedProfileItems.delete(key);
        else expandedProfileItems.add(key);
        renderProfile();
        renderAccountModal();
        return;
      }

      const nav = event.target.closest("[data-screen]");
      if (nav) setCurrentScreen(nav.dataset.screen);

      const add = event.target.closest("[data-add-type]");
      if (add) openEntityModal(add.dataset.addType, null, null, true);

      const edit = event.target.closest("[data-edit-type]");
      if (edit) openEntityModal(edit.dataset.editType, edit.dataset.editId);

      const close = event.target.closest("[data-close-modal]");
      if (close) closeModal(close.dataset.closeModal);

      const charge = event.target.closest("[data-toggle-charge]");
      if (charge) toggleChargePaid(charge.dataset.toggleCharge);

      const filter = event.target.closest("[data-expense-filter]");
      if (filter) { expenseFilter = filter.dataset.expenseFilter; renderExpenses(); }

      const theme = event.target.closest("[data-theme-choice]");
      if (theme) {
        state.settings.theme = theme.dataset.themeChoice;
        saveState("Apparence mise à jour.");
      }

      if (event.target.id === "exportJsonBtn" || event.target.closest("#exportJsonBtn")) exportJSON();
      if (event.target.id === "exportCsvBtn" || event.target.closest("#exportCsvBtn")) exportCSV();
      if (event.target.id === "importJsonBtn" || event.target.closest("#importJsonBtn")) document.getElementById("jsonImportInput").click();
      if (event.target.id === "deleteCloudDataBtn" || event.target.closest("#deleteCloudDataBtn")) deleteAllCloudData();
      if (event.target.id === "googleSignInBtn" || event.target.closest("#googleSignInBtn")) signInWithGoogle();
      if (event.target.id === "googleSignOutBtn" || event.target.closest("#googleSignOutBtn")) signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });
    });

    document.addEventListener("click", event => {
      const backdrop = event.target.closest?.(".sheet-backdrop.open");
      if (!backdrop || event.target !== backdrop) return;
      event.preventDefault();
      event.stopPropagation();
      closeModal(backdrop.id);
    }, true);

    document.addEventListener("keydown", event => {
      const editableRow = event.target.closest?.('[data-edit-type][data-edit-id][role="button"]');
      if (editableRow && (event.key === "Enter" || event.key === " ")) {
        event.preventDefault();
        editableRow.click();
        return;
      }
      if (event.key === "Escape") {
        const hadOperationMenu = !!document.querySelector("[data-operation-filter-menu]:not([hidden]), [data-operation-sort-menu]:not([hidden]), [data-operation-add-menu]:not([hidden])");
        const openSheets = [...document.querySelectorAll(".sheet-backdrop.open")];
        closeOperationMenus();
        openSheets.forEach(el => closeModal(el.id));
        if (hadOperationMenu || openSheets.length) event.preventDefault();
      }
    });

    document.getElementById("jsonImportInput").addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importJSONFile(file);
    });

    if (window.matchMedia) {
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const onSystemThemeChange = () => { if (state.settings.theme === "auto") applyTheme(); };
      if (media.addEventListener) media.addEventListener("change", onSystemThemeChange);
      else if (media.addListener) media.addListener(onSystemThemeChange);
    }

    // APP-AUTO-REFRESH-V2
    const APP_BUILD = document.querySelector('meta[name="app-build"]')?.content || "";
    let appUpdateCheckInFlight = false;
    async function checkForAppUpdate() {
      if (appUpdateCheckInFlight || !navigator.onLine) return;
      appUpdateCheckInFlight = true;
      try {
        const response = await fetch(`/index.html?app-update=${Date.now()}`, { cache: "no-store", headers: { "Cache-Control": "no-cache" } });
        if (!response.ok) return;
        const html = await response.text();
        const match = html.match(/<meta name="app-build" content="([^"]+)"/);
        if (match?.[1] && APP_BUILD && match[1] !== APP_BUILD) {
          window.location.reload();
          return;
        }
      } catch (_) {
      } finally {
        appUpdateCheckInFlight = false;
      }
    }
    window.addEventListener("focus", checkForAppUpdate);
    window.addEventListener("pageshow", checkForAppUpdate);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForAppUpdate(); });

    renderAll();
    initCloudSync();
    setTimeout(checkForAppUpdate, 1200);
    setInterval(() => { if (document.visibilityState === "visible") checkForAppUpdate(); }, 30000);
  </script>
</body>
</html>
