<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Web Studio Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf8fd;
      --surface: #f7f2fa;
      --surface-c: #ede7f6;
      --surface-h: #e6e0ee;
      --primary: #6750a4;
      --on-primary: #ffffff;
      --primary-c: #eaddff;
      --on-primary-c: #21005d;
      --sec-c: #e8def8;
      --on-sec-c: #1d192b;
      --text: #1d1b20;
      --text-sub: #49454f;
      --outline: #cac4d0;
      --shade: rgba(247, 242, 250, 0.94);
      --editor-bg: #1e1e24;
      --editor-fg: #f5f2f8;
      --gutter-bg: #16161b;
      --gutter-fg: #757182;
      --gutter-act-bg: rgba(103, 80, 164, 0.35);
      --gutter-act-fg: #eaddff;
      --hl-match: rgba(33, 150, 243, 0.2);
      --hl-act: #2196f3;
      --radius-card: 24px;
      --radius-pill: 9999px;

      /* Palette Coloration Syntaxique Material */
      --syn-keyword: #ff7b72;
      --syn-tag: #7ee787;
      --syn-attr: #79c0ff;
      --syn-string: #a5d6ff;
      --syn-comment: #8b949e;
      --syn-number: #ffa657;
      --syn-prop: #d2a8ff;
    }
    [data-theme="dark"], @media (prefers-color-scheme: dark) {
      [data-theme="auto"] {
        --bg: #141218;
        --surface: #1d1b20;
        --surface-c: #2b2930;
        --surface-h: #36343b;
        --primary: #d0bcff;
        --on-primary: #381e72;
        --primary-c: #4f378b;
        --on-primary-c: #eaddff;
        --sec-c: #4a4458;
        --on-sec-c: #e8def8;
        --text: #e6e1e5;
        --text-sub: #cac4d0;
        --outline: #49454f;
        --shade: rgba(29, 27, 32, 0.94);
        --editor-bg: #0f0e13;
        --editor-fg: #ece6f0;
        --gutter-bg: #09080c;
        --gutter-fg: #605d68;
        --gutter-act-bg: rgba(208, 188, 255, 0.25);
        --gutter-act-fg: #d0bcff;
        --hl-match: rgba(255, 235, 59, 0.25);
        --hl-act: #ffeb3b;
      }
    }
    [data-theme="dark"] {
      --bg: #141218;
      --surface: #1d1b20;
      --surface-c: #2b2930;
      --surface-h: #36343b;
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-c: #4f378b;
      --on-primary-c: #eaddff;
      --sec-c: #4a4458;
      --on-sec-c: #e8def8;
      --text: #e6e1e5;
      --text-sub: #cac4d0;
      --outline: #49454f;
      --shade: rgba(29, 27, 32, 0.94);
      --editor-bg: #0f0e13;
      --editor-fg: #ece6f0;
      --gutter-bg: #09080c;
      --gutter-fg: #605d68;
      --gutter-act-bg: rgba(208, 188, 255, 0.25);
      --gutter-act-fg: #d0bcff;
      --hl-match: rgba(255, 235, 59, 0.25);
      --hl-act: #ffeb3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Google Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    svg.icon { width: 20px; height: 20px; fill: currentColor; display: block; flex-shrink: 0; }
    #view-home { flex: 1; display: flex; flex-direction: column; padding: 20px 20px 16px; overflow-y: auto; gap: 20px; }
    .top-bar { display: flex; align-items: center; justify-content: space-between; }
    .badge-chip { background: var(--primary-c); color: var(--on-primary-c); padding: 6px 14px; border-radius: var(--radius-pill); font-size: 0.78rem; font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .version-badge { font-size: 0.72rem; font-weight: 700; padding: 6px 10px; border-radius: var(--radius-pill); background: var(--surface-c); color: var(--text-sub); }
    .icon-btn { width: 40px; height: 40px; border-radius: var(--radius-pill); background: var(--surface-c); color: var(--text); display: grid; place-items: center; border: none; cursor: pointer; }
    .icon-btn:active { transform: scale(0.92); }
    .header-text h1 { font-size: 1.85rem; font-weight: 700; letter-spacing: -0.5px; }
    .header-text p { color: var(--text-sub); font-size: 0.92rem; margin-top: 4px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action-card {
      background: var(--surface-c);
      border-radius: var(--radius-card);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .action-card:active { transform: scale(0.97); }
    .action-icon {
      background: var(--bg);
      color: var(--primary);
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
    }
    .action-card h3 { font-size: 0.95rem; font-weight: 600; }
    .action-card span { font-size: 0.76rem; color: var(--text-sub); line-height: 1.2; }
    .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-sub); font-weight: 700; margin-bottom: -8px; }
    .file-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
    .empty-state { padding: 28px 16px; text-align: center; background: var(--surface-c); border-radius: var(--radius-card); color: var(--text-sub); font-size: 0.85rem; }
    
    .file-card { background: var(--surface-c); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .file-card:active { background: var(--primary-c); color: var(--on-primary-c); }
    .file-card-info { flex: 1; overflow: hidden; }
    .file-card-name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
    .file-card-path { font-size: 0.72rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

    /* Badge d'extension stylisé par type */
    .ext-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .ext-html { background: rgba(255, 87, 34, 0.16); color: #ff5722; }
    .ext-css  { background: rgba(33, 150, 243, 0.16); color: #2196f3; }
    .ext-js   { background: rgba(255, 193, 7, 0.2); color: #ffb300; }
    .ext-py   { background: rgba(76, 175, 80, 0.16); color: #4caf50; }
    .ext-cpp  { background: rgba(156, 39, 176, 0.16); color: #ab47bc; }
    .ext-json { background: rgba(0, 150, 136, 0.16); color: #009688; }
    .ext-txt  { background: rgba(158, 158, 158, 0.16); color: #9e9e9e; }

    #view-runner { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: none; flex-direction: column; }
    #view-runner.open { display: flex; }
    .runner-shade {
      background: var(--shade);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--outline);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px;
      display: grid;
      grid-template-columns: 40px 1fr 40px;
      align-items: center;
      z-index: 1100;
    }
    .shade-btn { width: 38px; height: 38px; border-radius: var(--radius-pill); background: var(--surface-c); color: var(--text); display: grid; place-items: center; border: none; cursor: pointer; }
    .shade-btn:active { transform: scale(0.9); }
    #shade-search-btn { justify-self: end; visibility: hidden; pointer-events: none; }
    #shade-search-btn.visible { visibility: visible; pointer-events: auto; }
    .shade-center { display: flex; justify-content: center; align-items: center; }
    .shade-segmented { display: inline-flex; background: var(--surface-h); border-radius: var(--radius-pill); padding: 3px; }
    .shade-tab { border: none; background: transparent; padding: 6px 14px; border-radius: var(--radius-pill); font-size: 0.8rem; font-weight: 600; color: var(--text-sub); cursor: pointer; }
    .shade-tab.active { background: var(--primary); color: var(--on-primary); }

    #search-bar { display: none; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-c); border-bottom: 1px solid var(--outline); }
    #search-bar.active { display: flex; }
    .search-input-box { flex: 1; display: flex; align-items: center; background: var(--bg); border-radius: var(--radius-pill); padding: 0 12px; border: 1px solid var(--outline); }
    #search-input { flex: 1; border: none; background: transparent; padding: 7px 0; outline: none; font-size: 0.82rem; color: var(--text); user-select: text; -webkit-user-select: text; }
    #search-count { font-size: 0.72rem; color: var(--text-sub); font-weight: 600; padding-left: 6px; }
    .search-nav-btn { width: 32px; height: 32px; border-radius: var(--radius-pill); border: none; background: var(--surface-h); color: var(--text); display: grid; place-items: center; cursor: pointer; }

    .runner-body { flex: 1; position: relative; overflow: hidden; }
    iframe#app-frame { width: 100%; height: 100%; border: none; background: #ffffff; display: block; }
    #editor-pane { position: absolute; inset: 0; background: var(--editor-bg); display: none; flex-direction: column; }
    #editor-pane.active { display: flex; }
    .editor-toolbar { display: flex; flex-direction: column; gap: 5px; padding: 6px 8px; background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.08); width: 100%; }
    .toolbar-row { display: flex; width: 100%; gap: 5px; align-items: center; }
    .tool-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: none;
      padding: 7px 0;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
    }
    .tool-btn:active { background: rgba(255, 255, 255, 0.25); }
    .tool-btn.active-state { background: var(--primary) !important; color: var(--on-primary) !important; }
    .tool-btn-primary { background: var(--primary); color: var(--on-primary); flex: 1.1; }
    .tool-btn-sub { background: rgba(255, 255, 255, 0.08); color: #e0dced; }
    .save-indicator { font-size: 0.68rem; color: #a49fc0; font-weight: 500; padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
    .save-indicator-dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; display: inline-block; flex-shrink: 0; }
    .save-indicator-dot.syncing { background: #ff9800; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .editor-workspace { flex: 1; display: flex; position: relative; overflow: hidden; background: var(--editor-bg); }
    #gutter-bar { width: 44px; background: var(--gutter-bg); border-right: 1px solid rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; padding: 16px 0; touch-action: none; overflow: hidden; flex-shrink: 0; }
    .gutter-num { height: 22px; line-height: 22px; text-align: right; padding-right: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--gutter-fg); cursor: pointer; }
    .gutter-num.selected { background-color: var(--gutter-act-bg); color: var(--gutter-act-fg); font-weight: 700; }
    .editor-container { flex: 1; position: relative; overflow: auto; background: transparent; padding: 16px 16px 16px 12px; -webkit-overflow-scrolling: touch; }
    
    #code-area { min-height: 100%; outline: none; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 22px; color: var(--editor-fg); white-space: pre; user-select: text; -webkit-user-select: text; display: inline-block; min-width: 100%; cursor: text; }
    #code-area[contenteditable="false"] { cursor: default; }
    
    /* Classes de Coloration Syntaxique */
    .syn-k { color: var(--syn-keyword); font-weight: 600; }
    .syn-t { color: var(--syn-tag); }
    .syn-a { color: var(--syn-attr); }
    .syn-s { color: var(--syn-string); }
    .syn-c { color: var(--syn-comment); font-style: italic; }
    .syn-n { color: var(--syn-number); }
    .syn-p { color: var(--syn-prop); }

    mark.code-match { background-color: var(--hl-match); color: inherit; border-radius: 3px; }
    mark.code-match-active { background-color: var(--hl-act); color: #000; font-weight: 700; border-radius: 3px; }

    #toast-msg {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 500;
      z-index: 3000;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    #toast-msg.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <input type="file" id="filePicker" style="display: none;" accept=".html,.htm,.txt,.js,.css,.py,.cpp,.c,.json">
  <input type="file" id="folderPicker" webkitdirectory directory multiple style="display: none;">

  <!-- Page d'accueil Material You -->
  <main id="view-home">
    <div class="top-bar">
      <div class="badge-chip">Google Pixel • Material You</div>
      <div class="top-actions">
        <span class="version-badge">v1.7.0</span>
        <button class="icon-btn" id="btn-theme-toggle" aria-label="Changer de thème">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2V4a8 8 0 1 0 0 16z"/></svg>
        </button>
      </div>
    </div>

    <div class="header-text">
      <h1>Web Studio</h1>
      <p>Éditeur & Runner Smartphone Multi-Langages</p>
    </div>

    <div class="action-grid">
      <div class="action-card" id="btn-import-file">
        <div class="action-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
        </div>
        <h3>Fichier</h3>
        <span>iCloud / Local</span>
      </div>

      <div class="action-card" id="btn-import-folder">
        <div class="action-icon">
          <svg class="icon" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        </div>
        <h3>Dossier</h3>
        <span>Arborescence</span>
      </div>
    </div>

    <div class="section-title">Fichiers récents</div>

    <div class="file-list" id="fileList">
      <div class="empty-state" id="empty-state-msg">Importez un fichier ou un dossier pour commencer.</div>
    </div>
  </main>

  <!-- Runner / Éditeur Plein Écran -->
  <section id="view-runner">
    <header class="runner-shade">
      <button class="shade-btn" id="shade-back-btn" aria-label="Retour">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>

      <div class="shade-center">
        <div class="shade-segmented">
          <button class="shade-tab" id="tab-code">Coder</button>
          <button class="shade-tab active" id="tab-preview">Aperçu</button>
        </div>
      </div>

      <button class="shade-btn" id="shade-search-btn" aria-label="Rechercher">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </header>

    <div id="search-bar">
      <div class="search-input-box">
        <input type="text" id="search-input" placeholder="Rechercher…" autocomplete="off" autocapitalize="off">
        <span id="search-count">0/0</span>
      </div>
      <button class="search-nav-btn" id="search-prev" aria-label="Précédent">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
      <button class="search-nav-btn" id="search-next" aria-label="Suivant">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <button class="search-nav-btn" id="search-close" aria-label="Fermer">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <div class="runner-body">
      <iframe id="app-frame" sandbox="allow-scripts allow-modals allow-forms allow-same-origin allow-popups"></iframe>

      <div id="editor-pane">
        <div class="editor-toolbar">
          <div class="toolbar-row">
            <button class="tool-btn" id="btn-toggle-keyboard">
              <svg class="icon" viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
              <span>Clavier</span>
            </button>
            <button class="tool-btn" id="btn-select-all">Tout</button>
            <button class="tool-btn" id="btn-copy">Copier</button>
            <button class="tool-btn" id="btn-paste">Coller</button>
            <button class="tool-btn tool-btn-primary" id="btn-save">Sauveg.</button>
          </div>
          <div class="toolbar-row">
            <button class="tool-btn tool-btn-sub" id="btn-undo">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
              <span>Annuler</span>
            </button>
            <div class="save-indicator">
              <span class="save-indicator-dot" id="save-status-dot"></span>
              <span id="save-status-text">Synchronisé</span>
            </div>
          </div>
        </div>

        <div class="editor-workspace">
          <div id="gutter-bar"></div>
          <div class="editor-container" id="editor-scroll-box">
            <pre id="code-area" contenteditable="false" spellcheck="false" inputmode="none"></pre>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="toast-msg">Action effectuée</div>

  <script>
    const $ = id => document.getElementById(id);
    const fileStore = new Map();
    let curFileId = null, rawCode = "", isKeyboard = false;
    let autoSaveTimer = null, isAllSelected = false, selRange = null;
    const undoHist = [];

    const viewRunner = $('view-runner'), appFrame = $('app-frame'), editorPane = $('editor-pane');
    const codeArea = $('code-area'), gutterBar = $('gutter-bar'), scrollBox = $('editor-scroll-box');
    const fileList = $('fileList'), emptyMsg = $('empty-state-msg');
    const tabCode = $('tab-code'), tabPreview = $('tab-preview'), searchBtn = $('shade-search-btn');
    const btnKb = $('btn-toggle-keyboard'), saveDot = $('save-status-dot'), saveTxt = $('save-status-text');
    const toast = $('toast-msg');

    // Thème (Auto ⇄ Sombre ⇄ Clair en 1 clic)
    let curTheme = localStorage.getItem('app_theme') || 'auto';
    applyTheme(curTheme);

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('app_theme', t);
      curTheme = t;
    }

    $('btn-theme-toggle').onclick = () => {
      const nextTheme = curTheme === 'auto' ? 'dark' : (curTheme === 'dark' ? 'light' : 'auto');
      applyTheme(nextTheme);
      showToast(`Thème : ${nextTheme.toUpperCase()}`);
    };

    scrollBox.onscroll = () => { gutterBar.scrollTop = scrollBox.scrollTop; };

    // File Import Handlers
    $('btn-import-file').onclick = async () => {
      if (window.showOpenFilePicker) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'Fichiers Code', accept: { 'text/*': ['.html', '.htm', '.txt', '.css', '.js', '.py', '.cpp', '.c', '.json'] } }]
          });
          if (handle) {
            const f = await handle.getFile();
            await processFile(f, f.name, true, handle);
            return;
          }
        } catch (e) { if (e.name === 'AbortError') return; }
      }
      $('filePicker').click();
    };

    $('btn-import-folder').onclick = () => $('folderPicker').click();

    $('filePicker').onchange = async e => {
      const f = e.target.files[0];
      if (f) await processFile(f, f.name, true);
      e.target.value = '';
    };

    $('folderPicker').onchange = async e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      fileList.innerHTML = '';
      fileStore.clear();

      let targetId = null;
      for (const f of files) {
        if (f.name.startsWith('.')) continue;
        const id = await processFile(f, f.webkitRelativePath || f.name, false);
        if (!targetId && (f.name.endsWith('.html') || f.name.endsWith('.txt'))) targetId = id;
      }
      if (targetId) openFile(targetId);
      e.target.value = '';
    };

    function getExtClass(ext) {
      switch (ext) {
        case 'html': case 'htm': return 'ext-html';
        case 'css': return 'ext-css';
        case 'js': case 'jsx': case 'ts': return 'ext-js';
        case 'py': return 'ext-py';
        case 'cpp': case 'c': case 'h': case 'hpp': return 'ext-cpp';
        case 'json': return 'ext-json';
        default: return 'ext-txt';
      }
    }

    async function processFile(file, path, autoOpen = true, handle = null) {
      if (emptyMsg) emptyMsg.style.display = 'none';
      let name = file.name;
      const isTxt = name.endsWith('.txt');
      if (isTxt) name = name.replace(/\.txt$/i, '.html');

      const ext = name.split('.').pop().toLowerCase();
      const storageKey = 'cache_' + name;
      const cached = localStorage.getItem(storageKey);
      const rawText = await file.text();
      const content = cached !== null ? cached : rawText;
      const id = 'f_' + Math.random().toString(36).slice(2, 9);

      fileStore.set(id, { name, ext, path, content, handle, storageKey });

      const card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML = `
        <span class="ext-badge ${getExtClass(ext)}">${ext}</span>
        <div class="file-card-info">
          <div class="file-card-name">${name}</div>
          <div class="file-card-path">${path}${isTxt ? '• Converti HTML' : ''}</div>
        </div>
      `;
      card.onclick = () => openFile(id);
      fileList.prepend(card);

      if (autoOpen) openFile(id);
      return id;
    }

    function openFile(id) {
      const f = fileStore.get(id);
      if (!f) return;
      curFileId = id;
      rawCode = f.content;
      undoHist.length = 0;
      pushUndo(rawCode);

      disableKb();
      resetSel();
      applySyntaxHighlighting();
      renderGutter();
      setSaveStatus("Prêt");

      showPreview();
      renderFrame(rawCode);
      viewRunner.classList.add('open');
    }

    // Tabs
    tabCode.onclick = showCode;
    tabPreview.onclick = () => { disableKb(); syncDOM(); showPreview(); };

    function showCode() {
      tabCode.classList.add('active');
      tabPreview.classList.remove('active');
      editorPane.classList.add('active');
      appFrame.style.display = 'none';
      searchBtn.classList.add('visible');
      disableKb();
      applySyntaxHighlighting();
      renderGutter();
    }

    function showPreview() {
      tabPreview.classList.add('active');
      tabCode.classList.remove('active');
      editorPane.classList.remove('active');
      appFrame.style.display = 'block';
      searchBtn.classList.remove('visible');
      disableKb();
      closeSearch();
    }

    // Clavier réactif 1 tap
    function enableKb() {
      isKeyboard = true;
      btnKb.classList.add('active-state');
      btnKb.querySelector('span').textContent = 'Fermer';
      codeArea.textContent = rawCode; // Mode texte brut fluide pour saisie
      codeArea.setAttribute('contenteditable', 'true');
      codeArea.removeAttribute('inputmode');
      codeArea.focus();
    }

    function disableKb() {
      isKeyboard = false;
      btnKb.classList.remove('active-state');
      btnKb.querySelector('span').textContent = 'Clavier';
      codeArea.setAttribute('contenteditable', 'false');
      codeArea.setAttribute('inputmode', 'none');
      if (document.activeElement) document.activeElement.blur();
      applySyntaxHighlighting();
    }

    btnKb.onclick = e => {
      e.preventDefault();
      isKeyboard ? disableKb() : enableKb();
    };

    codeArea.onfocus = e => { if (!isKeyboard) { e.preventDefault(); codeArea.blur(); } };

    function resetSel() {
      isAllSelected = false;
      selRange = null;
      document.querySelectorAll('.gutter-num').forEach(el => el.classList.remove('selected'));
    }

    function renderGutter() {
      const lines = rawCode.split('\n');
      let html = '';
      for (let i = 1; i <= Math.max(1, lines.length); i++) html += `<div class="gutter-num" data-line="${i}">${i}</div>`;
      gutterBar.innerHTML = html;
      gutterBar.scrollTop = scrollBox.scrollTop;
    }

    /* MOTEUR DE COLORATION SYNTAXIQUE LÉGER (HTML, CSS, JS, Python, C++, C, JSON) */
    function applySyntaxHighlighting() {
      if (isKeyboard) return; // Reste en texte brut pendant la frappe active pour éviter les artefacts de curseur
      const f = curFileId ? fileStore.get(curFileId) : null;
      const ext = f?.ext || 'html';
      codeArea.innerHTML = highlightCode(rawCode, ext);
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightCode(code, ext) {
      if (!code) return '';

      // 1. HTML
      if (ext === 'html' || ext === 'htm') {
        return code.replace(/(<!--[\s\S]*?-->)|(<\/?[a-zA-Z0-9\-]+)|(\s+[a-zA-Z\-:]+(?=\=))|("[^"]*"|'[^']*')|(&[a-zA-Z0-9#]+;)/g, (m, c, t, a, s, e) => {
          if (c) return `<span class="syn-c">${escapeHtml(c)}</span>`;
          if (t) return `<span class="syn-t">${escapeHtml(t)}</span>`;
          if (a) return `<span class="syn-a">${escapeHtml(a)}</span>`;
          if (s) return `<span class="syn-s">${escapeHtml(s)}</span>`;
          if (e) return `<span class="syn-p">${escapeHtml(e)}</span>`;
          return escapeHtml(m);
        });
      }

      // 2. CSS
      if (ext === 'css') {
        return code.replace(/(\/\*[\s\S]*?\*\/)|([.#][\w-]+(?=[^{]*\{))|([\w-]+(?=\s*:))|("[^"]*"|'[^']*')|(#[\da-fA-F]{3,8}\b|\b\d+(?:px|rem|em|vh|vw|%)?)/g, (m, c, sel, prop, s, num) => {
          if (c) return `<span class="syn-c">${escapeHtml(c)}</span>`;
          if (sel) return `<span class="syn-k">${escapeHtml(sel)}</span>`;
          if (prop) return `<span class="syn-p">${escapeHtml(prop)}</span>`;
          if (s) return `<span class="syn-s">${escapeHtml(s)}</span>`;
          if (num) return `<span class="syn-n">${escapeHtml(num)}</span>`;
          return escapeHtml(m);
        });
      }

      // 3. JS, Python, C++, C, JSON
      const jsKw = /\b(const|let|var|function|return|if|else|for|while|import|export|from|class|new|async|await|try|catch|typeof)\b/g;
      const pyKw = /\b(def|return|if|elif|else|for|while|import|from|class|try|except|with|as|pass|in|is|not|and|or|lambda)\b/g;
      const cppKw = /\b(int|float|double|char|bool|void|class|struct|public|private|protected|template|typename|return|if|else|for|while|include)\b/g;

      let kw = jsKw;
      if (ext === 'py') kw = pyKw;
      if (ext === 'cpp' || ext === 'c' || ext === 'h' || ext === 'hpp') kw = cppKw;

      let safe = escapeHtml(code);
      // Commentaires & chaînes
      safe = safe.replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|#.*)/g, '<span class="syn-c">$1</span>');
      safe = safe.replace(/("[^"]*"|'[^']*'|`[^`]*`)/g, '<span class="syn-s">$1</span>');
      safe = safe.replace(kw, '<span class="syn-k">$1</span>');
      safe = safe.replace(/\b(\d+)\b/g, '<span class="syn-n">$1</span>');
      return safe;
    }

    // Auto-Scroll dynamique & sélection native (inchangé)
    let isDragging = false, dragStart = null, scrollRaf = null, touchY = 0;

    function startAutoScroll() {
      if (scrollRaf) return;
      const step = () => {
        if (!isDragging) { scrollRaf = null; return; }
        const r = scrollBox.getBoundingClientRect();
        const topTh = r.top + 95, botTh = r.bottom - 95;
        let speed = 0;

        if (touchY < topTh) {
          const ratio = Math.max(0, Math.min(1.4, (topTh - touchY) / 85));
          speed = -(8 + Math.pow(ratio, 2.2) * 65);
        } else if (touchY > botTh) {
          const ratio = Math.max(0, Math.min(1.4, (touchY - botTh) / 85));
          speed = (8 + Math.pow(ratio, 2.2) * 65);
        }

        if (speed !== 0) {
          scrollBox.scrollTop += speed;
          gutterBar.scrollTop = scrollBox.scrollTop;
          selectLines(dragStart, getLineFromY(touchY));
        }
        scrollRaf = requestAnimationFrame(step);
      };
      scrollRaf = requestAnimationFrame(step);
    }

    function getLineFromY(y) {
      const r = gutterBar.getBoundingClientRect();
      const line = Math.floor(((y - r.top) + scrollBox.scrollTop - 16) / 22) + 1;
      return Math.max(1, Math.min(line, rawCode.split('\n').length));
    }

    function selectLines(from, to) {
      const min = Math.min(from, to), max = Math.max(from, to);
      isAllSelected = false;
      selRange = { from: min, to: max };

      document.querySelectorAll('.gutter-num').forEach(el => {
        const l = +el.dataset.line;
        el.classList.toggle('selected', l >= min && l <= max);
      });

      const lines = rawCode.split('\n');
      let startChar = 0, endChar = 0;
      for (let i = 0; i < min - 1; i++) startChar += lines[i].length + 1;
      for (let i = 0; i < max; i++) endChar += lines[i].length + (i < lines.length - 1 ? 1 : 0);

      const sel = window.getSelection(), range = document.createRange();
      let curOffset = 0, sNode = null, sOff = 0, eNode = null, eOff = 0;
      const walker = document.createTreeWalker(codeArea, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        const next = curOffset + n.nodeValue.length;
        if (!sNode && startChar >= curOffset && startChar <= next) { sNode = n; sOff = startChar - curOffset; }
        if (!eNode && endChar >= curOffset && endChar <= next) { eNode = n; eOff = endChar - curOffset; break; }
        curOffset = next;
      }
      if (sNode && eNode) {
        range.setStart(sNode, sOff);
        range.setEnd(eNode, eOff);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    gutterBar.addEventListener('touchstart', e => {
      isDragging = true;
      disableKb();
      touchY = e.touches[0].clientY;
      dragStart = getLineFromY(touchY);
      selectLines(dragStart, dragStart);
      startAutoScroll();
    }, { passive: false });

    gutterBar.addEventListener('touchmove', e => {
      if (!isDragging) return;
      e.preventDefault();
      touchY = e.touches[0].clientY;
      selectLines(dragStart, getLineFromY(touchY));
    }, { passive: false });

    ['touchend', 'touchcancel'].forEach(ev => gutterBar.addEventListener(ev, () => {
      isDragging = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = null;
    }));

    // Presse-Papier & Undo
    $('btn-select-all').onclick = () => {
      disableKb();
      const r = document.createRange();
      r.selectNodeContents(codeArea);
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      isAllSelected = true;
      selRange = null;
      document.querySelectorAll('.gutter-num').forEach(el => el.classList.add('selected'));
      showToast("Tout sélectionné");
    };

    $('btn-copy').onclick = async () => {
      syncDOM();
      const s = window.getSelection().toString();
      try {
        await navigator.clipboard.writeText(s || rawCode);
        showToast(s ? "Lignes copiées" : "Tout copié");
      } catch { showToast("Erreur de copie"); }
    };

    $('btn-paste').onclick = async () => {
      let t = "";
      try { t = await navigator.clipboard.readText(); }
      catch { t = prompt("Collez le code :") || ""; }
      if (!t) return;

      pushUndo(rawCode);
      if (isAllSelected) {
        rawCode = t;
      } else if (selRange) {
        const l = rawCode.split('\n');
        rawCode = [...l.slice(0, selRange.from - 1), t, ...l.slice(selRange.to)].join('\n');
      } else {
        const s = window.getSelection();
        if (s.rangeCount > 0 && !s.isCollapsed) {
          s.getRangeAt(0).deleteContents();
          s.getRangeAt(0).insertNode(document.createTextNode(t));
          rawCode = codeArea.innerText.replace(/\r\n/g, '\n');
        } else {
          rawCode = t;
        }
      }
      applySyntaxHighlighting();
      resetSel();
      renderGutter();
      syncDOM();
      triggerAutoSave();
      showToast("Code collé");
    };

    function pushUndo(txt) {
      if (undoHist.length > 25) undoHist.shift();
      undoHist.push(txt);
    }

    $('btn-undo').onclick = () => {
      if (undoHist.length > 1) {
        undoHist.pop();
        rawCode = undoHist[undoHist.length - 1];
      } else if (undoHist.length === 1) {
        rawCode = undoHist[0];
      } else {
        showToast("Rien à annuler");
        return;
      }
      applySyntaxHighlighting();
      resetSel();
      renderGutter();
      syncDOM();
      triggerAutoSave();
      showToast("Annulé");
    };

    // Auto-Save Hybride (iCloud / Local)
    function setSaveStatus(txt, isSync = false) {
      saveTxt.textContent = txt;
      saveDot.classList.toggle('syncing', isSync);
    }

    function triggerAutoSave() {
      if (!curFileId) return;
      clearTimeout(autoSaveTimer);
      setSaveStatus("Sauvegarde…", true);

      autoSaveTimer = setTimeout(async () => {
        const f = fileStore.get(curFileId);
        if (!f) return;
        try { localStorage.setItem(f.storageKey, rawCode); } catch {}

        if (f.handle?.createWritable) {
          try {
            const w = await f.handle.createWritable();
            await w.write(rawCode);
            await w.close();
            setSaveStatus("iCloud à jour");
            return;
          } catch {}
        }
        setSaveStatus("Cache local à jour");
      }, 700);
    }

    $('btn-save').onclick = async () => {
      syncDOM();
      const f = curFileId ? fileStore.get(curFileId) : null;
      const filename = f?.name || 'index.html';

      if (f?.handle?.createWritable) {
        try {
          const w = await f.handle.createWritable();
          await w.write(rawCode);
          await w.close();
          setSaveStatus("iCloud à jour");
          showToast("Fichier iCloud enregistré");
          return;
        } catch {}
      }

      const fileObj = new File([rawCode], filename, { type: 'text/html;charset=utf-8' });
      if (navigator.canShare?.({ files: [fileObj] })) {
        try {
          await navigator.share({ files: [fileObj], title: filename });
          showToast("Fichier partagé");
          return;
        } catch (e) { if (e.name === 'AbortError') return; }
      }

      const blob = new Blob([rawCode], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Téléchargé");
    };

    let syncT = null;
    codeArea.oninput = () => {
      clearTimeout(syncT);
      syncT = setTimeout(() => {
        rawCode = codeArea.innerText.replace(/\r\n/g, '\n');
        pushUndo(rawCode);
        syncDOM();
        renderGutter();
        triggerAutoSave();
      }, 350);
    };

    function syncDOM() {
      if (!curFileId) return;
      rawCode = codeArea.innerText.replace(/\r\n/g, '\n');
      const f = fileStore.get(curFileId);
      if (f) f.content = rawCode;
      renderFrame(rawCode);
    }

    function renderFrame(h) {
      if (!h.includes('viewport')) {
        h = `<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"></head><body>${h}</body></html>`;
      }
      appFrame.srcdoc = h;
    }

    // Moteur de recherche
    const sBar = $('search-bar'), sInput = $('search-input'), sCount =$('search-count');
    let totalMatches = 0, matchIdx = 0;

    searchBtn.onclick = () => {
      sBar.classList.toggle('active');
      if (sBar.classList.contains('active')) { sInput.focus(); if (sInput.value) searchCode(); }
      else closeSearch();
    };

    $('search-close').onclick = closeSearch;

    function closeSearch() {
      sBar.classList.remove('active');
      sInput.value = '';
      sCount.textContent = '0/0';
      totalMatches = 0;
      applySyntaxHighlighting();
      renderGutter();
      sInput.blur();
    }

    sInput.oninput = () => { matchIdx = 0; searchCode(); };
    sInput.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); navSearch(1); } };
    $('search-next').onclick = () => navSearch(1);$('search-prev').onclick = () => navSearch(-1);

    function searchCode() {
      const q = sInput.value;
      if (!q) { applySyntaxHighlighting(); sCount.textContent = '0/0'; totalMatches = 0; renderGutter(); return; }

      const regex = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const matches = [...rawCode.matchAll(regex)];
      totalMatches = matches.length;
      if (!totalMatches) { applySyntaxHighlighting(); sCount.textContent = '0/0'; renderGutter(); return; }

      matchIdx = ((matchIdx % totalMatches) + totalMatches) % totalMatches;
      sCount.textContent = `${matchIdx + 1}/${totalMatches}`;

      let html = '', last = 0;
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      matches.forEach((m, i) => {
        html += esc(rawCode.slice(last, m.index));
        const matched = esc(rawCode.slice(m.index, m.index + m[0].length));
        html += `<mark class="code-match ${i === matchIdx ? 'code-match-active' : ''}" ${i === matchIdx ? 'id="cur-match"' : ''}>${matched}</mark>`;
        last = m.index + m[0].length;
      });
      html += esc(rawCode.slice(last));
      codeArea.innerHTML = html;
      renderGutter();

      const activeEl = $('cur-match');
      if (activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function navSearch(d) {
      if (!totalMatches) return;
      matchIdx += d;
      searchCode();
    }

    function showToast(m) {
      toast.textContent = m;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    $('shade-back-btn').onclick = () => {
      disableKb();
      viewRunner.classList.remove('open');
      closeSearch();
      setTimeout(() => { appFrame.srcdoc = ''; }, 150);
    };
  </script>
</body>
</html>
