<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafd" />
  <meta name="color-scheme" content="light dark" />
  <title>Budget Pixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --primary-container: #d3e3fd;
      --on-primary-container: #041e49;
      --secondary: #44546f;
      --on-secondary: #ffffff;
      --secondary-container: #dce3f2;
      --on-secondary-container: #111c2f;
      --tertiary: #3f6379;
      --tertiary-container: #cbe6f5;
      --on-tertiary-container: #071e2b;
      --surface: #f8fafd;
      --surface-dim: #d9dce2;
      --surface-bright: #f8fafd;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f3f6fb;
      --surface-container: #edf1f7;
      --surface-container-high: #e7ebf2;
      --surface-container-highest: #e0e5ec;
      --on-surface: #1b1b1f;
      --on-surface-variant: #44474e;
      --outline: #74777f;
      --outline-variant: #c4c7cf;
      --error: #b3261e;
      --on-error: #ffffff;
      --error-container: #f9dedc;
      --on-error-container: #410e0b;
      --success: #386a20;
      --success-container: #b8f397;
      --warning: #7a5900;
      --warning-container: #ffdea2;
      --shadow: rgba(0,0,0,.16);
      --scrim: rgba(0,0,0,.42);
      --radius-card: 24px;
      --radius-sheet: 28px;
      --radius-small: 16px;
      --pill: 9999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-height: 78px;
      --content-max: 760px;
    }

    html[data-theme="dark"] {
      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --primary-container: #0842a0;
      --on-primary-container: #d3e3fd;
      --secondary: #bcc7dc;
      --on-secondary: #263141;
      --secondary-container: #3c4858;
      --on-secondary-container: #dce3f2;
      --tertiary: #afcbe0;
      --tertiary-container: #294c60;
      --on-tertiary-container: #cbe6f5;
      --surface: #111318;
      --surface-dim: #111318;
      --surface-bright: #37393e;
      --surface-container-lowest: #0c0e12;
      --surface-container-low: #191c20;
      --surface-container: #1d2024;
      --surface-container-high: #272a2f;
      --surface-container-highest: #32353a;
      --on-surface: #e2e2e9;
      --on-surface-variant: #c4c7cf;
      --outline: #8e9199;
      --outline-variant: #44474e;
      --error: #f2b8b5;
      --on-error: #601410;
      --error-container: #8c1d18;
      --on-error-container: #f9dedc;
      --success: #9dd67c;
      --success-container: #22510d;
      --warning: #f4bd47;
      --warning-container: #5a4100;
      --shadow: rgba(0,0,0,.48);
      --scrim: rgba(0,0,0,.62);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--surface); }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--primary-container) 60%, transparent), transparent 34%),
        var(--surface);
      color: var(--on-surface);
      font-family: "Google Sans", "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
      outline-offset: 2px;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
    }

    .app-shell {
      width: min(100%, var(--content-max));
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-height) + 54px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(8px + var(--safe-top)) 18px 8px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    .brand { min-width: 0; flex: 1; }
    .top-account-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 65%, transparent);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--surface-container-lowest);
      color: var(--primary);
      cursor: pointer;
      box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 35%, transparent);
    }
    .top-account-btn:active { transform: scale(.94); }
    .top-account-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .account-letter { font-size: 21px; font-weight: 700; font-family: Arial, sans-serif; }
    .account-modal-profile { display:flex; align-items:center; gap:14px; padding:8px 2px 18px; }
    .account-modal-avatar { width:58px; height:58px; flex:0 0 58px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--primary-container); color:var(--on-primary-container); font-size:24px; font-weight:700; }
    .account-modal-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .account-modal-name { font-weight:700; font-size:17px; }
    .account-modal-email { margin-top:3px; color:var(--on-surface-variant); font-size:13px; overflow-wrap:anywhere; }
    .cloud-status { display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:18px; background:var(--surface-container); color:var(--on-surface-variant); font-size:13px; margin-bottom:14px; }
    .home-search-wrap { margin: 2px 0 18px; }
    .home-search-results { display:grid; gap:10px; margin-top:10px; }
    .search-result-type { font-size:11px; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
    .brand-eyebrow {
      margin: 0;
      color: var(--on-surface-variant);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .brand-title {
      margin: 0;
      font-size: clamp(23px, 6.7vw, 30px);
      font-weight: 700;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: var(--pill);
      display: grid;
      place-items: center;
      background: var(--surface-container-high);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:hover { background: var(--surface-container-highest); }

    main { padding: 10px 16px 20px; }
    .screen { display: none; animation: screenIn .22s ease; }
    .screen.active { display: block; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .section { margin: 18px 0 26px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }
    .section-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .section-subtitle {
      margin: 3px 0 0;
      color: var(--on-surface-variant);
      font-size: 13px;
    }

    .card {
      background: var(--surface-container-low);
      border-radius: var(--radius-card);
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--on-surface) 3%, transparent);
    }
    .card + .card { margin-top: 12px; }
    .hero-card {
      padding: 22px;
      background: linear-gradient(145deg, var(--primary-container), color-mix(in srgb, var(--primary-container) 54%, var(--surface-container-low)));
      border-color: transparent;
      overflow: hidden;
      position: relative;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      right: -92px;
      top: -112px;
      background: color-mix(in srgb, var(--primary) 11%, transparent);
      pointer-events: none;
    }
    .hero-card > * { position: relative; z-index: 1; }
    .hero-privacy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 42px;
      height: 42px;
      background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent);
      color: var(--on-primary-container);
    }
    .hero-label { color: var(--on-primary-container); font-size: 14px; font-weight: 600; }
    .hero-value {
      margin-top: 8px;
      color: var(--on-primary-container);
      font-size: clamp(38px, 12vw, 54px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.05em;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .daily-pill, .status-pill, .chip, .small-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: var(--pill);
      font-size: 13px;
      font-weight: 600;
    }
    .daily-pill { background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent); color: var(--on-surface); }
    .status-pill.neutral { background: var(--surface-container-highest); color: var(--on-surface-variant); }
    .status-pill.controlled { background: var(--success-container); color: var(--success); }
    .status-pill.tension { background: var(--warning-container); color: var(--warning); }
    .status-pill.deficit { background: var(--error-container); color: var(--on-error-container); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .metric-card { min-height: 118px; }
    .metric-label { color: var(--on-surface-variant); font-size: 13px; }
    .metric-value { margin-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
    .metric-note { margin-top: 6px; color: var(--on-surface-variant); font-size: 12px; }
    .home-summary-section { margin-top: 14px; margin-bottom: 18px; }
    .summary-card { padding: 18px; }
    .summary-card .hero-value { font-size: clamp(36px, 10vw, 48px); margin-top: 6px; }
    .summary-card .hero-meta { margin-top: 14px; gap: 8px; flex-wrap: nowrap; }
    .summary-card .daily-pill, .summary-card .status-pill { min-height: 32px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
    .summary-card .hero-privacy-btn { width: 40px; height: 40px; top: 12px; right: 12px; }
    .summary-bottom {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid color-mix(in srgb, var(--on-primary-container) 14%, transparent);
    }
    .summary-mini {
      min-width: 0;
      padding: 10px 12px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--surface-container-lowest) 58%, transparent);
    }
    .summary-mini-label { color: var(--on-surface-variant); font-size: 11px; font-weight: 600; }
    .summary-mini-value { display: block; margin-top: 3px; color: var(--on-primary-container); font-size: 19px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-mini-note { margin-top: 2px; color: var(--on-surface-variant); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary-card::after { display: none; }
    .balance-section-subtitle {
      white-space: nowrap;
      font-size: clamp(10.5px, 3.1vw, 12px);
      letter-spacing: -.01em;
    }
    .month-switcher {
      height: 46px;
      display: grid;
      grid-template-columns: 42px minmax(0,1fr) 42px;
      align-items: center;
      gap: 6px;
      padding: 3px 5px;
      margin: 4px 0 12px;
      border-radius: var(--pill);
      background: var(--surface-container-low);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 55%, transparent);
    }
    .month-switcher button {
      border: 0;
      background: transparent;
      color: var(--on-surface);
      cursor: pointer;
    }
    .month-arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .month-arrow:active { background: var(--surface-container-highest); }
    .month-current {
      min-width: 0;
      height: 38px;
      border-radius: var(--pill);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      text-transform: capitalize;
    }
    .month-current .material-symbols-outlined { font-size: 19px; color: var(--primary); }

    #entityModal[data-entity-type="expense"] .sheet {
      height: auto;
      max-height: min(52dvh, 610px);
    }
    #entityModal[data-entity-type="expense"] .sheet-head { padding-top: 5px; padding-bottom: 4px; }
    #entityModal[data-entity-type="expense"] .sheet-title { font-size: 20px; }
    #entityModal[data-entity-type="expense"] .sheet-body { flex: 0 1 auto; min-height: 0; padding-top: 2px; padding-bottom: 8px; }
    #entityModal[data-entity-type="expense"] .field { gap: 4px; margin: 7px 0; }
    #entityModal[data-entity-type="expense"] .field label { font-size: 12px; }
    #entityModal[data-entity-type="expense"] .field input,
    #entityModal[data-entity-type="expense"] .field select { min-height: 44px; padding: 8px 11px; border-radius: 15px; }
    #entityModal[data-entity-type="expense"] .field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    #entityModal[data-entity-type="expense"] .modal-actions { padding-top: 7px; }
    #entityModal[data-entity-type="expense"] .modal-actions .btn { min-height: 46px; }

    .progress-track {
      width: 100%;
      height: 9px;
      border-radius: var(--pill);
      background: var(--surface-container-highest);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--primary);
      transition: width .3s ease;
    }
    .progress-fill.warn { background: var(--warning); }
    .progress-fill.error { background: var(--error); }
    .progress-fill.success { background: var(--success); }

    .balance-row { margin: 15px 0; }
    .balance-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
    .balance-label { min-width:0; display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .balance-label strong { min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
    .target-badge { flex:0 0 auto; min-width:38px; padding:4px 7px; border-radius:var(--pill); background:var(--primary-container); color:var(--on-primary-container); font-size:11px; font-weight:700; text-align:center; }
    .balance-value { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-align:right; }
    .balance-pct { color:var(--on-surface-variant); font-size:12px; }

    .list { display: grid; gap: 10px; }
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 20px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
    }
    .list-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }
    .list-main { min-width: 0; flex: 1; }
    .list-title { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub { margin-top: 3px; color: var(--on-surface-variant); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-side { text-align: right; flex: 0 0 auto; }
    .list-amount { font-weight: 700; font-size: 15px; }
    .list-side small { display: block; margin-top: 4px; color: var(--on-surface-variant); font-size: 11px; }
    .item-actions { display: flex; gap: 5px; margin-left: 4px; }
    .mini-btn {
      border: 0;
      background: transparent;
      border-radius: var(--pill);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--on-surface-variant);
    }
    .mini-btn:hover { background: var(--surface-container-highest); color: var(--on-surface); }
    .mini-btn .material-symbols-outlined { font-size: 20px; }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      border-radius: var(--radius-card);
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
    }
    .empty-state .material-symbols-outlined { font-size: 36px; margin-bottom: 8px; color: var(--primary); }
    .empty-state strong { display: block; color: var(--on-surface); margin-bottom: 5px; }

    .search-shell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 50px;
      padding: 7px 8px 7px 16px;
      background: var(--surface-container-high);
      border-radius: var(--pill);
      border: 1px solid transparent;
    }
    .search-shell:focus-within { border-color: var(--primary); }
    .search-shell input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--on-surface);
      background: transparent;
      font-size: 15px;
    }
    .search-shell input::placeholder { color: var(--on-surface-variant); }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 1px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--outline-variant);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px;
      gap: 4px;
      border-radius: var(--pill);
      background: var(--surface-container-high);
    }
    .segmented button {
      min-height: 42px;
      border: 0;
      border-radius: var(--pill);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .segmented button.active { background: var(--primary-container); color: var(--on-primary-container); }

    .btn {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 650;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
    .btn.danger { background: var(--error-container); color: var(--on-error-container); }
    .btn.small { min-height: 38px; padding: 0 13px; font-size: 13px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .backup-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .backup-actions .btn { min-width:0; min-height:48px; padding:0 8px; gap:5px; white-space:nowrap; font-size:12px; }
    .backup-actions .btn .material-symbols-outlined { font-size:20px; }

    .nav-wrap {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: var(--safe-bottom);
      transform: translateX(-50%);
      width: min(calc(100% - 20px), 720px);
      pointer-events: none;
    }
    .bottom-nav {
      height: calc(var(--nav-height) - 4px);
      padding: 6px 10px;
      border-radius: 32px;
      background: color-mix(in srgb, var(--surface-container-high) 94%, transparent);
      box-shadow: 0 14px 36px var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--outline-variant) 45%, transparent);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      pointer-events: auto;
    }
    .nav-btn {
      height: 58px;
      border: 0;
      background: transparent;
      border-radius: 22px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      color: var(--on-surface-variant);
      cursor: pointer;

          <button class="month-arrow" type="button" data-month-shift="1" aria-label="Mois suivant"><span class="material-symbols-outlined">chevron_right</span></button>
        </div>`;
    }


    function openMonthPicker() {
      const [year] = selectedMonth.split("-").map(Number);
      monthPickerYear = year || new Date().getFullYear();
      let modal = document.getElementById("monthPickerModal");
      if (!modal) {
        document.body.insertAdjacentHTML("beforeend", `
          <div class="sheet-backdrop" id="monthPickerModal" role="dialog" aria-modal="true" aria-labelledby="monthPickerTitle">
            <div class="sheet month-picker-sheet">
              <div class="sheet-handle"></div>
              <div class="sheet-head">
                <h2 class="sheet-title" id="monthPickerTitle">Choisir un mois</h2>
                <button class="icon-btn" data-close-modal="monthPickerModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>
              </div>
              <div class="sheet-body" id="monthPickerBody"></div>
            </div>
          </div>`);
        modal = document.getElementById("monthPickerModal");
      }
      renderMonthPicker();
      modal.classList.add("open");
    }

    function renderMonthPicker() {
      const body = document.getElementById("monthPickerBody");
      if (!body) return;
      const currentMonthIndex = Number(selectedMonth.slice(5, 7)) - 1;
      const selectedYear = Number(selectedMonth.slice(0, 4));
      const labels = Array.from({ length: 12 }, (_, index) => new Intl.DateTimeFormat("fr-FR", { month: "long" }).format(new Date(2026, index, 1)));
      body.innerHTML = `
        <div class="month-picker-year-row">
          <button class="month-picker-year-btn" data-picker-year="-1" aria-label="Année précédente"><span class="material-symbols-outlined">chevron_left</span></button>
          <strong>${monthPickerYear}</strong>
          <button class="month-picker-year-btn" data-picker-year="1" aria-label="Année suivante"><span class="material-symbols-outlined">chevron_right</span></button>
        </div>
        <div class="month-picker-grid">
          ${labels.map((label, index) => {
            const active = monthPickerYear === selectedYear && index === currentMonthIndex;
            return `<button class="month-picker-option ${active ? "active" : ""}" data-picker-month="${index}">${escapeHtml(label)}</button>`;
          }).join("")}
        </div>`;
    }

    function formatMoney(value) {
      return euro.format(safeNumber(value));
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(`${value}T12:00:00`);
      return Number.isNaN(d.getTime()) ? "—" : shortDate.format(d);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return EMPTY_STATE();
        const parsed = JSON.parse(raw);
        return migrateState(parsed);
      } catch (error) {
        console.error("Chargement localStorage impossible", error);
        return EMPTY_STATE();
      }
    }

    function migrateState(input) {
      const base = EMPTY_STATE();
      if (!input || typeof input !== "object") return base;
      const output = {
        ...base,
        ...input,
        version: STATE_VERSION,
        settings: { ...base.settings, ...(input.settings || {}) },
        incomes: Array.isArray(input.incomes) ? input.incomes.map(item => ({ ...item, category: item.category || "Salaire" })) : [],
        expenses: Array.isArray(input.expenses) ? input.expenses : [],
        fixedCharges: Array.isArray(input.fixedCharges) ? input.fixedCharges : [],
        credits: Array.isArray(input.credits) ? input.credits : [],
        projects: Array.isArray(input.projects) ? input.projects : [],
        envelopes: Array.isArray(input.envelopes) ? input.envelopes : []
      };
      output.fixedCharges = output.fixedCharges.map(item => ({ ...item, paidMonths: Array.isArray(item.paidMonths) ? item.paidMonths : [] }));
      return output;
    }

    function saveState(message = "") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!applyingCloudState) scheduleCloudSave();
      if (message) showSnackbar(message);
      renderAll();
    }


    function isFirebaseConfigured() {
      const cfg = window.BUDGET_FIREBASE_CONFIG;
      return !!(cfg && cfg.apiKey && cfg.authDomain && cfg.projectId && cfg.appId);
    }

    function hasMeaningfulData(candidate) {
      if (!candidate) return false;
      return ["incomes", "expenses", "fixedCharges", "credits", "projects", "envelopes"]
        .some(key => Array.isArray(candidate[key]) && candidate[key].length > 0);
    }

    function initCloudSync() {
      if (cloud) return Promise.resolve(cloud);
      if (cloudInitPromise) return cloudInitPromise;
      if (!isFirebaseConfigured()) {
        renderProfile();
        return Promise.resolve(null);
      }

      cloudInitPromise = (async () => {
        try {
          const [appMod, authMod, storeMod] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js")
          ]);
          const app = appMod.initializeApp(window.BUDGET_FIREBASE_CONFIG);
          const auth = authMod.getAuth(app);
          const db = storeMod.getFirestore(app);
          const provider = new authMod.GoogleAuthProvider();
          cloud = { auth, db, provider, authMod, storeMod };

          authMod.onAuthStateChanged(auth, async user => {
            cloudUser = user || null;
            renderProfile();
            updateTopAccountButton();
            renderAccountModal();
            if (cloudUser) await reconcileCloudState();
          });
          return cloud;
        } catch (error) {
          console.error("Initialisation Firebase impossible", error);
          showSnackbar("Connexion cloud indisponible pour le moment.");
          return null;
        } finally {
          cloudInitPromise = null;
        }
      })();

      return cloudInitPromise;
    }

    function scheduleCloudSave() {
      if (!cloud || !cloudUser) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => writeCloudState().catch(error => {
        console.error("Synchronisation cloud impossible", error);
        showSnackbar("La sauvegarde cloud a échoué. Les données locales sont conservées.");
      }), 450);
    }

    async function writeCloudState() {
      if (!cloud || !cloudUser) return;
      const { doc, setDoc, serverTimestamp } = cloud.storeMod;
      await setDoc(doc(cloud.db, "budgetUsers", cloudUser.uid), {
        state,
        schemaVersion: STATE_VERSION,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function reconcileCloudState() {
      if (!cloud || !cloudUser) return;
      const { doc, getDoc } = cloud.storeMod;
      const ref = doc(cloud.db, "budgetUsers", cloudUser.uid);
      const snap = await getDoc(ref);
      if (!snap.exists() || !snap.data()?.state) {
        await writeCloudState();
        showSnackbar("Compte Google connecté. Les données locales sont sauvegardées en ligne.");
        return;
      }

      const remote = migrateState(snap.data().state);

      // Dès qu'une sauvegarde Firebase existe, elle devient la source de vérité.
      // Aucun dialogue de conflit : les données cloud sont chargées automatiquement.
      applyingCloudState = true;
      state = remote;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyingCloudState = false;
      renderAll();
    }

    function firebaseAuthErrorMessage(error) {
      const code = error?.code || "";
      if (code === "auth/unauthorized-domain") return "Domaine non autorisé dans Firebase Authentication.";
      if (code === "auth/operation-not-allowed") return "Connexion Google non activée dans Firebase Authentication.";
      if (code === "auth/popup-blocked") return "La fenêtre Google a été bloquée par le navigateur.";
      if (code === "auth/popup-closed-by-user") return "Connexion Google annulée.";
      if (code === "auth/network-request-failed") return "Erreur réseau pendant la connexion Google.";
      return code ? `Connexion Google impossible (${code}).` : "Connexion Google impossible.";
    }

    async function signInWithGoogle() {
      const readyCloud = cloud || await initCloudSync();
      if (!readyCloud) {
        showSnackbar("Connexion Google indisponible pour le moment.");
        return;
      }
      try {
        await readyCloud.authMod.signInWithPopup(readyCloud.auth, readyCloud.provider);
      } catch (error) {
        console.error("Connexion Google impossible", error);
        showSnackbar(firebaseAuthErrorMessage(error));
      }
    }

    async function signOutGoogle() {
      if (!cloud) return;
      await cloud.authMod.signOut(cloud.auth);
      cloudUser = null;
      renderProfile();
      updateTopAccountButton();
      showSnackbar("Compte Google déconnecté. Les données locales restent sur cet appareil.");
    }

    function applyTheme() {
      const chosen = state.settings.theme || "auto";
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const effective = chosen === "auto" ? (systemDark ? "dark" : "light") : chosen;
      document.documentElement.dataset.theme = effective;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", effective === "dark" ? "#111318" : "#f8fafd");
    }

    function applyPrivacy() {
      document.body.classList.toggle("privacy", !!state.settings.privacy);
      const icon = document.getElementById("privacyIcon");
      const btn = document.getElementById("privacyBtn");
      if (icon) icon.textContent = state.settings.privacy ? "visibility_off" : "visibility";
      if (btn) {
        btn.setAttribute("aria-label", state.settings.privacy ? "Afficher les montants" : "Masquer les montants");
        btn.title = state.settings.privacy ? "Afficher les montants" : "Masquer les montants";
      }
    }

    function updateTopAccountButton() {
      const btn = document.getElementById("accountBtn");
      if (!btn) return;

        btn.innerHTML = photo ? `<img src="${photo}" alt="">` : `<span class="material-symbols-outlined">account_circle</span>`;

        btn.innerHTML = `<span class="account-letter">G</span>`;

      document.querySelectorAll('#settingsModal [data-theme-choice]').forEach(btn => {

      });
    }

    function renderAccountModal() {
      const body = document.getElementById("accountModalBody");
      if (!body) return;
      if (cloudUser) {
        const photo = cloudUser.photoURL ? `<img src="${escapeHtml(cloudUser.photoURL)}" alt="">` : `<span class="material-symbols-outlined">person</span>`;
        const name = escapeHtml(cloudUser.displayName || "Compte Google");

          </div>

          <button class="btn outlined full" id="accountSignOutBtn"><span class="material-symbols-outlined">logout</span>Se déconnecter</button>`;
      } else {

          </div>
          <button class="btn primary full" id="accountSignInBtn"><span class="material-symbols-outlined">login</span>Se connecter avec Google</button>`;
      }
    }

    function sum(list, selector = x => x) {
      return list.reduce((total, item) => total + safeNumber(selector(item)), 0);
    }

    function currentMonthIncomes() {
      return state.incomes.filter(item => isCurrentMonth(item.date));
    }

    function currentMonthExpenses() {
      return state.expenses.filter(item => isCurrentMonth(item.date));
    }

    function activeFixedCharges() {
      return state.fixedCharges.filter(item => item.active !== false);
    }

    function activeCredits() {
      return state.credits.filter(item => item.active !== false);
    }

    function activeProjects() {
      return state.projects.filter(item => item.active !== false);
    }

    function financialSnapshot() {
      const income = sum(currentMonthIncomes(), x => x.amount);
      const expenses = sum(currentMonthExpenses(), x => x.amount);
      const fixed = sum(activeFixedCharges(), x => x.amount);
      const credits = sum(activeCredits(), x => x.monthlyPayment);
      const projects = sum(activeProjects(), x => x.monthlyAllocation);
      const engaged = fixed + credits + projects + expenses;
      const remaining = income - engaged;
      const daily = expenses / averageDayCount();

      return {
        income, expenses, fixed, credits, projects, engaged, remaining, daily,
        buckets: {
          needs: fixed + credits,
          wants: expenses,
          savings: Math.max(0, remaining)
        }
      };
    }

    function defaultBucketForCategory(category) {
      return ["Loisirs", "Restaurant"].includes(category) ? "wants" : "needs";
    }

    function financialStatus(snapshot) {
      if (snapshot.income === 0 && snapshot.engaged === 0) return { key: "neutral", label: "Neutre", icon: "horizontal_rule" };
      if (snapshot.remaining < 0 || (snapshot.income === 0 && snapshot.engaged > 0)) return { key: "deficit", label: "Déficit", icon: "trending_down" };
      if (snapshot.income > 0 && snapshot.remaining / snapshot.income < 0.15) return { key: "tension", label: "Tension", icon: "warning" };
      return { key: "controlled", label: "Maîtrisé", icon: "verified" };
    }

    function emptyState(icon, title, text) {
      return `<div class="empty-state"><span class="material-symbols-outlined">${icon}</span><strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span></div>`;
    }

    function renderAll() {
      applyTheme();
      renderHome();
      renderIncome();
      renderExpenses();
      renderProfile();
      applyPrivacy();
      updateTopAccountButton();
      updateSettingsUI();
      setCurrentScreen(currentScreen, false);
    }

    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function globalSearchResults(query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const amountTokens = value => {
        const n = safeNumber(value);
        return [String(n), n.toFixed(2), String(n).replace(".", ","), n.toFixed(2).replace(".", ","), formatMoney(n)];
      };
      const rows = [];
      state.expenses.forEach(item => rows.push({
        type: "expense", id: item.id, icon: categoryIcon(item.category), kind: "Dépense", title: item.label,
        subtitle: `${item.category} · ${formatDate(item.date)}`, amount: -safeNumber(item.amount),
        haystack: [item.label, item.category, item.date, "dépense", "depense", ...amountTokens(item.amount)].join(" ")
      }));
      state.incomes.forEach(item => rows.push({
        type: "income", id: item.id, icon: "payments", kind: "Revenu", title: item.label,
        subtitle: `${item.category || "Salaire"} · ${formatDate(item.date)}`, amount: safeNumber(item.amount),
        haystack: [item.label, item.category || "Salaire", item.date, "revenu", ...amountTokens(item.amount)].join(" ")
      }));
      state.fixedCharges.forEach(item => rows.push({
        type: "fixed", id: item.id, icon: "event_repeat", kind: "Charge fixe", title: item.label,
        subtitle: `Jour ${safeNumber(item.day, 1)}`, amount: -safeNumber(item.amount),
        haystack: [item.label, "charge fixe", "charges fixes", item.day, ...amountTokens(item.amount)].join(" ")
      }));
      state.credits.forEach(item => rows.push({
        type: "credit", id: item.id, icon: "credit_card", kind: "Crédit", title: item.name,
        subtitle: `Mensualité ${formatMoney(item.monthlyPayment)}`, amount: -safeNumber(item.monthlyPayment),
        haystack: [item.name, "crédit", "credit", "mensualité", "mensualite", ...amountTokens(item.monthlyPayment)].join(" ")
      }));
      return rows.filter(row => normalizeSearch(row.haystack).includes(q)).slice(0, 50);
    }

    function renderGlobalSearchResults(query) {
      const results = globalSearchResults(query);
      if (!normalizeSearch(query)) return "";
      if (!results.length) return `<div class="empty-state" style="margin-top:10px"><span class="material-symbols-outlined">search_off</span><strong>Aucun résultat</strong><span>Essaie un libellé, une catégorie ou un montant.</span></div>`;
      return `<div class="home-search-results">${results.map(row => `
        <button class="list-item" data-edit-type="${row.type}" data-edit-id="${row.id}" style="width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer">
          <div class="list-icon"><span class="material-symbols-outlined">${row.icon}</span></div>
          <div class="list-main"><div class="search-result-type">${row.kind}</div><div class="list-title">${escapeHtml(row.title)}</div><div class="list-sub">${escapeHtml(row.subtitle)}</div></div>
          <div class="list-side"><div class="list-amount money ${row.amount < 0 ? "negative" : "positive"}">${row.amount < 0 ? "−" : "+"}${formatMoney(Math.abs(row.amount))}</div></div>
        </button>`).join("")}</div>`;
    }

            </div>
            <div class="item-actions"><button class="mini-btn" data-edit-type="fixed" data-edit-id="${charge.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button></div>
          </div>`;
      }).join("") : emptyState("calendar_month", "Aucune charge fixe", "Ajoute tes charges récurrentes pour obtenir un reste à vivre précis.");

      container.innerHTML = `
        <div class="home-search-wrap">
          <div class="search-shell">
            <span class="material-symbols-outlined">search</span>
            <input id="globalSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="Rechercher catégorie, opération, montant…" value="${escapeHtml(globalSearch)}">
            <button class="icon-btn ${globalSearch ? "" : "hidden"}" id="globalSearchClear" type="button" aria-label="Effacer la recherche"><span class="material-symbols-outlined">close</span></button>
          </div>
          ${renderGlobalSearchResults(globalSearch)}
        </div>
        ${renderMonthSwitcher()}

        <div class="section home-summary-section">
          <div class="card hero-card summary-card">
            <button class="icon-btn hero-privacy-btn" id="privacyBtn" type="button" aria-label="Masquer les montants" title="Masquer les montants"><span class="material-symbols-outlined" id="privacyIcon">visibility</span></button>
            <div class="hero-label">Reste à vivre ce mois-ci</div>
            <div class="hero-value money">${formatMoney(s.remaining)}</div>
            <div class="hero-meta">
              <span class="daily-pill"><span class="material-symbols-outlined">monitoring</span>Dépenses moy. <span class="money">${formatMoney(s.daily)}</span>/jour</span>
              <span class="status-pill ${status.key}"><span class="material-symbols-outlined">${status.icon}</span>${status.label}</span>
            </div>
            <div class="summary-bottom">
              <div class="summary-mini">
                <span class="summary-mini-label">Revenus</span>
                <strong class="summary-mini-value money">${formatMoney(s.income)}</strong>
                <div class="summary-mini-note">Ce mois</div>
              </div>
              <div class="summary-mini">
                <span class="summary-mini-label">Dépenses</span>
                <strong class="summary-mini-value money">${formatMoney(s.engaged)}</strong>
                <div class="summary-mini-note">Total du mois</div>

            </div>

        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Équilibre 50 / 30 / 20</h2><p class="section-subtitle balance-section-subtitle">50% fixes · 30% quotidien · 20% disponible</p></div></div>
          <div class="card">${bucketCards}</div>

          </div>
          <div class="list">${chargesHtml}</div>
        </div>`;

      const searchInput = document.getElementById("globalSearchInput");
      if (searchInput) {
        searchInput.addEventListener("input", event => {
          globalSearch = event.target.value;

          });
        });

    function renderIncome() {

      const items = [...currentMonthIncomes()].sort((a,b) => String(b.date).localeCompare(String(a.date)));
      const currentTotal = sum(currentMonthIncomes(), x => x.amount);
      const listHtml = items.length ? items.map(item => `
        <div class="list-item">

            <div class="list-title">${escapeHtml(item.label)}</div>

    function estimateRemainingBalance(principal, annualRate, monthlyPayment, monthsPaid) {
      let balance = Math.max(0, safeNumber(principal));
      const payment = Math.max(0, safeNumber(monthlyPayment));
      const paid = Math.max(0, Math.round(safeNumber(monthsPaid)));
      const monthlyRate = Math.max(0, safeNumber(annualRate)) / 100 / 12;
      if (!payment || !paid) return balance;
      for (let i = 0; i < paid && balance > 0.005; i += 1) {
        const interest = balance * monthlyRate;
        const principalPaid = Math.max(0, payment - interest);
        if (principalPaid <= 0) break;
        balance -= Math.min(balance, principalPaid);
      }
      return Math.max(0, balance);
    }

    function creditProgress(credit) {
      const durationMonths = Math.max(0, Math.round(safeNumber(credit.durationMonths)));
      const monthsPaid = durationMonths > 0
        ? clamp(Math.round(safeNumber(credit.monthsPaid)), 0, durationMonths)
        : Math.max(0, Math.round(safeNumber(credit.monthsPaid)));
      const remainingPayments = durationMonths > 0 ? Math.max(0, durationMonths - monthsPaid) : null;
      const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);
      const calculatedBalance = durationMonths > 0
        ? estimateRemainingBalance(credit.principal, rate, credit.monthlyPayment, monthsPaid)
        : safeNumber(credit.balance);
      return { durationMonths, monthsPaid, remainingPayments, calculatedBalance };
    }

        item = { id: id || uid("inc"), label: String(fd.get("label") || "").trim(), amount: safeNumber(fd.get("amount")), date: fd.get("date") || todayISO(), category: fd.get("category") || "Salaire" };
      } else if (type === "fixed") {
        item = {
          id: id || uid("fix"), label: String(fd.get("label") || "").trim(), amount: safeNumber(fd.get("amount")),
          day: clamp(Math.round(safeNumber(fd.get("day"), 1)), 1, 31), bucket: "needs", active: true,
          paidMonths: current?.paidMonths || []
        };
      } else if (type === "credit") {
        const zeroRate = fd.get("zeroRate") === "on";
        const principal = safeNumber(fd.get("principal"));
        const monthlyPayment = safeNumber(fd.get("monthlyPayment"));
        const durationMonths = clamp(Math.round(safeNumber(fd.get("durationMonths"), 1)), 1, 600);
        const monthsPaid = clamp(Math.round(safeNumber(fd.get("monthsPaid"), 0)), 0, durationMonths);
        const annualRate = zeroRate ? 0 : safeNumber(fd.get("annualRate"));
        const balance = estimateRemainingBalance(principal, annualRate, monthlyPayment, monthsPaid);
        item = {
          id: id || uid("crd"), name: String(fd.get("name") || "").trim(), principal, balance,
          durationMonths, monthsPaid, zeroRate, annualRate, monthlyPayment, active: fd.get("active") === "on"
        };
      } else if (type === "project") {
        item = {
          id: id || uid("prj"), name: String(fd.get("name") || "").trim(), target: safeNumber(fd.get("target")), current: safeNumber(fd.get("current")),
          monthlyAllocation: safeNumber(fd.get("monthlyAllocation")), active: fd.get("active") === "on"
        };
      } else if (type === "envelope") {
        item = { id: id || uid("env"), name: String(fd.get("name") || "").trim(), category: fd.get("category") || "Toutes", limit: safeNumber(fd.get("limit")) };
      } else return;

      const collection = collectionForType(type);
      if (!collection) return;
      if (id) {
        const idx = state[collection].findIndex(x => x.id === id);
        if (idx >= 0) state[collection][idx] = item;
      } else {
        state[collection].push(item);
      }
      closeModal("entityModal");
      saveState(`${entityLabel(type)} ${id ? "modifié" : "ajouté"}.`);
    }

    function deleteEntity(type, id) {
      const collection = collectionForType(type);
      if (!collection) return;
      const item = getEntity(type, id);
      if (!item) return;
      if (!confirm(`Supprimer définitivement « ${item.label || item.name || entityLabel(type)} » ?`)) return;
      state[collection] = state[collection].filter(x => x.id !== id);
      closeModal("entityModal");
      saveState(`${entityLabel(type)} supprimé.`);
    }

    function toggleChargePaid(id) {
      const charge = state.fixedCharges.find(x => x.id === id);
      if (!charge) return;
      const mk = selectedMonth;
      charge.paidMonths = Array.isArray(charge.paidMonths) ? charge.paidMonths : [];
      if (charge.paidMonths.includes(mk)) charge.paidMonths = charge.paidMonths.filter(x => x !== mk);
      else charge.paidMonths.push(mk);
      saveState(charge.paidMonths.includes(mk) ? "Charge marquée comme prélevée." : "Charge marquée comme à venir.");
    }

    function amortization(balance, annualRate, monthlyPayment, extra = 0) {
      let principal = Math.max(0, safeNumber(balance));
      const rate = Math.max(0, safeNumber(annualRate)) / 100 / 12;
      const payment = Math.max(0, safeNumber(monthlyPayment) + safeNumber(extra));
      if (principal <= 0) return { valid: true, months: 0, interest: 0, totalPaid: 0 };
      if (payment <= 0) return { valid: false, reason: "Mensualité insuffisante" };

      if (rate === 0) {
        const months = Math.ceil(principal / payment);
        return { valid: true, months, interest: 0, totalPaid: principal };
      }

      if (payment <= principal * rate) return { valid: false, reason: "La mensualité ne couvre pas les intérêts mensuels." };

      let months = 0;
      let interestTotal = 0;
      let guard = 0;
      while (principal > 0.005 && guard < 2400) {
        const interest = principal * rate;
        interestTotal += interest;
        const capitalPaid = Math.max(0, payment - interest);
        if (capitalPaid <= 0) return { valid: false, reason: "Amortissement impossible avec cette mensualité." };
        principal -= Math.min(principal, capitalPaid);
        months += 1;
        guard += 1;
      }
      if (guard >= 2400) return { valid: false, reason: "Durée supérieure à 200 ans." };
      return { valid: true, months, interest: interestTotal, totalPaid: safeNumber(balance) + interestTotal };
    }

    function openCreditSimulator(id) {
      const credit = state.credits.find(x => x.id === id);
      if (!credit) return;
      const body = document.getElementById("creditSimBody");
      body.dataset.creditId = id;
      body.innerHTML = `
        <div class="card">
          <div class="section-header" style="margin:0 0 6px"><div><h3 class="section-title">${escapeHtml(credit.name)}</h3><p class="section-subtitle">Capital restant : <span class="money">${formatMoney(credit.balance)}</span></p></div></div>
          <div class="range-row">
            <div class="balance-head"><strong>Surplus mensuel</strong><span class="money" id="extraPaymentLabel">${formatMoney(0)}</span></div>
            <input id="extraPaymentRange" type="range" min="0" max="${Math.max(100, Math.ceil(Math.max(safeNumber(credit.monthlyPayment) * 3, safeNumber(credit.balance) / 12, 100) / 50) * 50)}" step="10" value="0">
          </div>
          <div id="simResults"></div>
        </div>
        <div class="tiny" style="margin-top:12px">Simulation indicative basée sur le capital restant, le taux annuel et la mensualité saisis. Aucun frais, assurance ou pénalité contractuelle n'est ajouté.</div>`;
      const range = document.getElementById("extraPaymentRange");
      range.addEventListener("input", () => updateCreditSimulation(credit, safeNumber(range.value)));
      updateCreditSimulation(credit, 0);
      openModal("creditSimModal");
    }

    function updateCreditSimulation(credit, extra) {
      document.getElementById("extraPaymentLabel").textContent = formatMoney(extra);
      const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);
      const base = amortization(credit.balance, rate, credit.monthlyPayment, 0);
      const boosted = amortization(credit.balance, rate, credit.monthlyPayment, extra);
      const box = document.getElementById("simResults");
      if (!base.valid || !boosted.valid) {
        box.innerHTML = `<div class="card danger-zone"><strong>Simulation impossible</strong><div class="tiny" style="margin-top:6px">${escapeHtml(boosted.reason || base.reason || "Vérifie les informations du crédit.")}</div></div>`;
        return;
      }
      const monthsSaved = Math.max(0, base.months - boosted.months);
      const interestSaved = Math.max(0, base.interest - boosted.interest);
      box.innerHTML = `
        <div class="sim-grid">
          <div class="sim-box"><span>Durée avec surplus</span><strong>${boosted.months} mois</strong></div>
          <div class="sim-box"><span>Mois gagnés</span><strong>${monthsSaved}</strong></div>
          <div class="sim-box"><span>Intérêts estimés</span><strong class="money">${formatMoney(boosted.interest)}</strong></div>
          <div class="sim-box"><span>Intérêts économisés</span><strong class="money positive">${formatMoney(interestSaved)}</strong></div>
        </div>`;
    }

    function exportJSON() {
      const payload = { ...state, exportedAt: new Date().toISOString() };
      downloadBlob(`budget-${todayISO()}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      showSnackbar("Sauvegarde JSON exportée.");
    }

    function csvEscape(value) {
      const str = String(value ?? "");
      return /[;"\n\r]/.test(str) ? `"${str.replaceAll('"', '""')}"` : str;
    }

    function exportCSV() {
      const headers = ["type","id","libelle","montant","date","categorie","affectation","jour","actif","capital_initial","capital_restant","taux_annuel","mensualite","objectif","epargne_actuelle","allocation_mensuelle","plafond"];
      const rows = [];
      state.expenses.forEach(x => rows.push(["depense",x.id,x.label,x.amount,x.date,x.category,x.bucket,"","","","","","","","","",""]));
      state.incomes.forEach(x => rows.push(["revenu",x.id,x.label,x.amount,x.date,x.category || "Salaire","","","","","","","","","","",""]));
      state.fixedCharges.forEach(x => rows.push(["charge_fixe",x.id,x.label,x.amount,"","",x.bucket,x.day,x.active !== false,"","","","","","","",""]));
      state.credits.forEach(x => rows.push(["credit",x.id,x.name,"","","","savings","",x.active !== false,x.principal,x.balance,x.zeroRate ? 0 : x.annualRate,x.monthlyPayment,"","","",""]));
      state.projects.forEach(x => rows.push(["projet_epargne",x.id,x.name,"","","","savings","",x.active !== false,"","","","",x.target,x.current,x.monthlyAllocation,""]));
      state.envelopes.forEach(x => rows.push(["enveloppe",x.id,x.name,"","",x.category,"","","","","","","","","","",x.limit]));
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(";")).join("\r\n");
      downloadBlob(`budget-${todayISO()}.csv`, `\uFEFF${csv}`, "text/csv;charset=utf-8");
      showSnackbar("Export CSV généré.");
    }

    function downloadBlob(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importJSONFile(file) {
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const migrated = migrateState(parsed);
        if (!confirm("Importer ce fichier remplacera les données du budget actuellement synchronisées avec ce compte. Continuer ?")) return;
        state = migrated;
        saveState("Sauvegarde JSON importée et synchronisée.");
      } catch (error) {
        console.error(error);
        showSnackbar("Fichier JSON invalide ou illisible.");
      } finally {
        document.getElementById("jsonImportInput").value = "";
      }
    }

    async function deleteAllCloudData() {
      if (!cloud || !cloudUser) {
        showSnackbar("Connecte-toi à Google pour supprimer les données du cloud.");
        return;
      }
      if (!confirm("Supprimer définitivement toutes les données de ce budget dans Firebase ?")) return;
      clearTimeout(cloudSaveTimer);
      applyingCloudState = true;
      try {
        state = EMPTY_STATE();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        const { doc, setDoc, serverTimestamp } = cloud.storeMod;
        await setDoc(doc(cloud.db, "budgetUsers", cloudUser.uid), {
          state,
          schemaVersion: STATE_VERSION,
          updatedAt: serverTimestamp()
        }, { merge: false });
        renderAll();
        setCurrentScreen("home");
        showSnackbar("Toutes les données du budget ont été supprimées de Firebase.");
      } catch (error) {
        console.error("Suppression cloud impossible", error);
        showSnackbar("Suppression des données Firebase impossible.");
      } finally {
        applyingCloudState = false;
      }
    }

    document.getElementById("entityForm").addEventListener("submit", handleEntitySubmit);

    document.addEventListener("click", event => {
      const privacy = event.target.closest("#privacyBtn");
      if (privacy) {
        state.settings.privacy = !state.settings.privacy;
        saveState();
        return;
      }

      const settings = event.target.closest("#settingsBtn");
      if (settings) { updateSettingsUI(); openModal("settingsModal"); return; }

      const account = event.target.closest("#accountBtn");
      if (account) { renderAccountModal(); openModal("accountModal"); return; }

      const accountSignIn = event.target.closest("#accountSignInBtn");
      if (accountSignIn) {
        closeModal("accountModal");
        signInWithGoogle();
        return;
      }

      const accountSignOut = event.target.closest("#accountSignOutBtn");
      if (accountSignOut) {
        closeModal("accountModal");
        signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });
        return;
      }

      const monthShift = event.target.closest("[data-month-shift]");
      if (monthShift) { shiftSelectedMonth(safeNumber(monthShift.dataset.monthShift)); return; }

      const monthPicker = event.target.closest("[data-month-picker]");
      if (monthPicker) { openMonthPicker(); return; }

      const pickerYear = event.target.closest("[data-picker-year]");
      if (pickerYear) { monthPickerYear += safeNumber(pickerYear.dataset.pickerYear); renderMonthPicker(); return; }

      const pickerMonth = event.target.closest("[data-picker-month]");
      if (pickerMonth) {
        selectedMonth = `${monthPickerYear}-${String(safeNumber(pickerMonth.dataset.pickerMonth) + 1).padStart(2, "0")}`;
        closeModal("monthPickerModal");
        renderAll();
        return;
      }

      const foldToggle = event.target.closest("[data-toggle-profile-fold]");
      if (foldToggle) {
        const key = foldToggle.dataset.toggleProfileFold;
        if (expandedProfileItems.has(key)) expandedProfileItems.delete(key);
        else expandedProfileItems.add(key);
        renderProfile();
        return;
      }

      const nav = event.target.closest("[data-screen]");
      if (nav) setCurrentScreen(nav.dataset.screen);

      const add = event.target.closest("[data-add-type]");
      if (add) openEntityModal(add.dataset.addType, null, null, true);

      const edit = event.target.closest("[data-edit-type]");
      if (edit) openEntityModal(edit.dataset.editType, edit.dataset.editId);

      const close = event.target.closest("[data-close-modal]");
      if (close) closeModal(close.dataset.closeModal);

      const charge = event.target.closest("[data-toggle-charge]");
      if (charge) toggleChargePaid(charge.dataset.toggleCharge);

      const filter = event.target.closest("[data-expense-filter]");
      if (filter) { expenseFilter = filter.dataset.expenseFilter; renderExpenses(); }

      const theme = event.target.closest("[data-theme-choice]");
      if (theme) {
        state.settings.theme = theme.dataset.themeChoice;
        saveState("Apparence mise à jour.");
      }

      const simulator = event.target.closest("[data-sim-credit]");
      if (simulator) openCreditSimulator(simulator.dataset.simCredit);

      if (event.target.id === "exportJsonBtn" || event.target.closest("#exportJsonBtn")) exportJSON();
      if (event.target.id === "exportCsvBtn" || event.target.closest("#exportCsvBtn")) exportCSV();
      if (event.target.id === "importJsonBtn" || event.target.closest("#importJsonBtn")) document.getElementById("jsonImportInput").click();
      if (event.target.id === "deleteCloudDataBtn" || event.target.closest("#deleteCloudDataBtn")) deleteAllCloudData();
      if (event.target.id === "googleSignInBtn" || event.target.closest("#googleSignInBtn")) signInWithGoogle();
      if (event.target.id === "googleSignOutBtn" || event.target.closest("#googleSignOutBtn")) signOutGoogle().catch(error => { console.error(error); showSnackbar("Déconnexion Google impossible."); });
    });

    document.querySelectorAll(".sheet-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") document.querySelectorAll(".sheet-backdrop.open").forEach(el => closeModal(el.id));
    });

    document.getElementById("jsonImportInput").addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importJSONFile(file);
    });

    if (window.matchMedia) {
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const onSystemThemeChange = () => { if (state.settings.theme === "auto") applyTheme(); };
      if (media.addEventListener) media.addEventListener("change", onSystemThemeChange);
      else if (media.addListener) media.addListener(onSystemThemeChange);
    }

    renderAll();
    initCloudSync();
  </script>
</body>
</html>
