<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HTML Editor</title>

  <!-- Google Sans, Roboto & JetBrains Mono typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Material 3 Expressive Dynamic Lilac Palette */
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;
      --md-sys-color-secondary: #625B71;
      --md-sys-color-secondary-container: #E8DEF8;
      --md-sys-color-tertiary: #7D5260;
      --md-sys-color-tertiary-container: #FFD8E4;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-surface-container-highest: #E6E0E9;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-outline-variant: #CAC4D0;

      /* Material 3 Spring Physics */
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-m3: cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      font-family: 'Google Sans', 'Roboto', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-code {
      font-family: 'JetBrains Mono', monospace;
    }

    /* M3 Expressive Spring Interactive Items */
    .m3-btn {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.3s var(--ease-spring), box-shadow 0.2s ease, background-color 0.2s ease;
      cursor: pointer;
    }
    .m3-btn:hover {
      transform: translateY(-1.5px) scale(1.02);
    }
    .m3-btn:active {
      transform: scale(0.96);
    }

    /* Ripple wave effect */
    .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(103, 80, 164, 0.28) 0%, rgba(103, 80, 164, 0) 75%);
      transform: scale(0);
      animation: ripple 0.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes ripple {
      to {
        transform: scale(3.5);
        opacity: 0;
      }
    }

    /* M3 Surface Card Hierarchy (No harsh 3D shadows, smooth tonal superposition) */
    .m3-card {
      border-radius: 32px;
      background-color: var(--md-sys-color-surface-container-lowest);
      box-shadow: 0 12px 32px -12px rgba(103, 80, 164, 0.12), 0 2px 6px rgba(103, 80, 164, 0.05);
    }

    .code-editor-container {
      position: relative;
      display: flex;
      flex: 1;
      height: 100%;
      overflow: hidden;
      background-color: var(--md-sys-color-surface-container-lowest);
    }

    .gutter {
      font-family: 'JetBrains Mono', monospace;
      color: #9D96A8;
      background-color: var(--md-sys-color-surface-container-high);
      user-select: none;
      text-align: right;
      padding: 16px 10px;
      line-height: 1.6;
      font-size: 13.5px;
      white-space: pre-line;
      box-sizing: border-box;
      border-right: 1px solid var(--md-sys-color-surface-container-highest);
      min-width: 44px;
    }

    .code-area {
      width: 100%;
      height: 100%;
      padding: 16px;
      border: none;
      outline: none;
      resize: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      background: transparent;
      color: var(--md-sys-color-on-surface);
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      tab-size: 2;
      -webkit-overflow-scrolling: touch;
      user-select: text;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased overflow-hidden">

  <header class="bg-[var(--md-sys-color-surface-container)] px-3 py-2.5 sm:px-6 flex items-center justify-between border-b border-[var(--md-sys-color-outline-variant)]/20 flex-shrink-0 z-20">
    <div class="flex items-center gap-3">
      <!-- Clean 2D Material 3 Vector Badge (No 3D) -->
      <div class="w-10 h-10 rounded-[16px] bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] flex items-center justify-center flex-shrink-0 m3-btn">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
        </svg>
      </div>
      <div>
        <h1 class="font-extrabold text-base sm:text-lg tracking-tight leading-tight text-[var(--md-sys-color-on-surface)]">
          HTML Editor
        </h1>
      </div>
    </div>

    <!-- Actions & view mode switches -->
    <div class="flex items-center gap-2">
      <!-- Google Auth Button (M3 Pill) -->
      <button id="btn-auth" class="m3-btn px-3 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-high)] text-[var(--md-sys-color-on-surface)] hover:bg-[var(--md-sys-color-surface-container-highest)]" title="Se connecter avec Google">
        <svg id="auth-icon" class="w-4 h-4 fill-current text-[var(--md-sys-color-primary)]" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
        <img id="auth-avatar" class="w-5 h-5 rounded-full object-cover hidden" alt="Avatar" />
        <span id="auth-label" class="hidden sm:inline">Connexion</span>
      </button>

      <!-- Tutorial code reset -->
      <button id="btnReloadDemo" class="m3-btn px-3 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-high)] text-[var(--md-sys-color-on-surface)]" title="Recharger l'exemple guidé">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        <span class="hidden md:inline">Tuto</span>
      </button>

      <!-- View Selector Pill Switch -->
      <div class="flex bg-[var(--md-sys-color-surface-container-highest)] p-1 rounded-full text-xs font-semibold">
        <button id="tabCode" class="m3-btn px-3.5 py-1.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)]">
          Code
        </button>
        <button id="tabSplit" class="m3-btn px-3.5 py-1.5 rounded-full text-[var(--md-sys-color-secondary)] hover:text-[var(--md-sys-color-on-surface)]">
          Split
        </button>
        <button id="tabPreview" class="m3-btn px-3.5 py-1.5 rounded-full text-[var(--md-sys-color-secondary)] hover:text-[var(--md-sys-color-on-surface)] flex items-center gap-1.5">
          <span>Aperçu</span>
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        </button>
      </div>
    </div>
  </header>

  <nav class="bg-[var(--md-sys-color-surface-container-high)] px-3 py-2 flex items-center gap-2 overflow-x-auto hide-scrollbar border-b border-[var(--md-sys-color-outline-variant)]/20 flex-shrink-0 z-10">
    <!-- Select All -->
    <button id="btnSelectAll" class="m3-btn whitespace-nowrap px-3.5 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-lowest)] text-[var(--md-sys-color-on-surface)]" title="Tout sélectionner (Ctrl+A)">
      <svg class="w-4 h-4 fill-current text-[var(--md-sys-color-primary)]" viewBox="0 0 24 24">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM17.6 7.4l-7.2 7.2-3.8-3.8L5.2 12.2l5.2 5.2 8.6-8.6z"/>
      </svg>
      <span>Tout Choisir</span>
    </button>

    <!-- Copy All -->
    <button id="btnCopyAll" class="m3-btn whitespace-nowrap px-3.5 py-1.5 text-xs font-bold rounded-full bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)]" title="Copier tout le code (Ctrl+C)">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      <span>Copier Tout</span>
    </button>

    <!-- Paste -->
    <button id="btnPaste" class="m3-btn whitespace-nowrap px-3.5 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-lowest)] text-[var(--md-sys-color-on-surface)]" title="Coller depuis le presse-papier">
      <svg class="w-4 h-4 fill-current text-[var(--md-sys-color-primary)]" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
      <span>Coller</span>
    </button>

    <div class="h-4 w-[1px] bg-[var(--md-sys-color-outline-variant)] mx-1 flex-shrink-0"></div>

    <!-- Search & Replace Drawer toggle -->
    <button id="btnOpenSearch" class="m3-btn whitespace-nowrap px-3.5 py-1.5 text-xs font-bold rounded-full bg-[var(--md-sys-color-secondary-container)] text-[var(--md-sys-color-secondary)]" title="Recherche globale (Ctrl+F)">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Chercher &amp; Remplacer</span>
    </button>

    <!-- Beautify / Indent -->
    <button id="btnFormat" class="m3-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-lowest)] text-[var(--md-sys-color-on-surface)]" title="Réindenter automatiquement le code">
      <svg class="w-4 h-4 fill-current text-[var(--md-sys-color-primary)]" viewBox="0 0 24 24"><path d="M3 17h18v2H3zm0-5h18v2H3zm0-5h18v2H3z"/></svg>
      <span>Indenter</span>
    </button>

    <!-- Chromebook / PC File Download -->
    <button id="btnDownload" class="m3-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-surface-container-lowest)] text-[var(--md-sys-color-on-surface)]" title="Télécharger index.html sur votre PC ou Chromebook">
      <svg class="w-4 h-4 fill-current text-[var(--md-sys-color-primary)]" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
      <span>Exporter .html</span>
    </button>

    <!-- Clear Editor -->
    <button id="btnClearCode" class="m3-btn whitespace-nowrap px-3 py-1.5 text-xs font-semibold rounded-full bg-[var(--md-sys-color-tertiary-container)] text-[var(--md-sys-color-tertiary)]" title="Effacer tout">
      <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>Effacer</span>
    </button>
  </nav>

  <div id="searchBar" class="hidden bg-[var(--md-sys-color-surface-container-highest)] px-4 py-3 border-b border-[var(--md-sys-color-outline-variant)]/30 z-10 transition-all">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-2.5">
      <div class="relative w-full md:w-1/3">
        <input id="findInput" type="text" placeholder="Terme à rechercher (ex: Vibe)..." class="w-full pl-3 pr-10 py-2 text-xs rounded-full bg-[var(--md-sys-color-surface-container-lowest)] border border-[var(--md-sys-color-outline-variant)]/30 outline-none text-[var(--md-sys-color-on-surface)] focus:ring-2 focus:ring-[var(--md-sys-color-primary)]">
        <span id="matchCount" class="absolute right-3 top-2.5 text-[11px] font-bold text-[var(--md-sys-color-secondary)]">0</span>
      </div>

      <div class="w-full md:w-1/3">
        <input id="replaceInput" type="text" placeholder="Remplacer par (ex: Pixel)..." class="w-full px-3 py-2 text-xs rounded-full bg-[var(--md-sys-color-surface-container-lowest)] border border-[var(--md-sys-color-outline-variant)]/30 outline-none text-[var(--md-sys-color-on-surface)] focus:ring-2 focus:ring-[var(--md-sys-color-primary)]">
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto justify-end">
        <button id="btnExecuteReplaceAll" class="m3-btn flex-1 md:flex-none px-4 py-2 text-xs font-bold rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] whitespace-nowrap">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          <span>Remplacer</span>
        </button>
        <button id="btnCloseSearchBar" class="m3-btn w-8 h-8 rounded-full bg-[var(--md-sys-color-surface-container)] text-[var(--md-sys-color-secondary)] hover:text-[var(--md-sys-color-on-surface)] text-sm font-bold">
          ✕
        </button>
      </div>
    </div>
  </div>

  <main class="flex-1 flex flex-col md:flex-row relative overflow-hidden bg-[var(--md-sys-color-surface-container)]">
    
    <!-- Code Editor Section -->
    <section id="editorSection" class="flex-1 flex flex-col h-full relative transition-all duration-200">
      <div class="code-editor-container">
        <div id="gutter" class="gutter">1</div>
        <textarea id="codeEditor" spellcheck="false" autocomplete="off" autocapitalize="off" class="code-area" placeholder="Écris ton code HTML/CSS/JS ici..."></textarea>
      </div>

      <!-- Quick symbol bar -->
      <div class="bg-[var(--md-sys-color-surface-container-high)] px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto hide-scrollbar border-t border-[var(--md-sys-color-outline-variant)]/20 flex-shrink-0">
        <span class="text-[10px] font-bold text-[var(--md-sys-color-secondary)] uppercase tracking-wider pr-1">Symboles :</span>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">&lt;</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">&gt;</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">/</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">=</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">"</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">{</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">}</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">(</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">)</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">;</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">`</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">$</button>
        <button class="key-symbol m3-btn px-2.5 py-1 bg-[var(--md-sys-color-surface-container-lowest)] rounded-[10px] text-xs font-code font-bold text-[var(--md-sys-color-on-surface)]">#</button>
      </div>
    </section>

    <!-- Live Preview Sandbox Section -->
    <section id="previewSection" class="hidden flex-1 flex-col h-full bg-[var(--md-sys-color-surface-container-lowest)] border-l border-[var(--md-sys-color-outline-variant)]/20 transition-all duration-200">
      <div class="bg-[var(--md-sys-color-surface-container-high)] px-4 py-2 flex items-center justify-between border-b border-[var(--md-sys-color-outline-variant)]/20">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="text-xs font-bold text-[var(--md-sys-color-on-surface)]">Rendu Web Interactif</span>
        </div>
        <button id="btnForceReloadPreview" class="m3-btn text-xs font-semibold px-2.5 py-1 rounded-full bg-[var(--md-sys-color-surface-container-lowest)] text-[var(--md-sys-color-secondary)]">
          Actualiser ↺
        </button>
      </div>
      <div class="flex-1 w-full h-full relative">
        <iframe id="previewFrame" class="w-full h-full border-none" sandbox="allow-scripts allow-modals"></iframe>
      </div>
    </section>
  </main>

  <footer class="bg-[var(--md-sys-color-surface-container)] px-4 py-2 border-t border-[var(--md-sys-color-outline-variant)]/20 flex items-center justify-between text-xs text-[var(--md-sys-color-secondary)] flex-shrink-0">
    <div class="flex items-center gap-3">
      <span id="posIndicator">Ligne 1, Colonne 1</span>
      <span class="hidden sm:inline">•</span>
      <span id="metricsIndicator" class="hidden sm:inline">0 caractères</span>
    </div>

    <!-- Quick shortcuts indicator for PC / Chromebook -->
    <div class="flex items-center gap-2">
      <span class="hidden lg:inline text-[11px] bg-[var(--md-sys-color-surface-container-high)] px-2 py-0.5 rounded-md font-mono">Ctrl+S Sauvegarder</span>
      <span class="hidden lg:inline text-[11px] bg-[var(--md-sys-color-surface-container-high)] px-2 py-0.5 rounded-md font-mono">Ctrl+F Chercher</span>
      <span class="text-[11px] font-bold text-[var(--md-sys-color-primary)]">Material 3 Expressive</span>
    </div>
  </footer>

  <!-- Toast Notification System -->
  <div id="toastBox" class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50 pointer-events-none flex flex-col items-center gap-2"></div>

  <!-- Material 3 Expressive Confirmation Modal (No native confirm/alert) -->
  <div id="confirmModal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="m3-card max-w-sm w-full p-6 bg-[var(--md-sys-color-surface-container-lowest)] border border-[var(--md-sys-color-outline-variant)]/30">
      <h3 class="text-base font-bold text-[var(--md-sys-color-on-surface)] mb-2">Déconnexion</h3>
      <p id="confirmModalText" class="text-xs text-[var(--md-sys-color-secondary)] mb-5">Voulez-vous vraiment vous déconnecter ?</p>
      <div class="flex items-center justify-end gap-2">
        <button id="btnModalCancel" class="m3-btn px-4 py-2 text-xs font-bold rounded-full text-[var(--md-sys-color-secondary)] hover:bg-[var(--md-sys-color-surface-container)]">
          Annuler
        </button>
        <button id="btnModalConfirm" class="m3-btn px-4 py-2 text-xs font-bold rounded-full bg-[var(--md-sys-color-tertiary-container)] text-[var(--md-sys-color-tertiary)]">
          Se déconnecter
        </button>
      </div>
    </div>
  </div>

  <script>
    /* Safe embedded HTML demo without premature inline script tag termination */
    const DEMO_HTML = '<!DOCTYPE html>\n' +
'<html lang="fr" class="h-full">\n' +
'<head>\n' +
'  <meta charset="UTF-8">\n' +
'  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'  <title>HTML Editor Preview</title>\n' +
'  <' + 'script src="https://cdn.tailwindcss.com"><' + '/script>\n' +
'  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">\n' +
'  <style>\n' +
'    body {\n' +
'      font-family: "Google Sans", sans-serif;\n' +
'      background: radial-gradient(circle at 50% 0%, #F3EDF7 0%, #FEF7FF 100%);\n' +
'      color: #1D1B20;\n' +
'    }\n' +
'    .preview-card {\n' +
'      border-radius: 28px;\n' +
'      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);\n' +
'    }\n' +
'    .preview-card:hover {\n' +
'      transform: translateY(-2px) scale(1.01);\n' +
'    }\n' +
'  </style>\n' +
'</head>\n' +
'<body class="h-full flex items-center justify-center p-4">\n' +
'  <div class="preview-card bg-white p-6 max-w-sm w-full text-center shadow-lg border border-[#E6E0E9]">\n' +
'    <div class="w-12 h-12 mx-auto rounded-2xl bg-[#EADDFF] text-[#21005D] flex items-center justify-center mb-3">\n' +
'      <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>\n' +
'    </div>\n' +
'    <h2 class="text-xl font-extrabold text-[#1D1B20] mb-1">HTML Editor</h2>\n' +
'    <p class="text-xs text-[#625B71] mb-4">Aperçu interactif et réactif en temps réel</p>\n' +
'    <div class="bg-[#F3EDF7] rounded-2xl p-4 mb-4 flex items-center justify-around">\n' +
'      <div>\n' +
'        <div id="counter" class="text-2xl font-black text-[#6750A4]">0</div>\n' +
'        <div class="text-[11px] text-[#625B71] font-semibold">Clics</div>\n' +
'      </div>\n' +
'      <button onclick="addClick()" class="px-4 py-2 rounded-full bg-[#6750A4] text-white text-xs font-bold shadow hover:bg-[#523e85] active:scale-95 transition-all">Tester +1</button>\n' +
'    </div>\n' +
'    <div class="text-[11px] text-[#7D5260] bg-[#FFD8E4] py-1 px-3 rounded-full font-semibold">✨ Prêt pour le vibecoding</div>\n' +
'  </div>\n' +
'  <' + 'script>\n' +
'    let count = 0;\n' +
'    function addClick() {\n' +
'      count++;\n' +
'      document.getElementById("counter").innerText = count;\n' +
'    }\n' +
'  <' + '/script>\n' +
'</body>\n' +
'</html>';

    const codeEditor = document.getElementById('codeEditor');
    const gutter = document.getElementById('gutter');
    const previewFrame = document.getElementById('previewFrame');
    const editorSection = document.getElementById('editorSection');
    const previewSection = document.getElementById('previewSection');

    const tabCode = document.getElementById('tabCode');
    const tabSplit = document.getElementById('tabSplit');
    const tabPreview = document.getElementById('tabPreview');

    const btnSelectAll = document.getElementById('btnSelectAll');
    const btnCopyAll = document.getElementById('btnCopyAll');
    const btnPaste = document.getElementById('btnPaste');
    const btnFormat = document.getElementById('btnFormat');
    const btnDownload = document.getElementById('btnDownload');
    const btnClearCode = document.getElementById('btnClearCode');
    const btnReloadDemo = document.getElementById('btnReloadDemo');

    const searchBar = document.getElementById('searchBar');
    const btnOpenSearch = document.getElementById('btnOpenSearch');
    const btnCloseSearchBar = document.getElementById('btnCloseSearchBar');
    const findInput = document.getElementById('findInput');
    const replaceInput = document.getElementById('replaceInput');
    const btnExecuteReplaceAll = document.getElementById('btnExecuteReplaceAll');
    const matchCount = document.getElementById('matchCount');

    const posIndicator = document.getElementById('posIndicator');
    const metricsIndicator = document.getElementById('metricsIndicator');
    const toastBox = document.getElementById('toastBox');

    let previewTimer = null;
    const STORAGE_KEY = 'pixel_vibecode_content';

    function notify(message, symbol = '✓') {
      const toast = document.createElement('div');
      toast.className = 'px-4 py-2 rounded-full bg-[var(--md-sys-color-on-surface)] text-[var(--md-sys-color-surface)] text-xs font-bold shadow-lg flex items-center gap-2 transform transition-all duration-300 translate-y-3 opacity-0';
      toast.innerHTML = `<span class="text-[var(--md-sys-color-primary-container)]">${symbol}</span><span>${message}</span>`;
      toastBox.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-3', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 250);
      }, 2000);
    }

    function spawnRipple(e) {
      const btn = e.currentTarget;
      const wave = document.createElement('span');
      const size = Math.max(btn.clientWidth, btn.clientHeight);
      const bounds = btn.getBoundingClientRect();

      wave.style.width = wave.style.height = `${size}px`;
      wave.style.left = `${(e.clientX || (e.touches ? e.touches[0].clientX : bounds.left + size / 2)) - bounds.left - size / 2}px`;
      wave.style.top = `${(e.clientY || (e.touches ? e.touches[0].clientY : bounds.top + size / 2)) - bounds.top - size / 2}px`;
      wave.classList.add('ripple-wave');

      const oldWave = btn.querySelector('.ripple-wave');
      if (oldWave) oldWave.remove();

      btn.appendChild(wave);
    }

    document.querySelectorAll('.m3-btn').forEach(b => {
      b.addEventListener('pointerdown', spawnRipple);
    });

    function refreshEditor() {
      const content = codeEditor.value;
      const lines = content.split('\n');
      const lineCount = lines.length;

      // Update gutter numbers
      let gutterHTML = '';
      for (let i = 1; i <= lineCount; i++) {
        gutterHTML += i + '<br>';
      }
      gutter.innerHTML = gutterHTML || '1';

      // Update metrics
      metricsIndicator.innerText = `${content.length} caractères • ${lineCount} lignes`;

      // Update line & column
      const cursorIndex = codeEditor.selectionStart;
      const textToCursor = content.substring(0, cursorIndex).split('\n');
      const currentLine = textToCursor.length;
      const currentCol = textToCursor[textToCursor.length - 1].length + 1;
      posIndicator.innerText = `Ligne ${currentLine}, Col ${currentCol}`;

      // Save to localStorage
      try {
        localStorage.setItem(STORAGE_KEY, content);
      } catch (e) {}

      // Auto-refresh preview instantaneously on any edit
      clearTimeout(previewTimer);
      previewTimer = setTimeout(() => {
        previewFrame.srcdoc = codeEditor.value;
      }, 100);
    }

    codeEditor.addEventListener('scroll', () => {
      gutter.scrollTop = codeEditor.scrollTop;
    });

    codeEditor.addEventListener('input', refreshEditor);
    codeEditor.addEventListener('keyup', refreshEditor);
    codeEditor.addEventListener('click', refreshEditor);

    document.getElementById('btnForceReloadPreview').addEventListener('click', () => {
      previewFrame.srcdoc = codeEditor.value;
      notify('Aperçu mis à jour');
    });

    function switchLayout(mode) {
      [tabCode, tabSplit, tabPreview].forEach(tab => {
        tab.className = 'm3-btn px-3.5 py-1.5 rounded-full text-[var(--md-sys-color-secondary)] hover:text-[var(--md-sys-color-on-surface)]';
      });

      if (mode === 'code') {
        tabCode.className = 'm3-btn px-3.5 py-1.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)]';
        editorSection.classList.remove('hidden');
        previewSection.classList.add('hidden');
      } else if (mode === 'split') {
        tabSplit.className = 'm3-btn px-3.5 py-1.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)]';
        editorSection.classList.remove('hidden');
        previewSection.classList.remove('hidden');
        previewFrame.srcdoc = codeEditor.value;
      } else if (mode === 'preview') {
        tabPreview.className = 'm3-btn px-3.5 py-1.5 rounded-full bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] flex items-center gap-1.5';
        editorSection.classList.add('hidden');
        previewSection.classList.remove('hidden');
        previewFrame.srcdoc = codeEditor.value;
      }
    }

    tabCode.addEventListener('click', () => switchLayout('code'));
    tabSplit.addEventListener('click', () => switchLayout('split'));
    tabPreview.addEventListener('click', () => switchLayout('preview'));

    function insertSnippet(text) {
      const start = codeEditor.selectionStart;
      const end = codeEditor.selectionEnd;
      const val = codeEditor.value;
      codeEditor.value = val.substring(0, start) + text + val.substring(end);
      codeEditor.selectionStart = codeEditor.selectionEnd = start + text.length;
      refreshEditor();
    }

    btnSelectAll.addEventListener('click', () => {
      codeEditor.focus();
      codeEditor.setSelectionRange(0, codeEditor.value.length);
      notify('Code sélectionné en totalité');
    });

    btnCopyAll.addEventListener('click', () => {
      try {
        codeEditor.select();
        document.execCommand('copy');
        notify('Copié dans le presse-papier');
      } catch (e) {
        navigator.clipboard.writeText(codeEditor.value)
          .then(() => notify('Copié dans le presse-papier'))
          .catch(() => notify('Erreur lors de la copie', '✕'));
      }
    });

    btnPaste.addEventListener('click', async () => {
      codeEditor.focus();
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const clip = await navigator.clipboard.readText();
          if (clip) {
            insertSnippet(clip);
            notify('Contenu collé');
            return;
          }
        } catch (err) {}
      }
      notify('Utilisez Ctrl+V ou appui long pour coller', 'ℹ');
    });

    // Touch symbols bar for Pixel & quick keys
    document.querySelectorAll('.key-symbol').forEach(btn => {
      btn.addEventListener('click', () => {
        insertSnippet(btn.innerText);
        codeEditor.focus();
      });
    });

    // Auto-indentation formatter
    btnFormat.addEventListener('click', () => {
      try {
        const lines = codeEditor.value.split('\n');
        let level = 0;
        const formatted = lines.map(line => {
          let trimmed = line.trim();
          if (trimmed.startsWith('</') || trimmed.startsWith('}')) {
            level = Math.max(0, level - 1);
          }
          const res = '  '.repeat(level) + trimmed;
          if ((trimmed.startsWith('<') && !trimmed.startsWith('</') && !trimmed.endsWith('/>') && !trimmed.includes('</')) || trimmed.endsWith('{')) {
            level++;
          }
          return res;
        }).join('\n');

        codeEditor.value = formatted;
        refreshEditor();
        notify('Code indenté');
      } catch (err) {
        notify('Erreur de formatage', '✕');
      }
    });

    // Chromebook & PC file export (.html)
    btnDownload.addEventListener('click', () => {
      const blob = new Blob([codeEditor.value], { type: 'text/html;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      notify('Fichier index.html exporté');
    });

    btnClearCode.addEventListener('click', () => {
      codeEditor.value = '';
      refreshEditor();
      notify('Éditeur vidé');
    });

    btnReloadDemo.addEventListener('click', () => {
      codeEditor.value = DEMO_HTML;
      refreshEditor();
      notify('Tutoriel réinitialisé');
    });

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function checkMatches() {
      const query = findInput.value;
      if (!query) {
        matchCount.innerText = '0';
        return;
      }
      try {
        const rx = new RegExp(escapeRegExp(query), 'g');
        const matches = (codeEditor.value.match(rx) || []).length;
        matchCount.innerText = `${matches} trouvé${matches > 1 ? 's' : ''}`;
      } catch (e) {
        matchCount.innerText = '0';
      }
    }

    btnOpenSearch.addEventListener('click', () => {
      const isHidden = searchBar.classList.contains('hidden');
      if (isHidden) {
        searchBar.classList.remove('hidden');
        findInput.focus();
        checkMatches();
      } else {
        searchBar.classList.add('hidden');
      }
    });

    btnCloseSearchBar.addEventListener('click', () => {
      searchBar.classList.add('hidden');
    });

    findInput.addEventListener('input', checkMatches);

    btnExecuteReplaceAll.addEventListener('click', () => {
      const searchVal = findInput.value;
      const replaceVal = replaceInput.value;
      if (!searchVal) {
        notify('Entrez un mot à chercher', 'ℹ');
        return;
      }

      const rx = new RegExp(escapeRegExp(searchVal), 'g');
      const count = (codeEditor.value.match(rx) || []).length;

      if (count === 0) {
        notify('Aucune occurrence trouvée', '✕');
        return;
      }

      codeEditor.value = codeEditor.value.replace(rx, replaceVal);
      refreshEditor();
      checkMatches();
      notify(`${count} occurrence(s) remplacée(s) !`);
    });

    codeEditor.addEventListener('keydown', (e) => {
      // Ctrl+S or Cmd+S : Quick save notification
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        try {
          localStorage.setItem(STORAGE_KEY, codeEditor.value);
        } catch (err) {}
        notify('Sauvegardé en local');
        return;
      }

      // Ctrl+F or Cmd+F : Toggle search
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        searchBar.classList.remove('hidden');
        findInput.focus();
        checkMatches();
        return;
      }

      // Tab indentation
      if (e.key === 'Tab') {
        e.preventDefault();
        insertSnippet('  ');
      }
    });

    // Expose helpers and stores globally for Firebase module integration
    window.fileStore = new Map();
    window.curFileId = 'index_html';
    window.showToast = notify;
    window.setSaveStatus = (msg) => notify(msg, '☁');

    window.promptConfirm = function(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const modalText = document.getElementById('confirmModalText');
        const btnCancel = document.getElementById('btnModalCancel');
        const btnConfirm = document.getElementById('btnModalConfirm');

        modalText.textContent = message;
        modal.classList.remove('hidden');

        const cleanup = (val) => {
          modal.classList.add('hidden');
          btnCancel.onclick = null;
          btnConfirm.onclick = null;
          resolve(val);
        };

        btnCancel.onclick = () => cleanup(false);
        btnConfirm.onclick = () => cleanup(true);
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      const cached = localStorage.getItem(STORAGE_KEY);
      codeEditor.value = cached && cached.trim().length > 0 ? cached : DEMO_HTML;
      refreshEditor();
      
      // Force initial preview render
      previewFrame.srcdoc = codeEditor.value;

      // Automatically choose Split on desktop screen sizes
      if (window.innerWidth >= 820) {
        switchLayout('split');
      } else {
        switchLayout('code');
      }
    });
  </script>

  <!-- MODULE FIREBASE AUTH + FIRESTORE TEMPS RÉEL -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      deleteDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCTYpB9_NTYNAphiNqSzH0Fd9itczJ75YU",
      authDomain: "myhtmleditorapplication.firebaseapp.com",
      projectId: "myhtmleditorapplication",
      storageBucket: "myhtmleditorapplication.firebasestorage.app",
      messagingSenderId: "882310056769",
      appId: "1:882310056769:web:58905addb57e00cad4efc0",
      measurementId: "G-F47LXNK65K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeSnapshot = null;

    const btnAuth = document.getElementById('btn-auth');
    const authIcon = document.getElementById('auth-icon');
    const authAvatar = document.getElementById('auth-avatar');
    const authLabel = document.getElementById('auth-label');

    btnAuth.onclick = async () => {
      if (!currentUser) {
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          console.error("Erreur de connexion :", err);
          window.showToast("Erreur de connexion", "✕");
        }
      } else {
        const confirmed = await window.promptConfirm(`Connecté en tant que ${currentUser.displayName || currentUser.email}. Te déconnecter ?`);
        if (confirmed) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          await signOut(auth);
          window.showToast("Déconnecté", "ℹ");
        }
      }
    };

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        authIcon.style.display = 'none';
        authAvatar.style.display = 'block';
        authAvatar.src = user.photoURL || '';
        if (authLabel) authLabel.textContent = (user.displayName || 'Compte').split(' ')[0];
        btnAuth.title = `Connecté : ${user.displayName || user.email}`;
        listenToUserCloud(user.uid);
        window.showToast(`Bienvenue ${user.displayName || ''}`);
      } else {
        if (unsubscribeSnapshot) {
          unsubscribeSnapshot();
          unsubscribeSnapshot = null;
        }
        authIcon.style.display = 'block';
        authAvatar.style.display = 'none';
        if (authLabel) authLabel.textContent = 'Connexion';
        btnAuth.title = "Se connecter avec Google";
      }
    });

    function listenToUserCloud(uid) {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const q = query(collection(db, "users", uid, "files"), orderBy("path", "asc"));
      unsubscribeSnapshot = onSnapshot(q, (snap) => {
        if (snap.empty) {
          window.fileStore.clear();
          // Initialize default cloud document if none exists
          window.saveToCloud(window.curFileId, {
            name: "index.html",
            ext: "html",
            path: "index.html",
            content: document.getElementById('codeEditor').value
          });
          return;
        }

        window.fileStore.clear();

        snap.forEach(docSnap => {
          const data = docSnap.data();
          const id = docSnap.id;

          window.fileStore.set(id, {
            name: data.name,
            ext: data.ext,
            path: data.path || data.name,
            content: data.content,
            storageKey: 'cache_' + data.name
          });

          // Sync into the active editor if modified externally
          if (window.curFileId === id && document.activeElement !== document.getElementById('codeEditor')) {
            const editor = document.getElementById('codeEditor');
            if (editor.value !== data.content) {
              editor.value = data.content;
              editor.dispatchEvent(new Event('input'));
            }
          }
        });
      }, (error) => {
        console.error("Erreur d'écoute temps réel :", error);
      });
    }

    let cloudSyncTimeout = null;
    window.saveToCloud = async (fileId, fileObj) => {
      if (!currentUser || !fileObj) return;
      try {
        await setDoc(doc(db, "users", currentUser.uid, "files", fileId), {
          name: fileObj.name,
          ext: fileObj.ext,
          path: fileObj.path || fileObj.name,
          content: fileObj.content,
          updatedAt: serverTimestamp()
        }, { merge: true });
        window.setSaveStatus("Cloud synchronisé");
      } catch (e) {
        console.error("Erreur sauvegarde cloud :", e);
      }
    };

    window.deleteFromCloud = async (fileId) => {
      if (!currentUser) return;
      try {
        await deleteDoc(doc(db, "users", currentUser.uid, "files", fileId));
        window.setSaveStatus("Supprimé du cloud");
      } catch (e) {
        console.error("Erreur suppression cloud :", e);
      }
    };

    // Auto-save debounced cloud trigger whenever typing occurs
    document.getElementById('codeEditor').addEventListener('input', () => {
      if (!currentUser) return;
      clearTimeout(cloudSyncTimeout);
      cloudSyncTimeout = setTimeout(() => {
        window.saveToCloud(window.curFileId, {
          name: "index.html",
          ext: "html",
          path: "index.html",
          content: document.getElementById('codeEditor').value
        });
      }, 1500);
    });
  </script>
