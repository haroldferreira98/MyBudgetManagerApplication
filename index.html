<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2fa" />
  <meta name="color-scheme" content="light dark" />
  <title>Budget Pixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #6750a4;
      --on-primary: #ffffff;
      --primary-container: #eaddff;
      --on-primary-container: #21005d;
      --secondary: #625b71;
      --on-secondary: #ffffff;
      --secondary-container: #e8def8;
      --on-secondary-container: #1d192b;
      --tertiary: #7d5260;
      --tertiary-container: #ffd8e4;
      --on-tertiary-container: #31111d;
      --surface: #fff7ff;
      --surface-dim: #ded8e1;
      --surface-bright: #fff7ff;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f7f2fa;
      --surface-container: #f3edf7;
      --surface-container-high: #ece6f0;
      --surface-container-highest: #e6e0e9;
      --on-surface: #1d1b20;
      --on-surface-variant: #49454f;
      --outline: #79747e;
      --outline-variant: #cac4d0;
      --error: #b3261e;
      --on-error: #ffffff;
      --error-container: #f9dedc;
      --on-error-container: #410e0b;
      --success: #386a20;
      --success-container: #b8f397;
      --warning: #7a5900;
      --warning-container: #ffdea2;
      --shadow: rgba(0,0,0,.16);
      --scrim: rgba(0,0,0,.42);
      --radius-card: 24px;
      --radius-sheet: 28px;
      --radius-small: 16px;
      --pill: 9999px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-height: 78px;
      --content-max: 760px;
    }

    html[data-theme="dark"] {
      --primary: #d0bcff;
      --on-primary: #381e72;
      --primary-container: #4f378b;
      --on-primary-container: #eaddff;
      --secondary: #ccc2dc;
      --on-secondary: #332d41;
      --secondary-container: #4a4458;
      --on-secondary-container: #e8def8;
      --tertiary: #efb8c8;
      --tertiary-container: #633b48;
      --on-tertiary-container: #ffd8e4;
      --surface: #141218;
      --surface-dim: #141218;
      --surface-bright: #3b383e;
      --surface-container-lowest: #0f0d13;
      --surface-container-low: #1d1b20;
      --surface-container: #211f26;
      --surface-container-high: #2b2930;
      --surface-container-highest: #36343b;
      --on-surface: #e6e0e9;
      --on-surface-variant: #cac4d0;
      --outline: #938f99;
      --outline-variant: #49454f;
      --error: #f2b8b5;
      --on-error: #601410;
      --error-container: #8c1d18;
      --on-error-container: #f9dedc;
      --success: #9dd67c;
      --success-container: #22510d;
      --warning: #f4bd47;
      --warning-container: #5a4100;
      --shadow: rgba(0,0,0,.48);
      --scrim: rgba(0,0,0,.62);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--surface); }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--primary-container) 60%, transparent), transparent 34%),
        var(--surface);
      color: var(--on-surface);
      font-family: "Google Sans", "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
      outline-offset: 2px;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
    }

    .app-shell {
      width: min(100%, var(--content-max));
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-height) + 42px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(12px + var(--safe-top)) 18px 12px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    .brand { min-width: 0; }
    .brand-eyebrow {
      margin: 0 0 2px;
      color: var(--on-surface-variant);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .brand-title {
      margin: 0;
      font-size: clamp(24px, 7vw, 32px);
      font-weight: 700;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: var(--pill);
      display: grid;
      place-items: center;
      background: var(--surface-container-high);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:hover { background: var(--surface-container-highest); }

    main { padding: 10px 16px 20px; }
    .screen { display: none; animation: screenIn .22s ease; }
    .screen.active { display: block; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .section { margin: 18px 0 26px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }
    .section-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .section-subtitle {
      margin: 3px 0 0;
      color: var(--on-surface-variant);
      font-size: 13px;
    }

    .card {
      background: var(--surface-container-low);
      border-radius: var(--radius-card);
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--on-surface) 3%, transparent);
    }
    .card + .card { margin-top: 12px; }
    .hero-card {
      padding: 22px;
      background: linear-gradient(145deg, var(--primary-container), color-mix(in srgb, var(--primary-container) 54%, var(--surface-container-low)));
      border-color: transparent;
      overflow: hidden;
      position: relative;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      right: -92px;
      top: -112px;
      background: color-mix(in srgb, var(--primary) 11%, transparent);
    }
    .hero-label { color: var(--on-primary-container); font-size: 14px; font-weight: 600; }
    .hero-value {
      margin-top: 8px;
      color: var(--on-primary-container);
      font-size: clamp(38px, 12vw, 54px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.05em;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .daily-pill, .status-pill, .chip, .small-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: var(--pill);
      font-size: 13px;
      font-weight: 600;
    }
    .daily-pill { background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent); color: var(--on-surface); }
    .status-pill.neutral { background: var(--surface-container-highest); color: var(--on-surface-variant); }
    .status-pill.controlled { background: var(--success-container); color: var(--success); }
    .status-pill.tension { background: var(--warning-container); color: var(--warning); }
    .status-pill.deficit { background: var(--error-container); color: var(--on-error-container); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .metric-card { min-height: 118px; }
    .metric-label { color: var(--on-surface-variant); font-size: 13px; }
    .metric-value { margin-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
    .metric-note { margin-top: 6px; color: var(--on-surface-variant); font-size: 12px; }

    .progress-track {
      width: 100%;
      height: 9px;
      border-radius: var(--pill);
      background: var(--surface-container-highest);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--primary);
      transition: width .3s ease;
    }
    .progress-fill.warn { background: var(--warning); }
    .progress-fill.error { background: var(--error); }
    .progress-fill.success { background: var(--success); }

    .balance-row { margin: 14px 0; }
    .balance-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; font-size: 13px; }
    .balance-head strong { font-size: 14px; }

    .list { display: grid; gap: 10px; }
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 20px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
    }
    .list-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }
    .list-main { min-width: 0; flex: 1; }
    .list-title { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub { margin-top: 3px; color: var(--on-surface-variant); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-side { text-align: right; flex: 0 0 auto; }
    .list-amount { font-weight: 700; font-size: 15px; }
    .list-side small { display: block; margin-top: 4px; color: var(--on-surface-variant); font-size: 11px; }
    .item-actions { display: flex; gap: 5px; margin-left: 4px; }
    .mini-btn {
      border: 0;
      background: transparent;
      border-radius: var(--pill);
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--on-surface-variant);
    }
    .mini-btn:hover { background: var(--surface-container-highest); color: var(--on-surface); }
    .mini-btn .material-symbols-outlined { font-size: 20px; }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      border-radius: var(--radius-card);
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
    }
    .empty-state .material-symbols-outlined { font-size: 36px; margin-bottom: 8px; color: var(--primary); }
    .empty-state strong { display: block; color: var(--on-surface); margin-bottom: 5px; }

    .search-shell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: 7px 8px 7px 16px;
      background: var(--surface-container-high);
      border-radius: var(--pill);
      border: 1px solid transparent;
    }
    .search-shell:focus-within { border-color: var(--primary); }
    .search-shell input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--on-surface);
      background: transparent;
      font-size: 15px;
    }
    .search-shell input::placeholder { color: var(--on-surface-variant); }
    .mic-btn.listening { background: var(--error-container); color: var(--error); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(.92); } }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 1px 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      border: 1px solid var(--outline-variant);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px;
      gap: 4px;
      border-radius: var(--pill);
      background: var(--surface-container-high);
    }
    .segmented button {
      min-height: 42px;
      border: 0;
      border-radius: var(--pill);
      background: transparent;
      color: var(--on-surface-variant);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .segmented button.active { background: var(--primary-container); color: var(--on-primary-container); }

    .btn {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: var(--pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 650;
      transition: transform .15s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: var(--primary); color: var(--on-primary); }
    .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
    .btn.outlined { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
    .btn.danger { background: var(--error-container); color: var(--on-error-container); }
    .btn.small { min-height: 38px; padding: 0 13px; font-size: 13px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; }

    .nav-wrap {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: calc(12px + var(--safe-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 24px), 720px);
      pointer-events: none;
    }
    .bottom-nav {
      height: var(--nav-height);
      padding: 8px 10px;
      border-radius: var(--pill);
      background: color-mix(in srgb, var(--surface-container-high) 94%, transparent);
      box-shadow: 0 14px 36px var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--outline-variant) 45%, transparent);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      display: grid;
      grid-template-columns: 1fr 1fr 72px 1fr 1fr;
      align-items: center;
      pointer-events: auto;
    }
    .nav-btn {
      height: 58px;
      border: 0;
      background: transparent;
      border-radius: 22px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      color: var(--on-surface-variant);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
    }
    .nav-btn .material-symbols-outlined { font-size: 24px; }
    .nav-btn.active { color: var(--on-primary-container); }
    .nav-btn.active .material-symbols-outlined {
      width: 54px;
      height: 30px;
      border-radius: var(--pill);
      display: grid;
      place-items: center;
      background: var(--primary-container);
      font-variation-settings: "FILL" 1, "wght" 550, "GRAD" 0, "opsz" 24;
    }
    .fab {
      width: 62px;
      height: 62px;
      transform: translateY(-17px);
      border: 0;
      border-radius: 22px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      box-shadow: 0 10px 20px var(--shadow);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .fab .material-symbols-outlined { font-size: 32px; font-variation-settings: "FILL" 0, "wght" 600, "GRAD" 0, "opsz" 32; }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: var(--scrim);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding-top: calc(24px + var(--safe-top));
    }
    .sheet-backdrop.open { display: flex; }
    .sheet {
      width: min(100%, 760px);
      max-height: min(92dvh, 920px);
      background: var(--surface-container-low);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      box-shadow: 0 -20px 50px var(--shadow);
      display: flex;
      flex-direction: column;
      animation: sheetUp .25s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes sheetUp { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
    .sheet-handle { width: 42px; height: 4px; border-radius: var(--pill); background: var(--outline); margin: 10px auto 6px; opacity: .6; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px 8px 22px; }
    .sheet-title { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
    .sheet-body { overflow-y: auto; padding: 8px 18px calc(20px + var(--safe-bottom)); }

    .field { display: grid; gap: 7px; margin: 14px 0; }
    .field label { font-size: 13px; font-weight: 600; color: var(--on-surface-variant); padding-left: 4px; }
    .field input, .field select, .field textarea {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--outline-variant);
      border-radius: 17px;
      padding: 12px 14px;
      background: var(--surface-container-highest);
      color: var(--on-surface);
      outline: 0;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
    .field textarea { min-height: 92px; resize: vertical; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--surface-container);
    }
    .checkbox-row input { width: 20px; height: 20px; accent-color: var(--primary); }
    .modal-actions {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding-top: 14px;
      background: linear-gradient(transparent, var(--surface-container-low) 22%);
    }
    .modal-actions .btn { flex: 1; }

    .range-row { display: grid; gap: 10px; margin: 16px 0; }
    input[type="range"] { width: 100%; accent-color: var(--primary); }
    .sim-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .sim-box { padding: 13px; border-radius: 18px; background: var(--surface-container); }
    .sim-box span { color: var(--on-surface-variant); font-size: 12px; display: block; }
    .sim-box strong { font-size: 17px; display: block; margin-top: 5px; }

    .snackbar {
      position: fixed;
      z-index: 100;
      left: 50%;
      bottom: calc(var(--nav-height) + 34px + var(--safe-bottom));
      transform: translate(-50%, 18px);
      width: min(calc(100% - 32px), 560px);
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--on-surface);
      color: var(--surface);
      box-shadow: 0 14px 36px var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 14px;
      font-weight: 550;
    }
    .snackbar.show { opacity: 1; transform: translate(-50%, 0); }

    .privacy .money { filter: blur(8px); user-select: none; }
    .privacy .money::selection { background: transparent; }

    .danger-zone { border: 1px solid color-mix(in srgb, var(--error) 35%, transparent); background: color-mix(in srgb, var(--error-container) 46%, var(--surface-container-low)); }
    .tiny { font-size: 12px; color: var(--on-surface-variant); }
    .muted { color: var(--on-surface-variant); }
    .positive { color: var(--success); }
    .negative { color: var(--error); }
    .spacer-8 { height: 8px; }
    .spacer-12 { height: 12px; }
    .full { width: 100%; }
    .hidden { display: none !important; }

    @media (min-width: 640px) {
      main { padding-left: 22px; padding-right: 22px; }
      .topbar { padding-left: 24px; padding-right: 24px; }
      .sheet { border-radius: var(--radius-sheet); margin-bottom: 20px; max-height: 88dvh; }
      .sheet-backdrop { align-items: center; padding: 28px; }
    }

    @media (max-width: 390px) {
      .grid-2, .field-row, .sim-grid { grid-template-columns: 1fr; }
      .nav-btn { font-size: 9px; }
      .bottom-nav { grid-template-columns: 1fr 1fr 64px 1fr 1fr; }
      .fab { width: 58px; height: 58px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <p class="brand-eyebrow">Budget personnel</p>
        <h1 class="brand-title" id="screenTitle">Accueil</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="privacyBtn" aria-label="Masquer les montants" title="Masquer les montants">
          <span class="material-symbols-outlined" id="privacyIcon">visibility</span>
        </button>
      </div>
    </header>

    <main>
      <section class="screen active" id="screen-home" data-title="Accueil"></section>
      <section class="screen" id="screen-income" data-title="Revenus"></section>
      <section class="screen" id="screen-expenses" data-title="Dépenses"></section>
      <section class="screen" id="screen-profile" data-title="Profil & patrimoine"></section>
    </main>
  </div>

  <div class="nav-wrap">
    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-btn active" data-screen="home" aria-label="Accueil">
        <span class="material-symbols-outlined">home</span><span>Accueil</span>
      </button>
      <button class="nav-btn" data-screen="income" aria-label="Revenus">
        <span class="material-symbols-outlined">payments</span><span>Revenus</span>
      </button>
      <button class="fab" id="fabAdd" aria-label="Ajouter">
        <span class="material-symbols-outlined">add</span>
      </button>
      <button class="nav-btn" data-screen="expenses" aria-label="Dépenses">
        <span class="material-symbols-outlined">receipt_long</span><span>Dépenses</span>
      </button>
      <button class="nav-btn" data-screen="profile" aria-label="Profil">
        <span class="material-symbols-outlined">person</span><span>Profil</span>
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="entityModal" role="dialog" aria-modal="true" aria-labelledby="entityModalTitle">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="entityModalTitle">Ajouter</h2>
        <button class="icon-btn" data-close-modal="entityModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="sheet-body">
        <form id="entityForm"></form>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="creditSimModal" role="dialog" aria-modal="true" aria-labelledby="creditSimTitle">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 class="sheet-title" id="creditSimTitle">Simulation de crédit</h2>
        <button class="icon-btn" data-close-modal="creditSimModal" aria-label="Fermer"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="sheet-body" id="creditSimBody"></div>
    </div>
  </div>

  <input type="file" id="jsonImportInput" accept="application/json,.json" hidden>
  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const STORAGE_KEY = "budgetPixelM3_v1";
    const STATE_VERSION = 1;
    const EXPENSE_CATEGORIES = ["Courses", "Carburant", "Loisirs", "Restaurant", "Santé", "Autre"];
    const BUDGET_BUCKETS = [
      { value: "needs", label: "Besoins" },
      { value: "wants", label: "Envies" },
      { value: "savings", label: "Épargne / Crédit" }
    ];

    const EMPTY_STATE = () => ({
      version: STATE_VERSION,
      settings: { theme: "auto", privacy: false },
      incomes: [],
      expenses: [],
      fixedCharges: [],
      credits: [],
      projects: [],
      envelopes: []
    });

    let state = loadState();
    let currentScreen = "home";
    let expenseFilter = "Toutes";
    let expenseSearch = "";
    let snackbarTimer = null;
    let recognition = null;

    const euro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const shortDate = new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "short", year: "numeric" });

    function uid(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function safeNumber(value, fallback = 0) {
      const n = Number(String(value ?? "").replace(/\s/g, "").replace(",", "."));
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function monthKey(date = new Date()) {
      const d = date instanceof Date ? date : new Date(`${date}T12:00:00`);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }

    function isCurrentMonth(dateString) {
      if (!dateString) return false;
      return monthKey(dateString) === monthKey();
    }

    function daysRemainingInMonth() {
      const now = new Date();
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      return Math.max(1, lastDay - now.getDate() + 1);
    }

    function formatMoney(value) {
      return euro.format(safeNumber(value));
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(`${value}T12:00:00`);
      return Number.isNaN(d.getTime()) ? "—" : shortDate.format(d);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return EMPTY_STATE();
        const parsed = JSON.parse(raw);
        return migrateState(parsed);
      } catch (error) {
        console.error("Chargement localStorage impossible", error);
        return EMPTY_STATE();
      }
    }

    function migrateState(input) {
      const base = EMPTY_STATE();
      if (!input || typeof input !== "object") return base;
      const output = {
        ...base,
        ...input,
        version: STATE_VERSION,
        settings: { ...base.settings, ...(input.settings || {}) },
        incomes: Array.isArray(input.incomes) ? input.incomes : [],
        expenses: Array.isArray(input.expenses) ? input.expenses : [],
        fixedCharges: Array.isArray(input.fixedCharges) ? input.fixedCharges : [],
        credits: Array.isArray(input.credits) ? input.credits : [],
        projects: Array.isArray(input.projects) ? input.projects : [],
        envelopes: Array.isArray(input.envelopes) ? input.envelopes : []
      };
      output.fixedCharges = output.fixedCharges.map(item => ({ ...item, paidMonths: Array.isArray(item.paidMonths) ? item.paidMonths : [] }));
      return output;
    }

    function saveState(message = "") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (message) showSnackbar(message);
      renderAll();
    }

    function applyTheme() {
      const chosen = state.settings.theme || "auto";
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const effective = chosen === "auto" ? (systemDark ? "dark" : "light") : chosen;
      document.documentElement.dataset.theme = effective;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", effective === "dark" ? "#141218" : "#fff7ff");
    }

    function applyPrivacy() {
      document.body.classList.toggle("privacy", !!state.settings.privacy);
      const icon = document.getElementById("privacyIcon");
      const btn = document.getElementById("privacyBtn");
      icon.textContent = state.settings.privacy ? "visibility_off" : "visibility";
      btn.setAttribute("aria-label", state.settings.privacy ? "Afficher les montants" : "Masquer les montants");
      btn.title = state.settings.privacy ? "Afficher les montants" : "Masquer les montants";
    }

    function sum(list, selector = x => x) {
      return list.reduce((total, item) => total + safeNumber(selector(item)), 0);
    }

    function currentMonthIncomes() {
      return state.incomes.filter(item => isCurrentMonth(item.date));
    }

    function currentMonthExpenses() {
      return state.expenses.filter(item => isCurrentMonth(item.date));
    }

    function activeFixedCharges() {
      return state.fixedCharges.filter(item => item.active !== false);
    }

    function activeCredits() {
      return state.credits.filter(item => item.active !== false);
    }

    function activeProjects() {
      return state.projects.filter(item => item.active !== false);
    }

    function financialSnapshot() {
      const income = sum(currentMonthIncomes(), x => x.amount);
      const expenses = sum(currentMonthExpenses(), x => x.amount);
      const fixed = sum(activeFixedCharges(), x => x.amount);
      const credits = sum(activeCredits(), x => x.monthlyPayment);
      const projects = sum(activeProjects(), x => x.monthlyAllocation);
      const engaged = fixed + credits + projects + expenses;
      const remaining = income - engaged;
      const daily = remaining / daysRemainingInMonth();

      const needsExpenses = sum(currentMonthExpenses().filter(x => (x.bucket || defaultBucketForCategory(x.category)) === "needs"), x => x.amount);
      const wantsExpenses = sum(currentMonthExpenses().filter(x => (x.bucket || defaultBucketForCategory(x.category)) === "wants"), x => x.amount);
      const needsFixed = sum(activeFixedCharges().filter(x => (x.bucket || "needs") === "needs"), x => x.amount);
      const wantsFixed = sum(activeFixedCharges().filter(x => x.bucket === "wants"), x => x.amount);
      const savingsExpense = sum(currentMonthExpenses().filter(x => x.bucket === "savings"), x => x.amount);
      const savingsFixed = sum(activeFixedCharges().filter(x => x.bucket === "savings"), x => x.amount);

      return {
        income, expenses, fixed, credits, projects, engaged, remaining, daily,
        buckets: {
          needs: needsExpenses + needsFixed,
          wants: wantsExpenses + wantsFixed,
          savings: savingsExpense + savingsFixed + credits + projects
        }
      };
    }

    function defaultBucketForCategory(category) {
      return ["Loisirs", "Restaurant"].includes(category) ? "wants" : "needs";
    }

    function financialStatus(snapshot) {
      if (snapshot.income === 0 && snapshot.engaged === 0) return { key: "neutral", label: "Neutre", icon: "horizontal_rule" };
      if (snapshot.remaining < 0 || (snapshot.income === 0 && snapshot.engaged > 0)) return { key: "deficit", label: "Déficit", icon: "trending_down" };
      if (snapshot.income > 0 && snapshot.remaining / snapshot.income < 0.15) return { key: "tension", label: "Tension", icon: "warning" };
      return { key: "controlled", label: "Maîtrisé", icon: "verified" };
    }

    function emptyState(icon, title, text) {
      return `<div class="empty-state"><span class="material-symbols-outlined">${icon}</span><strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span></div>`;
    }

    function renderAll() {
      applyTheme();
      applyPrivacy();
      renderHome();
      renderIncome();
      renderExpenses();
      renderProfile();
      setCurrentScreen(currentScreen, false);
    }

    function renderHome() {
      const container = document.getElementById("screen-home");
      const s = financialSnapshot();
      const status = financialStatus(s);
      const days = daysRemainingInMonth();
      const incomeProgress = s.income > 0 ? clamp((s.engaged / s.income) * 100, 0, 100) : (s.engaged > 0 ? 100 : 0);
      const charges = [...activeFixedCharges()].sort((a,b) => safeNumber(a.day, 1) - safeNumber(b.day, 1));

      const bucketCards = [
        { key: "needs", label: "Besoins", target: 50, value: s.buckets.needs },
        { key: "wants", label: "Envies", target: 30, value: s.buckets.wants },
        { key: "savings", label: "Épargne / Crédit", target: 20, value: s.buckets.savings }
      ].map(item => {
        const pctIncome = s.income > 0 ? (item.value / s.income) * 100 : 0;
        const fill = item.target > 0 ? clamp((pctIncome / item.target) * 100, 0, 100) : 0;
        const over = pctIncome > item.target + 0.01;
        return `
          <div class="balance-row">
            <div class="balance-head">
              <strong>${item.label} · ${item.target}%</strong>
              <span><span class="money">${formatMoney(item.value)}</span> · ${pctIncome.toFixed(0)}%</span>
            </div>
            <div class="progress-track"><div class="progress-fill ${over ? "warn" : ""}" style="width:${fill}%"></div></div>
          </div>`;
      }).join("");

      const chargesHtml = charges.length ? charges.map(charge => {
        const paid = (charge.paidMonths || []).includes(monthKey());
        return `
          <div class="list-item">
            <div class="list-icon"><span class="material-symbols-outlined">${paid ? "check_circle" : "event"}</span></div>
            <div class="list-main">
              <div class="list-title">${escapeHtml(charge.label)}</div>
              <div class="list-sub">Jour ${safeNumber(charge.day, 1)} · ${paid ? "Prélevé" : "À venir"}</div>
            </div>
            <div class="list-side">
              <div class="list-amount money">${formatMoney(charge.amount)}</div>
              <button class="mini-btn" data-toggle-charge="${charge.id}" title="${paid ? "Marquer à venir" : "Marquer prélevé"}" aria-label="${paid ? "Marquer à venir" : "Marquer prélevé"}"><span class="material-symbols-outlined">${paid ? "undo" : "done"}</span></button>
            </div>
            <div class="item-actions"><button class="mini-btn" data-edit-type="fixed" data-edit-id="${charge.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button></div>
          </div>`;
      }).join("") : emptyState("calendar_month", "Aucune charge fixe", "Ajoute tes charges récurrentes pour obtenir un reste à vivre précis.");

      container.innerHTML = `
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Reste à vivre ce mois-ci</div>
            <div class="hero-value money">${formatMoney(s.remaining)}</div>
            <div class="hero-meta">
              <span class="daily-pill"><span class="material-symbols-outlined">today</span><span class="money">${formatMoney(s.daily)}</span>/jour · ${days} jour${days > 1 ? "s" : ""}</span>
              <span class="status-pill ${status.key}"><span class="material-symbols-outlined">${status.icon}</span>${status.label}</span>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="grid-2">
            <div class="card metric-card">
              <div class="metric-label">Revenus</div>
              <div class="metric-value money">${formatMoney(s.income)}</div>
              <div class="metric-note">Total du mois en cours</div>
            </div>
            <div class="card metric-card">
              <div class="metric-label">Total engagé</div>
              <div class="metric-value money">${formatMoney(s.engaged)}</div>
              <div class="metric-note">Charges + crédits + projets + dépenses</div>
            </div>
          </div>
          <div class="card" style="margin-top:12px">
            <div class="balance-head"><strong>Revenus vs engagé</strong><span>${s.income > 0 ? `${Math.min(999, (s.engaged / s.income) * 100).toFixed(0)}%` : (s.engaged > 0 ? "—" : "0%")}</span></div>
            <div class="progress-track"><div class="progress-fill ${s.engaged > s.income && s.income > 0 ? "error" : ""}" style="width:${incomeProgress}%"></div></div>
          </div>
        </div>

        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Équilibre 50 / 30 / 20</h2><p class="section-subtitle">Répartition réelle par rapport aux revenus du mois.</p></div></div>
          <div class="card">${bucketCards}</div>
        </div>

        <div class="section">
          <div class="section-header">
            <div><h2 class="section-title">Charges fixes</h2><p class="section-subtitle">Le statut n'enlève pas la charge du montant engagé.</p></div>
            <button class="btn tonal small" data-add-type="fixed"><span class="material-symbols-outlined">add</span>Ajouter</button>
          </div>
          <div class="list">${chargesHtml}</div>
        </div>`;
    }

    function renderIncome() {
      const container = document.getElementById("screen-income");
      const items = [...state.incomes].sort((a,b) => String(b.date).localeCompare(String(a.date)));
      const currentTotal = sum(currentMonthIncomes(), x => x.amount);
      const listHtml = items.length ? items.map(item => `
        <div class="list-item">
          <div class="list-icon"><span class="material-symbols-outlined">arrow_downward</span></div>
          <div class="list-main">
            <div class="list-title">${escapeHtml(item.label)}</div>
            <div class="list-sub">${formatDate(item.date)}</div>
          </div>
          <div class="list-side"><div class="list-amount money positive">+${formatMoney(item.amount)}</div></div>
          <div class="item-actions"><button class="mini-btn" data-edit-type="income" data-edit-id="${item.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button></div>
        </div>`).join("") : emptyState("payments", "Aucun revenu", "Ajoute un salaire, un remboursement ou tout autre revenu.");

      container.innerHTML = `
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Revenus du mois</div>
            <div class="hero-value money">${formatMoney(currentTotal)}</div>
            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">calendar_month</span>${escapeHtml(new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(new Date()))}</span></div>
          </div>
        </div>
        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Historique</h2></div><button class="btn tonal small" data-add-type="income"><span class="material-symbols-outlined">add</span>Ajouter</button></div>
          <div class="list">${listHtml}</div>
        </div>`;
    }

    function renderExpenses() {
      const container = document.getElementById("screen-expenses");
      const normalizedSearch = expenseSearch.trim().toLowerCase();
      const filtered = [...state.expenses]
        .filter(item => expenseFilter === "Toutes" || item.category === expenseFilter)
        .filter(item => !normalizedSearch || `${item.label} ${item.category}`.toLowerCase().includes(normalizedSearch))
        .sort((a,b) => String(b.date).localeCompare(String(a.date)));

      const listHtml = filtered.length ? filtered.map(item => `
        <div class="list-item">
          <div class="list-icon"><span class="material-symbols-outlined">${categoryIcon(item.category)}</span></div>
          <div class="list-main">
            <div class="list-title">${escapeHtml(item.label)}</div>
            <div class="list-sub">${escapeHtml(item.category)} · ${formatDate(item.date)}</div>
          </div>
          <div class="list-side"><div class="list-amount money negative">−${formatMoney(item.amount)}</div></div>
          <div class="item-actions"><button class="mini-btn" data-edit-type="expense" data-edit-id="${item.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button></div>
        </div>`).join("") : emptyState("receipt_long", "Aucune dépense", "Les dépenses correspondant à tes filtres apparaîtront ici.");

      const chips = ["Toutes", ...EXPENSE_CATEGORIES].map(cat => `<button class="chip ${expenseFilter === cat ? "active" : ""}" data-expense-filter="${cat}">${cat}</button>`).join("");

      container.innerHTML = `
        <div class="section">
          <div class="search-shell">
            <span class="material-symbols-outlined">search</span>
            <input id="expenseSearch" type="search" placeholder="Rechercher un libellé ou une catégorie" autocomplete="off" value="${escapeHtml(expenseSearch)}">
            <button class="icon-btn mic-btn" id="micBtn" type="button" aria-label="Saisie vocale"><span class="material-symbols-outlined">mic</span></button>
          </div>
          <div class="chips">${chips}</div>
        </div>
        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Dépenses</h2><p class="section-subtitle"><span class="money">${formatMoney(sum(filtered, x => x.amount))}</span> dans la sélection</p></div><button class="btn tonal small" data-add-type="expense"><span class="material-symbols-outlined">add</span>Ajouter</button></div>
          <div class="list">${listHtml}</div>
        </div>`;

      const input = document.getElementById("expenseSearch");
      if (input) {
        input.addEventListener("input", e => {
          expenseSearch = e.target.value;
          renderExpenses();
          requestAnimationFrame(() => {
            const next = document.getElementById("expenseSearch");
            if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
          });
        });
      }
      const micBtn = document.getElementById("micBtn");
      if (micBtn) micBtn.addEventListener("click", startVoiceRecognition);
    }

    function categoryIcon(category) {
      return {
        "Courses": "shopping_cart",
        "Carburant": "local_gas_station",
        "Loisirs": "sports_esports",
        "Restaurant": "restaurant",
        "Santé": "medical_services",
        "Autre": "category"
      }[category] || "receipt_long";
    }

    function renderProfile() {
      const container = document.getElementById("screen-profile");
      const monthExpenses = currentMonthExpenses();

      const envelopesHtml = state.envelopes.length ? state.envelopes.map(env => {
        const spent = sum(monthExpenses.filter(x => env.category === "Toutes" || x.category === env.category), x => x.amount);
        const limit = safeNumber(env.limit);
        const pct = limit > 0 ? (spent / limit) * 100 : 0;
        return `
          <div class="card">
            <div class="section-header" style="margin:0 0 10px">
              <div><h3 class="section-title" style="font-size:16px">${escapeHtml(env.name)}</h3><p class="section-subtitle">${escapeHtml(env.category)} · <span class="money">${formatMoney(spent)}</span> / <span class="money">${formatMoney(limit)}</span></p></div>
              <button class="mini-btn" data-edit-type="envelope" data-edit-id="${env.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>
            </div>
            <div class="progress-track"><div class="progress-fill ${pct > 100 ? "error" : pct > 85 ? "warn" : ""}" style="width:${clamp(pct,0,100)}%"></div></div>
            <div class="tiny" style="margin-top:7px">${limit > 0 ? `${pct.toFixed(0)}% utilisé` : "Limite à définir"}</div>
          </div>`;
      }).join("") : emptyState("account_balance_wallet", "Aucune enveloppe", "Crée des plafonds mensuels par catégorie pour suivre tes dépenses.");

      const creditsHtml = state.credits.length ? state.credits.map(credit => {
        const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);
        return `
          <div class="card">
            <div class="section-header" style="margin:0 0 8px">
              <div><h3 class="section-title" style="font-size:16px">${escapeHtml(credit.name)}</h3><p class="section-subtitle">${rate.toFixed(2)}% · mensualité <span class="money">${formatMoney(credit.monthlyPayment)}</span></p></div>
              <button class="mini-btn" data-edit-type="credit" data-edit-id="${credit.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>
            </div>
            <div class="grid-2">
              <div><div class="tiny">Capital restant</div><strong class="money">${formatMoney(credit.balance)}</strong></div>
              <div><div class="tiny">Capital initial</div><strong class="money">${formatMoney(credit.principal)}</strong></div>
            </div>
            <div class="spacer-12"></div>
            <button class="btn outlined full" data-sim-credit="${credit.id}"><span class="material-symbols-outlined">calculate</span>Simuler un remboursement anticipé</button>
          </div>`;
      }).join("") : emptyState("credit_card", "Aucun crédit", "Ajoute un crédit pour suivre sa mensualité et simuler un surplus de remboursement.");

      const projectsHtml = state.projects.length ? state.projects.map(project => {
        const target = safeNumber(project.target);
        const current = safeNumber(project.current);
        const pct = target > 0 ? (current / target) * 100 : 0;
        return `
          <div class="card">
            <div class="section-header" style="margin:0 0 10px">
              <div><h3 class="section-title" style="font-size:16px">${escapeHtml(project.name)}</h3><p class="section-subtitle"><span class="money">${formatMoney(current)}</span> / <span class="money">${formatMoney(target)}</span> · allocation <span class="money">${formatMoney(project.monthlyAllocation)}</span>/mois</p></div>
              <button class="mini-btn" data-edit-type="project" data-edit-id="${project.id}" aria-label="Modifier"><span class="material-symbols-outlined">edit</span></button>
            </div>
            <div class="progress-track"><div class="progress-fill success" style="width:${clamp(pct,0,100)}%"></div></div>

      else document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.screen === currentScreen));

      document.getElementById("screenTitle").textContent = active?.dataset.title || "Budget";

        expense: "Dépense",
        income: "Revenu",

        project: "Projet d'épargne",
        envelope: "Enveloppe budgétaire"
      }[type] || "Élément";

    function collectionForType(type) {
      return {
        expense: "expenses",
        income: "incomes",
        fixed: "fixedCharges",
        credit: "credits",
        project: "projects",
        envelope: "envelopes"
      }[type];

    function getEntity(type, id) {
      const collection = collectionForType(type);
      return collection ? state[collection].find(x => x.id === id) : null;
    }

    function optionTags(options, selected) {
      return options.map(opt => {
        const value = typeof opt === "string" ? opt : opt.value;

        return `<option value="${escapeHtml(value)}" ${String(selected) === String(value) ? "selected" : ""}>${escapeHtml(label)}</option>`;

    function handleEntitySubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const fd = new FormData(form);
      const type = fd.get("entityType");
      const id = form.dataset.editId || null;
      const current = id ? getEntity(type, id) : null;
      let item;

      if (type === "expense") {
        item = {
          id: id || uid("exp"), label: String(fd.get("label") || "").trim(), amount: safeNumber(fd.get("amount")),
          date: fd.get("date") || todayISO(), category: fd.get("category") || "Autre", bucket: fd.get("bucket") || "needs"
        };
      } else if (type === "income") {
        item = { id: id || uid("inc"), label: String(fd.get("label") || "").trim(), amount: safeNumber(fd.get("amount")), date: fd.get("date") || todayISO() };
      } else if (type === "fixed") {
        item = {
          id: id || uid("fix"), label: String(fd.get("label") || "").trim(), amount: safeNumber(fd.get("amount")),
          day: clamp(Math.round(safeNumber(fd.get("day"), 1)), 1, 31), bucket: fd.get("bucket") || "needs", active: fd.get("active") === "on",
          paidMonths: current?.paidMonths || []
        };
      } else if (type === "credit") {
        const zeroRate = fd.get("zeroRate") === "on";
        const principal = safeNumber(fd.get("principal"));
        const balanceRaw = fd.get("balance");
        item = {
          id: id || uid("crd"), name: String(fd.get("name") || "").trim(), principal,
          balance: balanceRaw === "" || balanceRaw == null ? principal : safeNumber(balanceRaw),
          zeroRate, annualRate: zeroRate ? 0 : safeNumber(fd.get("annualRate")), monthlyPayment: safeNumber(fd.get("monthlyPayment")), active: fd.get("active") === "on"
        };
      } else if (type === "project") {
        item = {
          id: id || uid("prj"), name: String(fd.get("name") || "").trim(), target: safeNumber(fd.get("target")), current: safeNumber(fd.get("current")),
          monthlyAllocation: safeNumber(fd.get("monthlyAllocation")), active: fd.get("active") === "on"
        };
      } else if (type === "envelope") {
        item = { id: id || uid("env"), name: String(fd.get("name") || "").trim(), category: fd.get("category") || "Toutes", limit: safeNumber(fd.get("limit")) };
      } else return;

      const collection = collectionForType(type);
      if (!collection) return;
      if (id) {
        const idx = state[collection].findIndex(x => x.id === id);
        if (idx >= 0) state[collection][idx] = item;
      } else {
        state[collection].push(item);
      }
      closeModal("entityModal");
      saveState(`${entityLabel(type)} ${id ? "modifié" : "ajouté"}.`);
    }

    function deleteEntity(type, id) {
      const collection = collectionForType(type);
      if (!collection) return;
      const item = getEntity(type, id);
      if (!item) return;
      if (!confirm(`Supprimer définitivement « ${item.label || item.name || entityLabel(type)} » ?`)) return;
      state[collection] = state[collection].filter(x => x.id !== id);
      closeModal("entityModal");
      saveState(`${entityLabel(type)} supprimé.`);
    }

    function toggleChargePaid(id) {
      const charge = state.fixedCharges.find(x => x.id === id);
      if (!charge) return;
      const mk = monthKey();
      charge.paidMonths = Array.isArray(charge.paidMonths) ? charge.paidMonths : [];
      if (charge.paidMonths.includes(mk)) charge.paidMonths = charge.paidMonths.filter(x => x !== mk);
      else charge.paidMonths.push(mk);
      saveState(charge.paidMonths.includes(mk) ? "Charge marquée comme prélevée." : "Charge marquée comme à venir.");
    }

    function amortization(balance, annualRate, monthlyPayment, extra = 0) {
      let principal = Math.max(0, safeNumber(balance));
      const rate = Math.max(0, safeNumber(annualRate)) / 100 / 12;
      const payment = Math.max(0, safeNumber(monthlyPayment) + safeNumber(extra));
      if (principal <= 0) return { valid: true, months: 0, interest: 0, totalPaid: 0 };
      if (payment <= 0) return { valid: false, reason: "Mensualité insuffisante" };

      if (rate === 0) {
        const months = Math.ceil(principal / payment);
        return { valid: true, months, interest: 0, totalPaid: principal };
      }

      if (payment <= principal * rate) return { valid: false, reason: "La mensualité ne couvre pas les intérêts mensuels." };

      let months = 0;
      let interestTotal = 0;
      let guard = 0;
      while (principal > 0.005 && guard < 2400) {
        const interest = principal * rate;
        interestTotal += interest;
        const capitalPaid = Math.max(0, payment - interest);
        if (capitalPaid <= 0) return { valid: false, reason: "Amortissement impossible avec cette mensualité." };
        principal -= Math.min(principal, capitalPaid);
        months += 1;
        guard += 1;
      }
      if (guard >= 2400) return { valid: false, reason: "Durée supérieure à 200 ans." };
      return { valid: true, months, interest: interestTotal, totalPaid: safeNumber(balance) + interestTotal };
    }

    function openCreditSimulator(id) {
      const credit = state.credits.find(x => x.id === id);
      if (!credit) return;
      const body = document.getElementById("creditSimBody");
      body.dataset.creditId = id;
      body.innerHTML = `
        <div class="card">
          <div class="section-header" style="margin:0 0 6px"><div><h3 class="section-title">${escapeHtml(credit.name)}</h3><p class="section-subtitle">Capital restant : <span class="money">${formatMoney(credit.balance)}</span></p></div></div>
          <div class="range-row">
            <div class="balance-head"><strong>Surplus mensuel</strong><span class="money" id="extraPaymentLabel">${formatMoney(0)}</span></div>
            <input id="extraPaymentRange" type="range" min="0" max="${Math.max(100, Math.ceil(Math.max(safeNumber(credit.monthlyPayment) * 3, safeNumber(credit.balance) / 12, 100) / 50) * 50)}" step="10" value="0">
          </div>
          <div id="simResults"></div>
        </div>
        <div class="tiny" style="margin-top:12px">Simulation indicative basée sur le capital restant, le taux annuel et la mensualité saisis. Aucun frais, assurance ou pénalité contractuelle n'est ajouté.</div>`;
      const range = document.getElementById("extraPaymentRange");
      range.addEventListener("input", () => updateCreditSimulation(credit, safeNumber(range.value)));
      updateCreditSimulation(credit, 0);
      openModal("creditSimModal");
    }

    function updateCreditSimulation(credit, extra) {
      document.getElementById("extraPaymentLabel").textContent = formatMoney(extra);
      const rate = credit.zeroRate ? 0 : safeNumber(credit.annualRate);
      const base = amortization(credit.balance, rate, credit.monthlyPayment, 0);
      const boosted = amortization(credit.balance, rate, credit.monthlyPayment, extra);
      const box = document.getElementById("simResults");
      if (!base.valid || !boosted.valid) {
        box.innerHTML = `<div class="card danger-zone"><strong>Simulation impossible</strong><div class="tiny" style="margin-top:6px">${escapeHtml(boosted.reason || base.reason || "Vérifie les informations du crédit.")}</div></div>`;
        return;
      }
      const monthsSaved = Math.max(0, base.months - boosted.months);
      const interestSaved = Math.max(0, base.interest - boosted.interest);
      box.innerHTML = `
        <div class="sim-grid">
          <div class="sim-box"><span>Durée avec surplus</span><strong>${boosted.months} mois</strong></div>
          <div class="sim-box"><span>Mois gagnés</span><strong>${monthsSaved}</strong></div>
          <div class="sim-box"><span>Intérêts estimés</span><strong class="money">${formatMoney(boosted.interest)}</strong></div>
          <div class="sim-box"><span>Intérêts économisés</span><strong class="money positive">${formatMoney(interestSaved)}</strong></div>
        </div>`;
    }

    function normalizeVoice(text) {
      return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function voiceCategory(normalized) {
      const rules = [
        ["Courses", ["course", "courses", "alimentation", "alimentaire", "supermarche", "epicerie", "auchan", "carrefour", "lidl", "leclerc", "monoprix"]],
        ["Carburant", ["carburant", "essence", "diesel", "station", "gazole"]],
        ["Loisirs", ["loisir", "cinema", "jeu", "jeux", "concert", "sortie"]],
        ["Restaurant", ["restaurant", "resto", "cafe", "bar", "uber eats", "deliveroo"]],
        ["Santé", ["sante", "medecin", "pharmacie", "dentiste", "kine", "hopital"]]
      ];
      for (const [cat, words] of rules) if (words.some(word => normalized.includes(word))) return cat;
      return "Autre";
    }

    function parseVoiceCommand(transcript) {
      const normalized = normalizeVoice(transcript);
      const amountMatch = normalized.match(/(\d+(?:[.,]\d+)?)\s*(?:€|euros?|eur)\b/);
      const percentageMatch = normalized.match(/(\d+(?:[.,]\d+)?)\s*(?:%|pour\s*cent|pourcent)\b/);
      const numberAmount = amountMatch ? safeNumber(amountMatch[1]) : 0;

      const merchantMatch = normalized.match(/(?:chez|\ba\b|\bau\b)\s+([a-z0-9&' -]+?)(?=\s+(?:dans|en|pour|categorie|catégorie|avec|au taux|a\s+\d+(?:[.,]\d+)?\s*(?:%|pourcent|pour\s*cent))|$)/i);
      let merchant = merchantMatch ? merchantMatch[1].trim().replace(/\s+/g, " ") : "";
      if (/^\d/.test(merchant) || /pour\s*cent|pourcent|%/.test(merchant)) merchant = "";

      if (/(credit|pret|emprunt)/.test(normalized)) {
        if (!numberAmount) return { ok: false, message: "Je n'ai pas trouvé le montant du crédit." };
        const rate = percentageMatch ? safeNumber(percentageMatch[1]) : 0;
        const credit = {
          id: uid("crd"),
          name: merchant ? `Crédit ${capitalizeWords(merchant)}` : "Crédit vocal",
          principal: numberAmount,
          balance: numberAmount,
          zeroRate: rate === 0,
          annualRate: rate,
          monthlyPayment: 0,
          active: true
        };
        return { ok: true, type: "credit", item: credit, message: "Crédit ajouté. Complète sa mensualité dans Profil pour activer une simulation fiable." };
      }

      if (/(revenu|salaire|remboursement|recu|reçoit|recois|gagne|gagné)/.test(normalized) && !/(depense|depensé|paye|payé|achete|acheté)/.test(normalized)) {
        if (!numberAmount) return { ok: false, message: "Je n'ai pas trouvé le montant du revenu." };
        const income = {
          id: uid("inc"),
          label: merchant ? capitalizeWords(merchant) : "Revenu vocal",
          amount: numberAmount,
          date: todayISO()
        };
        return { ok: true, type: "income", item: income, message: `Revenu de ${formatMoney(numberAmount)} ajouté.` };
      }

      if (!numberAmount) return { ok: false, message: "Je n'ai pas trouvé de montant en euros dans la phrase." };
      const category = voiceCategory(normalized);
      const expense = {
        id: uid("exp"),
        label: merchant ? capitalizeWords(merchant) : "Dépense vocale",
        amount: numberAmount,
        date: todayISO(),
        category,
        bucket: defaultBucketForCategory(category)
      };
      return { ok: true, type: "expense", item: expense, message: `${formatMoney(numberAmount)} ajouté dans ${category}.` };
    }

    function capitalizeWords(value) {
      return String(value || "").replace(/\b\w/g, char => char.toUpperCase());
    }

    function startVoiceRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const micBtn = document.getElementById("micBtn");
      if (!SpeechRecognition) {
        showSnackbar("La reconnaissance vocale Web Speech n'est pas disponible dans ce navigateur.");
        return;
      }
      if (recognition) {
        recognition.abort();
        recognition = null;
        micBtn?.classList.remove("listening");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = "fr-FR";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        document.getElementById("micBtn")?.classList.add("listening");
        showSnackbar("J'écoute… Exemple : « J'ai dépensé 35 euros à Auchan dans alimentation ».");
      };
      recognition.onresult = event => {
        const transcript = event.results?.[0]?.[0]?.transcript || "";
        const parsed = parseVoiceCommand(transcript);
        if (!parsed.ok) {
          showSnackbar(parsed.message);
          return;
        }
        const collection = collectionForType(parsed.type);
        if (collection) {
          state[collection].push(parsed.item);
          saveState(parsed.message);
        }
      };
      recognition.onerror = event => {
        const map = { "not-allowed": "Autorisation du microphone refusée.", "no-speech": "Aucune parole détectée.", "network": "Le service vocal n'est pas disponible pour le moment." };
        showSnackbar(map[event.error] || "La reconnaissance vocale a échoué.");
      };
      recognition.onend = () => {
        document.getElementById("micBtn")?.classList.remove("listening");
        recognition = null;
      };
      recognition.start();
    }

    function exportJSON() {
      const payload = { ...state, exportedAt: new Date().toISOString() };
      downloadBlob(`budget-${todayISO()}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      showSnackbar("Sauvegarde JSON exportée.");
    }

    function csvEscape(value) {
      const str = String(value ?? "");
      return /[;"\n\r]/.test(str) ? `"${str.replaceAll('"', '""')}"` : str;
    }

    function exportCSV() {
      const headers = ["type","id","libelle","montant","date","categorie","affectation","jour","actif","capital_initial","capital_restant","taux_annuel","mensualite","objectif","epargne_actuelle","allocation_mensuelle","plafond"];
      const rows = [];
      state.expenses.forEach(x => rows.push(["depense",x.id,x.label,x.amount,x.date,x.category,x.bucket,"","","","","","","","","",""]));
      state.incomes.forEach(x => rows.push(["revenu",x.id,x.label,x.amount,x.date,"","","","","","","","","","","",""]));
      state.fixedCharges.forEach(x => rows.push(["charge_fixe",x.id,x.label,x.amount,"","",x.bucket,x.day,x.active !== false,"","","","","","","",""]));
      state.credits.forEach(x => rows.push(["credit",x.id,x.name,"","","","savings","",x.active !== false,x.principal,x.balance,x.zeroRate ? 0 : x.annualRate,x.monthlyPayment,"","","",""]));
      state.projects.forEach(x => rows.push(["projet_epargne",x.id,x.name,"","","","savings","",x.active !== false,"","","","",x.target,x.current,x.monthlyAllocation,""]));
      state.envelopes.forEach(x => rows.push(["enveloppe",x.id,x.name,"","",x.category,"","","","","","","","","","",x.limit]));
      const csv = [headers, ...rows].map(row => row.map(csvEscape).join(";")).join("\r\n");
      downloadBlob(`budget-${todayISO()}.csv`, `\uFEFF${csv}`, "text/csv;charset=utf-8");
      showSnackbar("Export CSV généré.");
    }

    function downloadBlob(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function importJSONFile(file) {
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const migrated = migrateState(parsed);
        if (!confirm("Importer ce fichier remplacera les données actuellement enregistrées sur cet appareil. Continuer ?")) return;
        state = migrated;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        showSnackbar("Sauvegarde JSON importée.");
        renderAll();
      } catch (error) {
        console.error(error);
        showSnackbar("Fichier JSON invalide ou illisible.");
      } finally {
        document.getElementById("jsonImportInput").value = "";
      }
    }

    function resetAllData() {
      if (!confirm("Effacer définitivement toutes les données de cette application sur cet appareil ?")) return;
      state = EMPTY_STATE();
      localStorage.removeItem(STORAGE_KEY);
      saveState("Toutes les données ont été effacées.");
      setCurrentScreen("home");
    }

    document.getElementById("privacyBtn").addEventListener("click", () => {
      state.settings.privacy = !state.settings.privacy;
      saveState();
    });

    document.getElementById("fabAdd").addEventListener("click", () => openEntityModal("expense"));
    document.getElementById("entityForm").addEventListener("submit", handleEntitySubmit);

    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-screen]");
      if (nav) setCurrentScreen(nav.dataset.screen);

      const add = event.target.closest("[data-add-type]");
      if (add) openEntityModal(add.dataset.addType);

      const edit = event.target.closest("[data-edit-type]");
      if (edit) openEntityModal(edit.dataset.editType, edit.dataset.editId);

      const close = event.target.closest("[data-close-modal]");
      if (close) closeModal(close.dataset.closeModal);

      const charge = event.target.closest("[data-toggle-charge]");
      if (charge) toggleChargePaid(charge.dataset.toggleCharge);

      const filter = event.target.closest("[data-expense-filter]");
      if (filter) { expenseFilter = filter.dataset.expenseFilter; renderExpenses(); }

      const theme = event.target.closest("[data-theme-choice]");
      if (theme) {
        state.settings.theme = theme.dataset.themeChoice;
        saveState("Apparence mise à jour.");
      }

      const simulator = event.target.closest("[data-sim-credit]");
      if (simulator) openCreditSimulator(simulator.dataset.simCredit);

      if (event.target.id === "exportJsonBtn" || event.target.closest("#exportJsonBtn")) exportJSON();
      if (event.target.id === "exportCsvBtn" || event.target.closest("#exportCsvBtn")) exportCSV();
      if (event.target.id === "importJsonBtn" || event.target.closest("#importJsonBtn")) document.getElementById("jsonImportInput").click();
      if (event.target.id === "resetBtn" || event.target.closest("#resetBtn")) resetAllData();
    });

    document.querySelectorAll(".sheet-backdrop").forEach(backdrop => {
      backdrop.addEventListener("click", event => {
        if (event.target === backdrop) closeModal(backdrop.id);
      });
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") document.querySelectorAll(".sheet-backdrop.open").forEach(el => closeModal(el.id));
    });

    document.getElementById("jsonImportInput").addEventListener("change", event => {
      const file = event.target.files?.[0];
      if (file) importJSONFile(file);
    });

    if (window.matchMedia) {
      const media = window.matchMedia("(prefers-color-scheme: dark)");
      const onSystemThemeChange = () => { if (state.settings.theme === "auto") applyTheme(); };
      if (media.addEventListener) media.addEventListener("change", onSystemThemeChange);
      else if (media.addListener) media.addListener(onSystemThemeChange);
    }

    renderAll();
  </script>
</body>
</html>
