  <title>Budget Pixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,0" rel="stylesheet">
  <style>
    :root {
      --primary: #0b57d0;
      --on-primary: #ffffff;
      --primary-container: #d3e3fd;
      --on-primary-container: #041e49;
      --secondary: #44546f;
      --on-secondary: #ffffff;
      --secondary-container: #dce3f2;
      --on-secondary-container: #111c2f;
      --tertiary: #3f6379;
      --tertiary-container: #cbe6f5;
      --on-tertiary-container: #071e2b;
      --surface: #f8fafd;
      --surface-dim: #d9dce2;
      --surface-bright: #f8fafd;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f3f6fb;
      --surface-container: #edf1f7;
      --surface-container-high: #e7ebf2;
      --surface-container-highest: #e0e5ec;
      --on-surface: #1b1b1f;
      --on-surface-variant: #44474e;
      --outline: #74777f;

      --error-container: #f9dedc;

      --warning: #7a5900;

      --radius-small: 16px;

      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --nav-height: 78px;
      --content-max: 760px;
    }

    html[data-theme="dark"] {
      --primary: #a8c7fa;
      --on-primary: #062e6f;
      --primary-container: #0842a0;
      --on-primary-container: #d3e3fd;
      --secondary: #bcc7dc;
      --on-secondary: #263141;
      --secondary-container: #3c4858;
      --on-secondary-container: #dce3f2;
      --tertiary: #afcbe0;
      --tertiary-container: #294c60;
      --on-tertiary-container: #cbe6f5;
      --surface: #111318;
      --surface-dim: #111318;
      --surface-bright: #37393e;
      --surface-container-lowest: #0c0e12;
      --surface-container-low: #191c20;
      --surface-container: #1d2024;
      --surface-container-high: #272a2f;
      --surface-container-highest: #32353a;
      --on-surface: #e2e2e9;
      --on-surface-variant: #c4c7cf;
      --outline: #8e9199;
      --outline-variant: #44474e;
      --error: #f2b8b5;
      --on-error: #601410;
      --error-container: #8c1d18;
      --on-error-container: #f9dedc;
      --success: #9dd67c;
      --success-container: #22510d;
      --warning: #f4bd47;
      --warning-container: #5a4100;
      --shadow: rgba(0,0,0,.48);
      --scrim: rgba(0,0,0,.62);
    }

    html[data-theme="dsfr"] {
      --surface: #f6f6fe;
      --surface-dim: #eeeeee;
      --surface-bright: #ffffff;
      --surface-container-lowest: #ffffff;
      --surface-container-low: #f6f6fe;
      --surface-container: #eeeeee;
      --surface-container-high: #e3e3e3;
      --surface-container-highest: #dddddd;
      --on-surface: #161616;
      --on-surface-variant: #666666;
      --primary: #000091;
      --on-primary: #ffffff;
      --primary-container: #ececfe;
      --on-primary-container: #000091;
      --secondary: #666666;
      --on-secondary: #ffffff;
      --secondary-container: #e3e3fd;
      --on-secondary-container: #000091;
      --tertiary: #666666;
      --tertiary-container: #e3e3e3;
      --on-tertiary-container: #161616;
      --outline: #929292;
      --outline-variant: #dddddd;
      --error: #ce0500;
      --on-error: #ffffff;
      --error-container: #fce5e3;
      --on-error-container: #ce0500;
      --success: #18753c;
      --success-container: #b7f5ca;
      --warning: #b34000;
      --warning-container: #fee7d6;
      --shadow: rgba(0,0,0,.12);
      --scrim: rgba(0,0,0,.48);
      --radius-card: 8px;
      --radius-sheet: 8px;
      --radius-small: 4px;
      --pill: 4px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: var(--surface); }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 88% -10%, color-mix(in srgb, var(--primary-container) 60%, transparent), transparent 34%),
        var(--surface);
      color: var(--on-surface);
      font-family: "Google Sans", "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 28%, transparent);
      outline-offset: 2px;
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
      font-size: 24px;
      line-height: 1;
      user-select: none;
    }

    .app-shell {
      width: min(100%, var(--content-max));
      min-height: 100dvh;
      margin: 0 auto;
      position: relative;
      padding-bottom: calc(var(--nav-height) + 54px + var(--safe-bottom));
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: calc(8px + var(--safe-top)) 18px 8px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
    }

    .brand { min-width: 0; flex: 1; }
    .top-account-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 65%, transparent);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--surface-container-lowest);
      color: var(--primary);
      cursor: pointer;
      box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow) 35%, transparent);
    }
    .top-account-btn:active { transform: scale(.94); }
    .top-account-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .account-letter { font-size: 21px; font-weight: 700; font-family: Arial, sans-serif; }
    .account-modal-profile { display:flex; align-items:center; gap:14px; padding:8px 2px 18px; }
    .account-modal-avatar { width:58px; height:58px; flex:0 0 58px; border-radius:50%; overflow:hidden; display:grid; place-items:center; background:var(--primary-container); color:var(--on-primary-container); font-size:24px; font-weight:700; }
    .account-modal-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .account-modal-name { font-weight:700; font-size:17px; }
    .account-modal-email { margin-top:3px; color:var(--on-surface-variant); font-size:13px; overflow-wrap:anywhere; }
    .cloud-status { display:flex; align-items:center; gap:8px; padding:12px 14px; border-radius:18px; background:var(--surface-container); color:var(--on-surface-variant); font-size:13px; margin-bottom:14px; }
    .home-search-wrap { margin: 2px 0 18px; }
    .home-search-results { display:grid; gap:10px; margin-top:10px; }
    .search-result-type { font-size:11px; color:var(--on-surface-variant); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
    .brand-eyebrow {
      margin: 0;
      color: var(--on-surface-variant);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .brand-title {
      margin: 0;
      font-size: clamp(23px, 6.7vw, 30px);
      font-weight: 700;
      letter-spacing: -.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: var(--pill);
      display: grid;
      place-items: center;
      background: var(--surface-container-high);
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn:hover { background: var(--surface-container-highest); }

    main { padding: 10px 16px 20px; }
    .screen { display: none; animation: screenIn .22s ease; }
    .screen.active { display: block; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .section { margin: 18px 0 26px; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 12px;
    }
    .section-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.01em;
    }
    .section-subtitle {
      margin: 3px 0 0;
      color: var(--on-surface-variant);
      font-size: 13px;
    }

    .card {
      background: var(--surface-container-low);
      border-radius: var(--radius-card);
      padding: 18px;
      border: 1px solid color-mix(in srgb, var(--outline-variant) 60%, transparent);
      box-shadow: 0 1px 0 color-mix(in srgb, var(--on-surface) 3%, transparent);
    }
    .card + .card { margin-top: 12px; }
    .hero-card {
      padding: 22px;
      background: linear-gradient(145deg, var(--primary-container), color-mix(in srgb, var(--primary-container) 54%, var(--surface-container-low)));
      border-color: transparent;
      overflow: hidden;
      position: relative;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      right: -92px;
      top: -112px;
      background: color-mix(in srgb, var(--primary) 11%, transparent);
      pointer-events: none;
    }
    .hero-card > * { position: relative; z-index: 1; }
    .hero-privacy-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      width: 42px;
      height: 42px;
      background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent);
      color: var(--on-primary-container);
    }
    .hero-label { color: var(--on-primary-container); font-size: 14px; font-weight: 600; }
    .hero-value {
      margin-top: 8px;
      color: var(--on-primary-container);
      font-size: clamp(38px, 12vw, 54px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.05em;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .daily-pill, .status-pill, .chip, .small-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 34px;
      padding: 7px 12px;
      border-radius: var(--pill);
      font-size: 13px;
      font-weight: 600;
    }
    .daily-pill { background: color-mix(in srgb, var(--surface-container-lowest) 72%, transparent); color: var(--on-surface); }
    .status-pill.neutral { background: var(--surface-container-highest); color: var(--on-surface-variant); }
    .status-pill.controlled { background: var(--success-container); color: var(--success); }
    .status-pill.tension { background: var(--warning-container); color: var(--warning); }
    .status-pill.deficit { background: var(--error-container); color: var(--on-error-container); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .metric-card { min-height: 118px; }
    .metric-label { color: var(--on-surface-variant); font-size: 13px; }
    .metric-value { margin-top: 8px; font-size: 24px; font-weight: 700; letter-spacing: -.025em; }
    .metric-note { margin-top: 6px; color: var(--on-surface-variant); font-size: 12px; }
    .home-summary-section { margin-top: 14px; margin-bottom: 18px; }
    .summary-card { padding: 18px; }
    .summary-card .hero-value { font-size: clamp(36px, 10vw, 48px); margin-top: 6px; }
    .summary-card .hero-meta { margin-top: 14px; gap: 8px; flex-wrap: nowrap; }
    .summary-card .daily-pill, .summary-card .status-pill { min-height: 32px; padding: 6px 10px; font-size: 12px; white-space: nowrap; }
    .summary-card .hero-privacy-btn { width: 40px; height: 40px; top: 12px; right: 12px; }
    .summary-bottom {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid color-mix(in srgb, var(--on-primary-container) 14%, transparent);
    }
    .summary-mini {
      min-width: 0;
      padding: 10px 8px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--surface-container-lowest) 58%, transparent);
      overflow: visible;
    }
    .summary-mini-label { display:block; color:var(--on-surface-variant); font-size:clamp(9px,2.8vw,11px); font-weight:600; white-space:nowrap; letter-spacing:-.01em; }
    .summary-mini-value { display:block; margin-top:3px; color:var(--on-primary-container); font-size:clamp(13px,4vw,19px); font-weight:700; line-height:1.15; letter-spacing:-.035em; white-space:nowrap; }
    .summary-mini-note { margin-top:3px; color:var(--on-surface-variant); font-size:clamp(8px,2.35vw,10px); line-height:1.1; white-space:nowrap; letter-spacing:-.01em; }
    .summary-card::after { display: none; }
    .balance-section-subtitle {
      white-space: nowrap;
      font-size: clamp(10.5px, 3.1vw, 12px);
      letter-spacing: -.01em;
    }
    .month-switcher {
      height: 46px;
      display: grid;
      grid-template-columns: 42px minmax(0,1fr) 42px;
      align-items: center;
      gap: 6px;
      padding: 3px 5px;
      margin: 4px 0 12px;
      border-radius: var(--pill);
      background: var(--surface-container-low);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 55%, transparent);
    }
    .month-switcher button {
      border: 0;
      background: transparent;
      color: var(--on-surface);
      cursor: pointer;
    }
    .month-arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .month-arrow:active { background: var(--surface-container-highest); }
    .month-current {
      min-width: 0;
      height: 38px;
      border-radius: var(--pill);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      text-transform: capitalize;
    }
    .month-current .material-symbols-outlined { font-size: 19px; color: var(--primary); }

    #entityModal[data-entity-type="expense"] .sheet {
      height: auto;
      max-height: min(52dvh, 610px);
    }
    #entityModal[data-entity-type="expense"] .sheet-head { padding-top: 5px; padding-bottom: 4px; }
    #entityModal[data-entity-type="expense"] .sheet-title { font-size: 20px; }
    #entityModal[data-entity-type="expense"] .sheet-body { flex: 0 1 auto; min-height: 0; padding-top: 2px; padding-bottom: 8px; }
    #entityModal[data-entity-type="expense"] .field { gap: 4px; margin: 7px 0; }
    #entityModal[data-entity-type="expense"] .field label { font-size: 12px; }
    #entityModal[data-entity-type="expense"] .field input,
    #entityModal[data-entity-type="expense"] .field select { min-height: 44px; padding: 8px 11px; border-radius: 15px; }
    #entityModal[data-entity-type="expense"] .field-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    #entityModal[data-entity-type="expense"] .modal-actions { padding-top: 7px; }
    #entityModal[data-entity-type="expense"] .modal-actions .btn { min-height: 46px; }

    .progress-track {
      width: 100%;
      height: 9px;
      border-radius: var(--pill);
      background: var(--surface-container-highest);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--primary);
      transition: width .3s ease;
    }
    .progress-fill.warn { background: var(--warning); }
    .progress-fill.error { background: var(--error); }
    .progress-fill.success { background: var(--success); }

    .balance-row { margin: 15px 0; }
    .balance-head { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; }
    .balance-label { min-width:0; display:flex; align-items:center; gap:7px; white-space:nowrap; }
    .balance-label strong { min-width:0; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
    .target-badge { flex:0 0 auto; min-width:38px; padding:4px 7px; border-radius:var(--pill); background:var(--primary-container); color:var(--on-primary-container); font-size:11px; font-weight:700; text-align:center; }
    .balance-value { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-align:right; }
    .balance-pct { color:var(--on-surface-variant); font-size:12px; }

    .list { display: grid; gap: 10px; }
    .list-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 20px;
      background: var(--surface-container);
      border: 1px solid color-mix(in srgb, var(--outline-variant) 50%, transparent);
    }
    .list-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--secondary-container);
      color: var(--on-secondary-container);
    }
    .list-main { min-width: 0; flex: 1; }
    .list-title { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub { margin-top: 3px; color: var(--on-surface-variant); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-side { text-align: right; flex: 0 0 auto; }
    .list-amount { font-weight: 700; font-size: 15px; }
    .income-list-item { cursor: pointer; }
    .income-list-item:active { opacity: .82; }
    .expense-list-item,
    .fixed-charge-row { cursor: pointer; }
    .income-list-item:active,
    .expense-list-item:active,
    .fixed-charge-row:active { opacity: .82; }
    .income-list-item .list-side,
    .expense-list-item .list-side,
    .fixed-charge-row .list-side { margin-left: auto; }
    .expense-sort { position: relative; flex: 0 0 auto; }
    .expense-filter-button,
    .expense-sort-toggle { width: 42px; height: 42px; padding: 0 !important; }
    .expense-filter-button .material-symbols-outlined,
    .expense-sort-toggle .material-symbols-outlined { font-size: 21px; }
    .operation-filter-toggle,
    .operation-sort-toggle { width: 42px; height: 42px; padding: 0 !important; }
    .operation-filter-toggle .material-symbols-outlined,
    .operation-sort-toggle .material-symbols-outlined { font-size: 21px; }
    .expense-sort-menu {
      position: absolute;
      z-index: 5;
      top: calc(100% + 6px);
      right: 0;
      min-width: 178px;
      padding: 5px;
      border: 1px solid var(--outline-variant);
      border-radius: var(--radius-small);
      background: var(--surface-container-lowest);
      box-shadow: 0 8px 22px var(--shadow);
    }
    .expense-sort-option {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border: 0;
      border-radius: var(--radius-small);
      background: transparent;
      color: var(--on-surface);
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }
    .expense-sort-option:hover,
    .expense-sort-option.active { background: var(--primary-container); color: var(--on-primary-container); }
    .expense-sort-option .material-symbols-outlined { width: 18px; font-size: 18px; }
    .expense-category-group {
      border: 1px solid color-mix(in srgb, var(--outline-variant) 72%, transparent);
      border-radius: var(--radius-small);
      background: var(--surface-container-low);
      overflow: hidden;
    }
    .expense-category-group + .expense-category-group { margin-top: 12px; }
    .expense-category-summary {
      min-height: 58px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .expense-category-summary::-webkit-details-marker { display: none; }
    .expense-category-summary:active { opacity: .82; }
    .expense-category-label { color: var(--on-surface-variant); font-size: 12px; font-weight: 700; letter-spacing: .01em; }
    .expense-category-meta { margin-top: 2px; color: var(--on-surface-variant); font-size: 11px; }
    .expense-category-total { font-size: 14px; font-weight: 700; white-space: nowrap; text-align: right; }

    function normalizeHealthReimbursement(value) {
      const raw = value && typeof value === "object" ? value : {};
      const ss = raw.socialSecurity && typeof raw.socialSecurity === "object" ? raw.socialSecurity : {};
      const mutual = raw.mutual && typeof raw.mutual === "object" ? raw.mutual : {};
      return {
        tracked: raw.tracked === true,
        completed: raw.completed === true,
        completedAt: String(raw.completedAt || ""),
        socialSecurity: { amount: Math.max(0, safeNumber(ss.amount)), date: String(ss.date || "") },
        mutual: { amount: Math.max(0, safeNumber(mutual.amount)), date: String(mutual.date || "") }
      };
    }

    function healthReimbursementSummary(expense) {
      if (!expense || expense.category !== "Santé") return null;
      const reimbursement = normalizeHealthReimbursement(expense.healthReimbursement);
      if (!reimbursement.tracked) return null;
      const gross = Math.max(0, safeNumber(expense.amount));
      const socialSecurityAmount = reimbursement.socialSecurity.amount;
      const mutualAmount = reimbursement.mutual.amount;
      const total = socialSecurityAmount + mutualAmount;
      const percent = gross > 0 ? total / gross * 100 : 0;
      const remaining = Math.max(0, gross - total);
      const status = total <= .005 ? "En attente" : total + .005 < gross ? "Partiellement remboursé" : "Remboursé";
      return { reimbursement, gross, socialSecurityAmount, mutualAmount, total, percent, remaining, status };
    }

    function healthReimbursementOperationRows(expense) {
      const summary = healthReimbursementSummary(expense);
      if (!summary) return [];
      return [
        ["socialSecurity", "Sécurité sociale", "health_and_safety"],
        ["mutual", "Mutuelle", "verified_user"]

      });

    const euro = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function uid(prefix = "id") {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function safeNumber(value, fallback = 0) {
      const n = Number(String(value ?? "").replace(/\s/g, "").replace(",", "."));
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;

    function monthKey(date = new Date()) {

      return new Date(year, month, 0).getDate();
    }

    function averageDayCount() {
      const current = monthKey();
      if (selectedMonth === current) return Math.max(1, new Date().getDate());
      return Math.max(1, daysInSelectedMonth());
    }

    function defaultDateForSelectedMonth() {
      if (selectedMonth === monthKey()) return todayISO();
      const todayDay = new Date().getDate();
      return `${selectedMonth}-${String(Math.min(todayDay, daysInSelectedMonth())).padStart(2, "0")}`;
    }

      monthPickerContext = context === "reimbursement" ? "reimbursement" : "budget";
      const targetMonth = monthPickerContext === "reimbursement" ? reimbursementTrackingMonth : selectedMonth;

        document.body.insertAdjacentHTML("beforeend", `

        modal = document.getElementById("monthPickerModal");

      const title = document.getElementById("monthPickerTitle");
      if (title) title.textContent = monthPickerContext === "reimbursement" ? "Mois du suivi" : "Choisir un mois";
      renderMonthPicker();
      modal.classList.add("open");
    }

    function renderMonthPicker() {
      const body = document.getElementById("monthPickerBody");
      if (!body) return;
      const targetMonth = monthPickerContext === "reimbursement" ? reimbursementTrackingMonth : selectedMonth;
      const currentMonthIndex = Number(targetMonth.slice(5, 7)) - 1;
      const selectedYear = Number(targetMonth.slice(0, 4));
      const labels = Array.from({ length: 12 }, (_, index) => new Intl.DateTimeFormat("fr-FR", { month: "long" }).format(new Date(2026, index, 1)));
      body.innerHTML = `
        <div class="month-picker-year-row">

          <button class="month-picker-year-btn" data-picker-year="1" aria-label="Année suivante"><span class="material-symbols-outlined">chevron_right</span></button>
        </div>
        <div class="month-picker-grid">
          ${labels.map((label, index) => {
            const active = monthPickerYear === selectedYear && index === currentMonthIndex;
            return `<button class="month-picker-option ${active ? "active" : ""}" data-picker-month="${index}">${escapeHtml(label)}</button>`;
          }).join("")}
        </div>`;
    }

    function formatMoney(value) {
      return euro.format(safeNumber(value));
    }

    function moneyInputMarkup(name, value, attributes = "") {
      return `<input name="${name}" type="text" data-money-input data-money-initial="${safeNumber(value)}" inputmode="numeric" autocomplete="off" value="${escapeHtml(formatMoney(value))}" ${attributes}>`;
    }

    function moneyInputValue(form, name) {
      const input = form.querySelector(`[name="${name}"][data-money-input]`);
      if (input) return Number(input.dataset.moneyDigits || 0) / 100;
      return safeNumber(new FormData(form).get(name));
    }

    function setMoneyInputDigits(input, digits) {
      const normalized = String(digits || "").replace(/\D/g, "").replace(/^0+(?=\d)/, "");
      input.dataset.moneyDigits = normalized;
      input.value = formatMoney(Number(normalized || 0) / 100);
    }

    function enhanceMoneyInputs(root) {
      root.querySelectorAll("[data-money-input]").forEach(input => {
        const initialCents = Math.max(0, Math.round(safeNumber(input.dataset.moneyInitial) * 100));
        setMoneyInputDigits(input, initialCents ? String(initialCents) : "");

        input.addEventListener("focus", () => {
          input.select();
        });
        input.addEventListener("keydown", event => {
          const digitMatch = /^(Digit|Numpad)([0-9])$/.exec(event.code || "");
          if (digitMatch) {
            event.preventDefault();
            setMoneyInputDigits(input, `${input.dataset.moneyDigits || ""}${digitMatch[2]}`);
          } else if (event.key === "Backspace") {
            event.preventDefault();
            setMoneyInputDigits(input, (input.dataset.moneyDigits || "").slice(0, -1));
          } else if (event.key === "Delete") {
            event.preventDefault();
            setMoneyInputDigits(input, "");
          }
        });
        input.addEventListener("input", () => {
          const digits = input.value.replace(/\D/g, "");
          setMoneyInputDigits(input, digits);
        });
      });
    }

    function formatDate(value) {
      if (!value) return "—";
      const d = new Date(`${value}T12:00:00`);
      return Number.isNaN(d.getTime()) ? "—" : shortDate.format(d);
    }

    function formatOperationDate(value) {
      if (!value) return "";
      const date = new Date(`${value}T12:00:00`);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" }).format(date);

    function formatOperationGroupDate(value) {
      if (!value) return "";
      const date = new Date(`${value}T12:00:00`);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric" }).format(date);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return EMPTY_STATE();
        const parsed = JSON.parse(raw);
        return migrateState(parsed);
      } catch (error) {
        console.error("Chargement localStorage impossible", error);
        return EMPTY_STATE();
      }
    }

    function migrateState(input) {
      const base = EMPTY_STATE();
      if (!input || typeof input !== "object") return base;
      const output = {
        ...base,
        ...input,
        version: STATE_VERSION,
        settings: { ...base.settings, ...(input.settings || {}) },
        incomes: Array.isArray(input.incomes) ? input.incomes.map(item => ({ ...item, category: item.category || "Salaire" })) : [],
        expenses: Array.isArray(input.expenses) ? input.expenses.map(item => ({ ...item, category: item.category === "Hygiène" ? "Hygiène corporelle" : item.category, healthReimbursement: normalizeHealthReimbursement(item.healthReimbursement) })) : [],
        fixedCharges: Array.isArray(input.fixedCharges) ? input.fixedCharges : [],
        credits: Array.isArray(input.credits) ? input.credits : [],
        projects: Array.isArray(input.projects) ? input.projects : [],
        envelopes: Array.isArray(input.envelopes) ? input.envelopes.map(item => ({ ...item, category: item.category === "Hygiène" ? "Hygiène corporelle" : item.category })) : []
      };
      output.fixedCharges = output.fixedCharges.map(item => ({ ...item, paidMonths: Array.isArray(item.paidMonths) ? item.paidMonths : [] }));
      return output;
    }

    function saveState(message = "") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!applyingCloudState) scheduleCloudSave();
      if (message) showSnackbar(message);
      renderAll();
      const scrollY = preservedScrollY;

      if (scrollY !== null) {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            window.scrollTo({ top: scrollY, left: 0, behavior: "auto" });

      const cfg = window.BUDGET_FIREBASE_CONFIG;
      return !!(cfg && cfg.apiKey && cfg.authDomain && cfg.projectId && cfg.appId);
    }

    function hasMeaningfulData(candidate) {
      if (!candidate) return false;
      return ["incomes", "expenses", "fixedCharges", "credits", "projects", "envelopes"]
        .some(key => Array.isArray(candidate[key]) && candidate[key].length > 0);
    }

    function initCloudSync() {
      if (cloud) return Promise.resolve(cloud);
      if (cloudInitPromise) return cloudInitPromise;
      if (!isFirebaseConfigured()) {
        renderProfile();
        return Promise.resolve(null);
      }

      cloudInitPromise = (async () => {
        try {
          const [appMod, authMod, storeMod] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js")
          ]);
          const app = appMod.initializeApp(window.BUDGET_FIREBASE_CONFIG);
          const auth = authMod.getAuth(app);
          const db = storeMod.getFirestore(app);
          const provider = new authMod.GoogleAuthProvider();
          cloud = { auth, db, provider, authMod, storeMod };

          authMod.onAuthStateChanged(auth, async user => {
            cloudUser = user || null;
            renderProfile();
            updateTopAccountButton();
            renderAccountModal();
            if (cloudUser) await reconcileCloudState();
          });
          return cloud;
        } catch (error) {
          console.error("Initialisation Firebase impossible", error);
          showSnackbar("Connexion cloud indisponible pour le moment.");
          return null;
        } finally {
          cloudInitPromise = null;
        }
      })();

      return cloudInitPromise;
    }

    function scheduleCloudSave() {
      if (!cloud || !cloudUser) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => writeCloudState().catch(error => {
        console.error("Synchronisation cloud impossible", error);
        showSnackbar("La sauvegarde cloud a échoué. Les données locales sont conservées.");
      }), 450);
    }

    async function writeCloudState() {
      if (!cloud || !cloudUser) return;
      const { doc, setDoc, serverTimestamp } = cloud.storeMod;
      await setDoc(doc(cloud.db, "budgetUsers", cloudUser.uid), {
        state,
        schemaVersion: STATE_VERSION,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function reconcileCloudState() {
      if (!cloud || !cloudUser) return;
      const { doc, getDoc } = cloud.storeMod;
      const ref = doc(cloud.db, "budgetUsers", cloudUser.uid);
      const snap = await getDoc(ref);
      if (!snap.exists() || !snap.data()?.state) {
        await writeCloudState();
        showSnackbar("Compte Google connecté. Les données locales sont sauvegardées en ligne.");
        return;
      }

      const remote = migrateState(snap.data().state);

      // Dès qu'une sauvegarde Firebase existe, elle devient la source de vérité.
      // Aucun dialogue de conflit : les données cloud sont chargées automatiquement.
      applyingCloudState = true;
      state = remote;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyingCloudState = false;
      renderAll();
    }

    function firebaseAuthErrorMessage(error) {
      const code = error?.code || "";
      if (code === "auth/unauthorized-domain") return "Domaine non autorisé dans Firebase Authentication.";
      if (code === "auth/operation-not-allowed") return "Connexion Google non activée dans Firebase Authentication.";
      if (code === "auth/popup-blocked") return "La fenêtre Google a été bloquée par le navigateur.";
      if (code === "auth/popup-closed-by-user") return "Connexion Google annulée.";
      if (code === "auth/network-request-failed") return "Erreur réseau pendant la connexion Google.";
      return code ? `Connexion Google impossible (${code}).` : "Connexion Google impossible.";
    }

    async function signInWithGoogle() {
      const readyCloud = cloud || await initCloudSync();
      if (!readyCloud) {
        showSnackbar("Connexion Google indisponible pour le moment.");
        return;
      }
      try {
        await readyCloud.authMod.signInWithPopup(readyCloud.auth, readyCloud.provider);
      } catch (error) {
        console.error("Connexion Google impossible", error);
        showSnackbar(firebaseAuthErrorMessage(error));
      }
    }

    function sum(list, selector = x => x) {
      return list.reduce((total, item) => total + safeNumber(selector(item)), 0);
    }

    function currentMonthIncomes() {
      return state.incomes.filter(item => isCurrentMonth(item.date));
    }

    function currentMonthExpenses() {
      return state.expenses.filter(item => isCurrentMonth(item.date));
    }

    function activeFixedCharges() {
      return state.fixedCharges.filter(item => item.active !== false);
    }

    function activeProjects() {
      return state.projects.filter(item => item.active !== false);
    }

    function financialSnapshot() {
      const income = sum(currentMonthIncomes().filter(isBudgetIncome), x => x.amount);
      const expenses = sum(currentMonthExpenses(), x => x.amount);
      const fixed = sum(activeFixedCharges(), x => x.amount);
      const projects = 0;
      const engaged = fixed + expenses;
      const remaining = income - engaged;
      const daily = expenses / averageDayCount();

      return {
        income, expenses, fixed, projects, engaged, remaining, daily,
        buckets: {
          needs: fixed,
          wants: expenses,
          savings: Math.max(0, remaining)
        }
      };
    }

    function financialStatus(snapshot) {
      if (snapshot.income === 0 && snapshot.engaged === 0) return { key: "neutral", label: "Neutre", icon: "horizontal_rule" };
      if (snapshot.remaining < 0 || (snapshot.income === 0 && snapshot.engaged > 0)) return { key: "deficit", label: "Déficit", icon: "trending_down" };
      if (snapshot.income > 0 && snapshot.remaining / snapshot.income < 0.15) return { key: "tension", label: "Tension", icon: "warning" };
      return { key: "controlled", label: "Maîtrisé", icon: "verified" };
    }

    function normalizeSearch(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
    }

    function globalSearchResults(query) {
      const q = normalizeSearch(query);
      if (!q) return [];
      const amountTokens = value => {
        const n = safeNumber(value);
        return [String(n), n.toFixed(2), String(n).replace(".", ","), n.toFixed(2).replace(".", ","), formatMoney(n)];
      };
      const rows = [];
      state.expenses.forEach(item => {
        rows.push({ type:"expense", id:item.id, icon:categoryIcon(item.category), kind:"Dépense", title:item.label,
          subtitle:`${item.category} · ${formatDate(item.date)}`, amount:-safeNumber(item.amount),
          haystack:[item.label,item.category,item.date,"dépense","depense",...amountTokens(item.amount)].join(" ") });
      });
      state.incomes.forEach(item => rows.push({
        type: "income", id: item.id, icon: "payments", kind: "Revenu", title: item.label,
        subtitle: `${item.category || "Salaire"} · ${formatDate(item.date)}`, amount: safeNumber(item.amount),
        haystack: [item.label, item.category || "Salaire", item.date, "revenu", ...amountTokens(item.amount)].join(" ")
      }));
      state.fixedCharges.forEach(item => rows.push({
        type: "fixed", id: item.id, icon: "event_repeat", kind: "Charge fixe", title: item.label,
        subtitle: `Jour ${safeNumber(item.day, 1)}`, amount: -safeNumber(item.amount),
        haystack: [item.label, "charge fixe", "charges fixes", item.day, ...amountTokens(item.amount)].join(" ")
      }));
      return rows.filter(row => normalizeSearch(row.haystack).includes(q)).slice(0, 50);
    }

    function renderGlobalSearchResults(query) {
      const results = globalSearchResults(query);
      if (!normalizeSearch(query)) return "";
      if (!results.length) return `<div class="empty-state" style="margin-top:10px"><span class="material-symbols-outlined">search_off</span><strong>Aucun résultat</strong><span>Essaie un libellé, une catégorie ou un montant.</span></div>`;
      return `<div class="home-search-results">${results.map(row => `
        <button class="list-item" data-edit-type="${row.type}" data-edit-id="${row.id}" style="width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer">

    function fixedChargeIsPending(charge) {
      const current = monthKey();
      if (selectedMonth < current) return false;
      if (selectedMonth > current) return true;
      return safeNumber(charge.day, 1) > new Date().getDate();
    }

    function renderFixedChargeRows(charges = [...activeFixedCharges()].sort((a,b) => safeNumber(a.day, 1) - safeNumber(b.day, 1))) {

      return `

          <div class="list-icon"><span class="material-symbols-outlined">${row.icon}</span></div>
          <div class="list-main"><div class="list-title">${escapeHtml(row.title)}</div>${subtitle}</div>
          <div class="list-side">${operationSignedAmount(row.amount)}</div>
        </div>`;
    }

    function operationCategoryItemsHtml(items) {
      const sortedItems = [...items].sort((a, b) => {
        const dateCompare = String(b.sortDate).localeCompare(String(a.sortDate));
        if (dateCompare) return dateCompare;
        return String(a.title).localeCompare(String(b.title), "fr", { sensitivity: "base" });
      });
      const groups = new Map();
      sortedItems.forEach(item => {
        const dateKey = String(item.sortDate || "");
        if (!groups.has(dateKey)) groups.set(dateKey, []);
        groups.get(dateKey).push(item);
      });
      return [...groups.entries()].map(([dateKey, dateItems]) => `
        <div class="operation-date-group">
          <div class="operation-date-heading">${escapeHtml(formatOperationGroupDate(dateKey))}</div>
          <div class="operation-date-items">${dateItems.map(item => operationRowHtml(item, true)).join("")}</div>
        </div>`).join("");
    }

    function renderOperations() {
      const container = document.getElementById("homeOperations") || document.getElementById("screen-operations");
      if (!container) return;

      const searchNeedle = normalizeSearch(operationSearch);
      let rows = operationRowsForSelectedMonth().filter(row => {
        const typeOk = operationTypeFilter === "all" || row.group === operationTypeFilter;
        if (!typeOk) return false;
        if (!searchNeedle) return true;
        return normalizeSearch([row.title, row.category, row.meta, Math.abs(row.amount), formatMoney(Math.abs(row.amount))].join(" ")).includes(searchNeedle);
      });

      rows.sort((a, b) => {
        if (operationSort === "category") {
          const categoryCompare = String(a.category).localeCompare(String(b.category), "fr", { sensitivity: "base" });
          if (categoryCompare) return categoryCompare;
          const dateCompare = String(b.sortDate).localeCompare(String(a.sortDate));
          if (dateCompare) return dateCompare;
          return String(a.title).localeCompare(String(b.title), "fr", { sensitivity: "base" });
        }
        if (operationSort === "amount") {
          const amountCompare = Math.abs(b.amount) - Math.abs(a.amount);
          if (amountCompare) return amountCompare;
          return String(b.sortDate).localeCompare(String(a.sortDate));
        }
        const dateCompare = String(b.sortDate).localeCompare(String(a.sortDate));
        if (dateCompare) return dateCompare;
        return String(a.title).localeCompare(String(b.title), "fr", { sensitivity: "base" });
      });

      let listHtml = "";
      if (!rows.length) {
        listHtml = emptyState("receipt_long", "Aucune opération", "Aucune opération ne correspond aux filtres sélectionnés.");
      } else if (operationSort === "category") {
        const groups = new Map();
        rows.forEach(row => {
          if (!groups.has(row.category)) groups.set(row.category, []);
          groups.get(row.category).push(row);
        });
        listHtml = [...groups.entries()].map(([category, items]) => {
          const total = sum(items, item => item.amount);
          const operationCount = items.length;
          return `
            <details class="expense-category-group" data-operation-category="${escapeHtml(category)}" ${expandedOperationCategories.has(category) ? "open" : ""}>
              <summary class="expense-category-summary">
                <div>
                  <div class="expense-category-label">${escapeHtml(category)}</div>
                  <div class="expense-category-meta">${operationCount} opération${operationCount > 1 ? "s" : ""}</div>
                </div>
                <div class="expense-category-total">${operationSignedAmount(total)}</div>
                <span class="material-symbols-outlined expense-category-chevron">expand_more</span>
              </summary>
              <div class="expense-category-items operations-category-items">${operationCategoryItemsHtml(items)}</div>
            </details>`;
        }).join("");
      } else {
        listHtml = rows.map(item => operationRowHtml(item, false)).join("");
      }

      const typeOptions = [
        ["all", "Toutes"],
        ["income", "Revenus"],
        ["fixed", "Charges fixes"],
        ["expense", "Dépenses"]
      ];

      container.innerHTML = `
        <div class="section" style="margin-top:12px">
          <div class="search-shell">
            <span class="material-symbols-outlined">search</span>
            <input id="operationSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="Rechercher une opération…" value="${escapeHtml(operationSearch)}">
            <button class="icon-btn ${operationSearch ? "" : "hidden"}" id="operationSearchClear" type="button" aria-label="Effacer"><span class="material-symbols-outlined">close</span></button>
          </div>

          <div class="operation-menu-backdrop" data-operation-menu-backdrop hidden aria-hidden="true"></div>

          <div class="operations-toolbar">
            <div>
              <h2 class="section-title">Opérations</h2>
              <p class="section-subtitle">${rows.length} opération${rows.length > 1 ? "s" : ""} affichée${rows.length > 1 ? "s" : ""}</p>
            </div>
            <div class="operations-toolbar-actions">
              <div class="operation-menu-wrap">
                <button class="btn tonal small" type="button" data-operation-add-toggle aria-expanded="false"><span class="material-symbols-outlined">add</span>Ajouter</button>
                <div class="operation-menu" data-operation-add-menu hidden>
                  <button type="button" data-add-type="income"><span class="material-symbols-outlined">payments</span>Revenu</button>
                  <button type="button" data-add-type="fixed"><span class="material-symbols-outlined">event_repeat</span>Charge fixe</button>
                  <button type="button" data-add-type="expense"><span class="material-symbols-outlined">receipt_long</span>Dépense</button>
                </div>
              </div>
            </div>
          </div>

          <div class="operation-filter-tabs" role="tablist" aria-label="Filtrer les opérations">
            ${typeOptions.map(([value, label]) => `<button type="button" class="operation-filter-tab ${operationTypeFilter === value ? "active" : ""}" data-operation-type="${value}" role="tab" aria-selected="${operationTypeFilter === value ? "true" : "false"}">${label}</button>`).join("")}
          </div>

          <div class="list operation-list">${listHtml}</div>
        </div>`;

      const operationBackdrop = container.querySelector("[data-operation-menu-backdrop]");
      const toggleOperationMenu = (selector, toggle) => {
        const menu = container.querySelector(selector);
        const willOpen = !!menu?.hidden;
        closeOperationMenus();
        if (willOpen && menu) {
          menu.hidden = false;
          toggle?.setAttribute("aria-expanded", "true");
          if (operationBackdrop) operationBackdrop.hidden = false;
        }
      };
      operationBackdrop?.addEventListener("pointerdown", event => {
        event.stopPropagation();
      });
      operationBackdrop?.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        closeOperationMenus();
      });

      container.querySelectorAll("[data-operation-type]").forEach(button => {
        button.addEventListener("click", () => {
          operationTypeFilter = button.dataset.operationType || "all";
          renderOperations();
        });
      });
      const searchInput = document.getElementById("operationSearchInput");
      searchInput?.addEventListener("input", event => {
        operationSearch = event.target.value;
        renderOperations();
        requestAnimationFrame(() => {
          const next = document.getElementById("operationSearchInput");
          if (next) {
            next.focus();
            next.setSelectionRange(next.value.length, next.value.length);
          }
        });
      });
      document.getElementById("operationSearchClear")?.addEventListener("click", () => {
        operationSearch = "";
        renderOperations();
      });

      container.querySelector("[data-operation-add-toggle]")?.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        toggleOperationMenu("[data-operation-add-menu]", event.currentTarget);
      });
      container.querySelectorAll("[data-operation-add-menu] [data-add-type]").forEach(button => {
        button.addEventListener("click", () => closeOperationMenus());
      });

      const operationCategoryList = container.querySelector(".operation-list");
      const syncOperationCategoryFocus = () => {
        const hasOpenCategory = !!container.querySelector("details[data-operation-category][open]");
        operationCategoryList?.classList.toggle("has-open-category", hasOpenCategory);
      };

      container.querySelectorAll("details[data-operation-category]").forEach(group => {
        group.addEventListener("toggle", () => {
          const category = group.dataset.operationCategory;
          if (!category) return;
          if (group.open) {
            container.querySelectorAll("details[data-operation-category][open]").forEach(other => {
              if (other !== group) other.open = false;
            });
            expandedOperationCategories.clear();
            expandedOperationCategories.add(category);
          } else {
            expandedOperationCategories.delete(category);
          }
          syncOperationCategoryFocus();
        });
      });
      syncOperationCategoryFocus();
    }

    function renderIncome() {
      const container = document.getElementById("screen-income");
      const items = [...currentMonthIncomes()].sort((a,b) => String(b.date).localeCompare(String(a.date)));
      const currentTotal = sum(currentMonthIncomes().filter(isBudgetIncome), x => x.amount);
      const listHtml = items.length ? items.map(item => `
        <div class="list-item income-list-item" data-edit-type="income" data-edit-id="${item.id}" role="button" tabindex="0">
          <div class="list-icon"><span class="material-symbols-outlined">arrow_downward</span></div>
          <div class="list-main">
            <div class="list-title">${escapeHtml(item.label)}</div>
            <div class="list-sub">${escapeHtml(item.category || "Salaire")} · ${formatDate(item.date)}</div>
          </div>
          <div class="list-side"><div class="list-amount money positive">+${formatMoney(item.amount)}</div></div>
        </div>`).join("") : emptyState("payments", "Aucun revenu", "Ajoute un salaire, un remboursement ou tout autre revenu.");

      container.innerHTML = `
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Revenus du mois</div>
            <div class="hero-value money">${formatMoney(currentTotal)}</div>
            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">calendar_month</span>${escapeHtml(selectedMonthLabel())}</span></div>
          </div>
        </div>
        <div class="section">
          <div class="section-header"><div><h2 class="section-title">Historique</h2></div><button class="btn tonal small" data-add-type="income"><span class="material-symbols-outlined">add</span>Ajouter</button></div>
          <div class="list">${listHtml}</div>
        </div>`;

    function renderExpenses() {
      const container = document.getElementById("screen-expenses");
      const monthItems = [...currentMonthExpenses()];
      const currentTotal = sum(monthItems, x => x.amount);
      const normalizedSearch = expenseSearch.trim().toLowerCase();
      const filtered = monthItems
        .filter(item => expenseFilter === "Toutes" || item.category === expenseFilter)
        .filter(item => !normalizedSearch || `${item.label} ${item.category}`.toLowerCase().includes(normalizedSearch))
        .sort((a, b) => {
          if (expenseSort === "category") {
            const categoryCompare = String(a.category || "").localeCompare(String(b.category || ""), "fr", { sensitivity: "base" });
            if (categoryCompare) return categoryCompare;
            return String(b.date).localeCompare(String(a.date));
          }
          if (expenseSort === "amount") return safeNumber(b.amount) - safeNumber(a.amount);
          if (expenseSort === "alpha") return String(a.label || "").localeCompare(String(b.label || ""), "fr", { sensitivity: "base" });
          return String(b.date).localeCompare(String(a.date));
        });

      const renderExpenseRow = item => `
        <div class="list-item expense-list-item" data-edit-type="expense" data-edit-id="${item.id}" role="button" tabindex="0">
          <div class="list-icon"><span class="material-symbols-outlined">${categoryIcon(item.category)}</span></div>
          <div class="list-main">
            <div class="list-title">${escapeHtml(item.label)}</div>
          </div>
          <div class="list-side"><div class="list-amount money negative">−${formatMoney(item.amount)}</div></div>
        </div>`;

      let listHtml;
      if (!filtered.length) {
        listHtml = emptyState("receipt_long", "Aucune dépense", "Les dépenses correspondant à tes filtres apparaîtront ici.");
      } else if (expenseSort === "category") {
        const groups = new Map();
        filtered.forEach(item => {
          const category = item.category || "Sans catégorie";
          if (!groups.has(category)) groups.set(category, []);
          groups.get(category).push(item);
        });
        listHtml = [...groups.entries()].map(([category, items]) => `
          <details class="expense-category-group" data-expense-category="${escapeHtml(category)}" ${expandedExpenseCategories.has(category) ? "open" : ""}>
            <summary class="expense-category-summary">
              <div>
                <div class="expense-category-label">${escapeHtml(category)}</div>
                <div class="expense-category-meta">${items.length} opération${items.length > 1 ? "s" : ""}</div>
              </div>
              <div class="expense-category-total money negative">−${formatMoney(sum(items, x => x.amount))}</div>
              <span class="material-symbols-outlined expense-category-chevron">expand_more</span>
            </summary>
            <div class="expense-category-items">${items.map(renderExpenseRow).join("")}</div>
          </details>`).join("");
      } else {
        listHtml = filtered.map(renderExpenseRow).join("");
      }

      const chips = ["Toutes", ...EXPENSE_CATEGORIES].map(cat => `<button class="chip ${expenseFilter === cat ? "active" : ""}" data-expense-filter="${cat}">${cat}</button>`).join("");

      container.innerHTML = `
        <div class="section">
          <div class="card hero-card">
            <div class="hero-label">Dépenses du mois</div>
            <div class="hero-value money">${formatMoney(currentTotal)}</div>
            <div class="hero-meta"><span class="daily-pill"><span class="material-symbols-outlined">receipt_long</span>${monthItems.length} dépense${monthItems.length > 1 ? "s" : ""}</span></div>
          </div>
        </div>
        <div class="section">
          <div class="search-shell">
            <span class="material-symbols-outlined">search</span>
            <input id="expenseSearch" type="search" placeholder="Rechercher un libellé ou une catégorie" autocomplete="off" value="${escapeHtml(expenseSearch)}">
          </div>
          <div class="chips" id="expenseFilters">${chips}</div>
        </div>
        <div class="section">
          <div class="section-header">
            <div>
              <h2 class="section-title">Dépenses</h2>
            </div>
            <div class="button-row">
              <button class="btn outlined small expense-filter-button" type="button" data-expense-filter-toggle aria-label="Filtrer" aria-controls="expenseFilters" title="Filtrer"><span class="material-symbols-outlined">filter_list</span></button>
              <div class="expense-sort">
                <button class="btn outlined small expense-sort-toggle" type="button" data-expense-sort-toggle aria-label="Trier" title="Trier" aria-expanded="false"><span class="material-symbols-outlined">sort</span></button>
                <div class="expense-sort-menu" data-expense-sort-menu hidden>
                  ${[["category", "Catégorie"], ["date", "Date"], ["amount", "Montant"], ["alpha", "Ordre alphabétique"]].map(([value, label]) => `<button class="expense-sort-option ${expenseSort === value ? "active" : ""}" type="button" data-expense-sort="${value}"><span class="material-symbols-outlined">${expenseSort === value ? "check" : ""}</span>${label}</button>`).join("")}
                </div>
              </div>
              <button class="btn tonal small" data-add-type="expense"><span class="material-symbols-outlined">add</span>Ajouter</button>
            </div>
          </div>
          <div class="list">${listHtml}</div>
        </div>`;

      const input = document.getElementById("expenseSearch");
      if (input) {
        input.addEventListener("input", e => {
          expenseSearch = e.target.value;
          renderExpenses();
          requestAnimationFrame(() => {
            const next = document.getElementById("expenseSearch");
            if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
          });
        });
      }

      container.querySelectorAll("details[data-expense-category]").forEach(group => {

          const category = group.dataset.expenseCategory;
          if (!category) return;
          if (group.open) expandedExpenseCategories.add(category);
          else expandedExpenseCategories.delete(category);

    function categoryIcon(category) {
      return {
        "Courses": "shopping_cart",
        "Carburant": "local_gas_station",
        "Beauté & soins": "spa",
        "Entretien maison": "cleaning_services",
        "Hygiène corporelle": "soap",
        "Loisirs": "sports_esports",
        "Restaurant": "restaurant",
        "Santé": "medical_services",
        "Autre": "category"
      }[category] || "receipt_long";
    }

    // REIMBURSEMENT-SWIPE-COMPLETE-V1
    function setHealthReimbursementCompleted(id, completed) {
      const expense = state.expenses.find(item => item.id === id);
      if (!expense) return;
      const reimbursement = normalizeHealthReimbursement(expense.healthReimbursement);
      if (!reimbursement.tracked) return;
      expense.healthReimbursement = {
        ...reimbursement,
        completed: !!completed,
        completedAt: completed ? todayISO() : ""
      };
      saveState(completed ? "Suivi de remboursement terminé." : "Suivi de remboursement rouvert.");
    }

    // REIMBURSEMENT-PROFILE-TRACKING-V1
    function reimbursementMonthLabel(month = reimbursementTrackingMonth) {
      const [year, monthNumber] = String(month || monthKey()).split("-").map(Number);
      const date = new Date(year, Math.max(0, (monthNumber || 1) - 1), 1, 12, 0, 0);
      const label = new Intl.DateTimeFormat("fr-FR", { month: "long", year: "numeric" }).format(date);
      return label.charAt(0).toUpperCase() + label.slice(1);
    }

    function reimbursementTrackingItems(month = reimbursementTrackingMonth) {
      return state.expenses
        .filter(item => item.category === "Santé" && monthKey(item.date) === month && healthReimbursementSummary(item))
        .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || String(a.label || "").localeCompare(String(b.label || ""), "fr", { sensitivity: "base" }));
    }

    function reimbursementSourceRow(label, icon, entry) {
      const amount = safeNumber(entry?.amount);
      const received = amount > 0 && entry?.date;
      return `<div class="reimbursement-source-row">
        <span class="reimbursement-source-name"><span class="material-symbols-outlined">${icon}</span><span><strong>${escapeHtml(label)}</strong><small>${received ? `Reçu le ${escapeHtml(formatOperationDate(entry.date))}` : "En attente"}</small></span></span>
        <strong class="money ${amount > 0 ? "positive" : ""}">${amount > 0 ? `+${formatMoney(amount)}` : "—"}</strong>
      </div>`;
    }

    function reimbursementTrackingHtml() {
      const items = reimbursementTrackingItems();
      if (!items.length) return emptyState("medical_information", "Aucun remboursement suivi", `Aucune dépense Santé suivie en ${reimbursementMonthLabel().toLowerCase()}.`);

      const summaries = items.map(item => ({ item, summary: healthReimbursementSummary(item) })).filter(entry => entry.summary);
      const gross = sum(summaries, entry => entry.summary.gross);
      const refunded = sum(summaries, entry => entry.summary.total);
      const remaining = sum(summaries, entry => entry.summary.remaining);
      const percent = gross > 0 ? refunded / gross * 100 : 0;
      const overview = `<div class="card reimbursement-overview-card">
        <div class="reimbursement-overview-head"><span>${items.length} soin${items.length > 1 ? "s" : ""} suivi${items.length > 1 ? "s" : ""}</span><strong>${percent.toFixed(0)}%</strong></div>
        <div class="reimbursement-overview-grid">
          <span><small>Dépensé</small><strong class="money">${formatMoney(gross)}</strong></span>
          <span><small>Remboursé</small><strong class="money positive">${formatMoney(refunded)}</strong></span>
          <span><small>Reste</small><strong class="money">${formatMoney(remaining)}</strong></span>
        </div>
      </div>`;

      const cards = summaries.map(({ item, summary }) => {
        const reimbursement = summary.reimbursement;
        const displayStatus = summary.gross <= .005 ? "Montant à renseigner" : summary.status;
        if (reimbursement.completed) {
          return `<div class="card reimbursement-tracking-card reimbursement-tracking-card-completed" data-edit-type="expense" data-edit-id="${item.id}" role="button" tabindex="0">
            <div class="reimbursement-completed-main">
              <div class="reimbursement-completed-copy">
                <div class="reimbursement-completed-title-row"><h3>${escapeHtml(item.label || "Dépense Santé")}</h3><span class="reimbursement-completed-badge"><span class="material-symbols-outlined">check</span>Terminé</span></div>
                <p>${escapeHtml(formatOperationGroupDate(item.date))} · <span class="money">${formatMoney(summary.gross)}</span></p>
              </div>
              <span class="reimbursement-percent">${summary.percent.toFixed(0)}%</span>
            </div>
            <div class="reimbursement-completed-summary">
              <span><small>Remboursé</small><strong class="money positive">${formatMoney(summary.total)}</strong></span>
              <span><small>Reste à charge</small><strong class="money">${formatMoney(summary.remaining)}</strong></span>
            </div>
          </div>`;
        }
        return `<div class="card reimbursement-tracking-card" data-edit-type="expense" data-edit-id="${item.id}" role="button" tabindex="0">
          <div class="reimbursement-card-head">
            <div><h3>${escapeHtml(item.label || "Dépense Santé")}</h3><p>${escapeHtml(formatOperationGroupDate(item.date))} · <span class="money">${formatMoney(summary.gross)}</span></p></div>
            <span class="reimbursement-percent">${summary.percent.toFixed(0)}%</span>
          </div>
          <div class="reimbursement-status-row"><span>${escapeHtml(displayStatus)}</span><strong class="money">Reste ${formatMoney(summary.remaining)}</strong></div>
          <div class="progress-track"><div class="progress-fill success" style="width:${clamp(summary.percent,0,100)}%"></div></div>
          <div class="reimbursement-sources">
            ${reimbursementSourceRow("Sécurité sociale", "health_and_safety", reimbursement.socialSecurity)}
            ${reimbursementSourceRow("Mutuelle", "verified_user", reimbursement.mutual)}
          </div>
          <div class="reimbursement-swipe" data-reimbursement-swipe="${item.id}" style="--swipe-x:0px">
            <span class="reimbursement-swipe-label">Glisser pour terminer</span>
            <button class="reimbursement-swipe-handle" type="button" data-reimbursement-swipe-handle aria-label="Glisser pour terminer le suivi" tabindex="-1"><span class="material-symbols-outlined">chevron_right</span></button>
          </div>
        </div>`;
      }).join("");
      return `${overview}<div class="reimbursement-tracking-list">${cards}</div>`;
    }



    function renderProfile() {
      const container = document.getElementById("screen-profile");
      const monthExpenses = currentMonthExpenses();
      const hasAllCategoriesEnvelope = state.envelopes.some(env => env.category === "Toutes");
      const budgetedCategories = new Set(
        state.envelopes
          .map(env => env.category)
          .filter(category => category && category !== "Toutes")

        : monthExpenses.filter(item => !budgetedCategories.has(item.category));

      const outsideBudgetCount = outsideBudgetExpenses.length;
      const outsideBudgetHtml = outsideBudgetCount ? `
        <div class="card" style="border-color:color-mix(in srgb, var(--warning) 34%, var(--outline-variant))">
          <div class="section-header" style="margin:0">
            <div>
              <h3 class="section-title" style="font-size:16px">Hors budget</h3>
              <p class="section-subtitle">${outsideBudgetCount} ${outsideBudgetCount > 1 ? "dépenses" : "dépense"} · <span class="money">${formatMoney(outsideBudgetAmount)}</span></p>

            <span class="material-symbols-outlined" style="color:var(--warning)" aria-hidden="true">warning</span>
          </div>
          <div class="tiny" style="margin-top:7px">Dépenses dans des catégories sans enveloppe mensuelle.</div>
        </div>` : "";

      const regularEnvelopesHtml = state.envelopes.length ? state.envelopes.map(env => {
        const spent = sum(monthExpenses.filter(x => env.category === "Toutes" || x.category === env.category), x => x.amount);
        const limit = safeNumber(env.limit);
        const pct = limit > 0 ? (spent / limit) * 100 : 0;
        return `

      else document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.screen === currentScreen));

      return {

    function optionTags(options, selected) {
      return options.map(opt => {
        const value = typeof opt === "string" ? opt : opt.value;
        const label = typeof opt === "string" ? opt : opt.label;
        return `<option value="${escapeHtml(value)}" ${String(selected) === String(value) ? "selected" : ""}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function enhanceNumericInputs(root) {
      root.querySelectorAll('input[type="number"]').forEach(input => {
        const step = String(input.getAttribute("step") || "1");
        const integerInput = step === "1";
        input.inputMode = integerInput ? "numeric" : "decimal";
        input.setAttribute("enterkeyhint", "done");

        input.addEventListener("focus", () => {
          if (input.disabled || input.readOnly) return;
          input.dataset.focusOriginalValue = input.value;
          if (input.value !== "") {
            input.value = "";
            input.dataset.clearedOnFocus = "true";
          } else {
            delete input.dataset.clearedOnFocus;
          }
        });

        input.addEventListener("blur", () => {
          if (input.value === "" && input.dataset.clearedOnFocus === "true") {
            input.value = input.dataset.focusOriginalValue || "";
          }
          delete input.dataset.clearedOnFocus;
          delete input.dataset.focusOriginalValue;
        });
      });
    }

      const category = target.querySelector('[name="category"]');
      const section = target.querySelector("[data-health-reimbursement-section]");
      const tracking = target.querySelector('[name="healthReimbursementTracked"]');
      const details = target.querySelector("[data-health-reimbursement-details]");

      if (!category || !section || !tracking || !details) return;

      const sync = () => {
        const isHealth = category.value === "Santé";
        const isTracking = isHealth && tracking.checked;
        section.hidden = !isHealth;
        details.hidden = !isTracking;
        modal?.classList.toggle("health-reimbursement-available", isHealth);
        modal?.classList.toggle("health-reimbursement-open", isTracking);
        if (isTracking) updateHealthReimbursementPreview(target);
      };

      category.addEventListener("change", sync);
      tracking.addEventListener("change", sync);
      ["amount", "healthSocialSecurityAmount", "healthMutualAmount"].forEach(name => {
        target.querySelector(`[name="${name}"]`)?.addEventListener("input", () => updateHealthReimbursementPreview(target));
      });
      sync();
    }

    function handleEntitySubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const fd = new FormData(form);
      const type = fd.get("entityType");
      const id = form.dataset.editId || null;
      const current = id ? getEntity(type, id) : null;
      let item;

      if (type === "expense") {
        const category=fd.get("category")||"Autre", tracked=category==="Santé"&&fd.get("healthReimbursementTracked")==="on";
        const ss=tracked?moneyInputValue(form,"healthSocialSecurityAmount"):0, mutual=tracked?moneyInputValue(form,"healthMutualAmount"):0;
        const ssDate=tracked?String(fd.get("healthSocialSecurityDate")||""):"", mutualDate=tracked?String(fd.get("healthMutualDate")||""):"";
        if(ss>0&&!ssDate){showSnackbar("Ajoute la date du remboursement Sécurité sociale.");form.querySelector('[name="healthSocialSecurityDate"]')?.focus();return;}
        if(mutual>0&&!mutualDate){showSnackbar("Ajoute la date du remboursement mutuelle.");form.querySelector('[name="healthMutualDate"]')?.focus();return;}
        const previousHealth=normalizeHealthReimbursement(current?.healthReimbursement);
        item={ id:id||uid("exp"), label:String(fd.get("label")||"").trim(), amount:moneyInputValue(form,"amount"), date:fd.get("date")||todayISO(), category, bucket:"wants", healthReimbursement:{ tracked, completed:tracked?previousHealth.completed:false, completedAt:tracked?previousHealth.completedAt:"", socialSecurity:{amount:ss,date:ss>0?ssDate:""}, mutual:{amount:mutual,date:mutual>0?mutualDate:""} } };
      } else if (type === "income") {
        item = { id: id || uid("inc"), label: String(fd.get("label") || "").trim(), amount: moneyInputValue(form, "amount"), date: fd.get("date") || todayISO(), category: fd.get("category") || "Salaire" };
      } else if (type === "fixed") {
        item = {
          id: id || uid("fix"), label: String(fd.get("label") || "").trim(), amount: moneyInputValue(form, "amount"),
          day: clamp(Math.round(safeNumber(fd.get("day"), 1)), 1, 31), category: String(fd.get("category") || current?.category || "Abonnements"), bucket: "needs", active: true,
          paidMonths: current?.paidMonths || []
        };
      } else if (type === "project") {
        item = {
          id: id || uid("prj"), name: String(fd.get("name") || "").trim(), target: moneyInputValue(form, "target"), current: moneyInputValue(form, "current"),
          monthlyAllocation: moneyInputValue(form, "monthlyAllocation"), active: fd.get("active") === "on"
        };
      } else if (type === "envelope") {
        item = { id: id || uid("env"), name: String(fd.get("name") || "").trim(), category: fd.get("category") || "Toutes", limit: moneyInputValue(form, "limit") };
      } else return;

      const collection = collectionForType(type);
      if (!collection) return;
      if (id) {
        const idx = state[collection].findIndex(x => x.id === id);
        if (idx >= 0) state[collection][idx] = item;
      } else {
        state[collection].push(item);
      }
      closeModal("entityModal");
      saveState(`${entityLabel(type)} ${id ? "modifié" : "ajouté"}.`);
    }

    function deleteEntity(type, id) {
      const collection = collectionForType(type);
      if (!collection) return;
      const item = getEntity(type, id);
      if (!item) return;
      if (!confirm(`Supprimer définitivement « ${item.label || item.name || entityLabel(type)} » ?`)) return;
      state[collection] = state[collection].filter(x => x.id !== id);
      closeModal("entityModal");
      saveState(`${entityLabel(type)} supprimé.`);
    }

    function toggleChargePaid(id) {
      const charge = state.fixedCharges.find(x => x.id === id);
      if (!charge) return;
      const mk = selectedMonth;
      charge.paidMonths = Array.isArray(charge.paidMonths) ? charge.paidMonths : [];
      if (charge.paidMonths.includes(mk)) charge.paidMonths = charge.paidMonths.filter(x => x !== mk);
      else charge.paidMonths.push(mk);
      saveState(charge.paidMonths.includes(mk) ? "Charge marquée comme prélevée." : "Charge marquée comme à venir.");
    }

    async function exportJSON() {
      const filename = `Budget-${todayISO()}.json`;
      const payload = { ...state, exportedAt: new Date().toISOString() };
      const content = JSON.stringify(payload, null, 2);
      let file = null;
      if (typeof File === "function") file = new File([content], filename, { type: "application/json" });
      const canShareFile = file && typeof navigator.share === "function"
        && typeof navigator.canShare === "function"
        && navigator.canShare({ files: [file] });

      if (canShareFile) {
        try {
          await navigator.share({
            files: [file],
            title: "Sauvegarde Budget",
            text: "Sauvegarde de mes données Budget"
          });
          showSnackbar("Sauvegarde prête à être partagée.");
          return;
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
      }

      downloadBlob(filename, content, "application/json;charset=utf-8");
      showSnackbar("Sauvegarde JSON exportée.");
    }

      const str = String(value ?? "");

\r]/.test(str) ? `"${str.replaceAll('"', '""')}"` : str;
    }

    function exportCSV() {
      const headers = ["type","id","libelle","montant","date","categorie","affectation","jour","actif","capital_initial","capital_restant","taux_annuel","mensualite","objectif","epargne_actuelle","allocation_mensuelle","plafond"];
